lmoshli fe'llar, inkor","qoidalar":[["Ikki olmoshli fe'l","كَتَبَ + ـهُ → يَكْتُبُهُ · وَجَدْتُمَا + ـهُ → وَجَدْتُمَاهُ · أَعْطَيْتُمْ + ـهُمَا → أَعْطَيْتُمُوهُمَا (tum + و)."],["لَيْسَ tuslanishi","لَسْتُ، لَسْتَ، لَسْتِ، لَيْسَ، لَيْسَتْ، لَسْنَا، لَسْتُمْ، لَيْسُوا، لَيْسَا. Xabari mansub: لَسْتُمْ مُتْعَبِينَ."],["Inkor — zamonga qarab","Hozir: لَا أُحِبُّ · O'tgan: لَمْ أُسَافِرْ / مَا سَافَرْتُ · Kelasi: لَنْ أُسَافِرَ · Ismiy gap: لَيْسَ الْجَوُّ بَارِدًا."],["Ob-havo","مُتَقَلِّبٌ، زَخَّاتُ الْمَطَرِ، دَرَجَةٌ مِئْوِيَّةٌ، مِظَلَّةٌ، مِعْطَفٌ، لِحَافٌ، مِدْفَأَةٌ؛ الشِّتَاءُ عَلَى الْأَبْوَابِ."]],"muhodasa":[["كَيْفَ الطَّقْسُ الْيَوْمَ؟ وَكَمْ دَرَجَةً؟","Bugun ob-havo qanday, necha daraja?","..."],["مَاذَا تَلْبَسُ فِي الشِّتَاءِ؟","Qishda nima kiyasiz?","أَلْبَسُ الْمِعْطَفَ وَالشَّالَ ..."],["هَلْ تَحْمِلُ مِظَلَّةً دَائِمًا؟","Doim soyabon olib yurasizmi?","لَا، لَا أَحْمِلُهَا دَائِمًا."],["هَلْ سَافَرْتَ فِي الشِّتَاءِ؟","Qishda safar qilganmisiz?","لَا، لَمْ أُسَافِرْ فِي الشِّتَاءِ. / نَعَمْ ..."],["أَيُّ فَصْلٍ لَا تُحِبُّهُ؟ لِمَاذَا؟","Qaysi faslni yoqtirmaysiz? Nega?","لَا أُحِبُّ ..."],["هَلْ الطَّقْسُ فِي بَلَدِكَ مُتَقَلِّبٌ؟","Yurtingizda ob-havo o'zgaruvchanmi?","..."],["أَيْنَ وَضَعْتَ هَاتِفَكَ؟ هَلْ وَجَدْتَهُ بِسُرْعَةٍ؟","Telefoningizni qayerga qo'ydingiz? Tez topdingizmi?","وَجَدْتُهُ ..."],["هَلْ سَتُسَافِرُ غَدًا؟ (inkor bilan javob)","Ertaga safar qilasizmi?","لَا، لَنْ أُسَافِرَ غَدًا."],["«أَنْتُمْ» + لَيْسَ","","لَسْتُمْ"],["«Ikki xodim band emas»","","الْمُوَظَّفَانِ لَيْسَا مَشْغُولَيْنِ."],["«Sizlar ularni (ikkisini) berdingiz»","","أَعْطَيْتُمُوهُمَا"]],"faoliyat":"«Yolg'on ob-havo»: ustoz noto'g'ri ob-havo xabarini aytadi («bugun qor yog'yapti, 40 daraja»). O'quvchilar har gapni inkor bilan to'g'rilaydi: لَيْسَ الْجَوُّ …، لَمْ يَسْقُطِ الثَّلْجُ …","matn":{"sarlavha":"الشِّتَاءُ عَلَى الْأَبْوَابِ","sarlavha_uz":"Qish eshik oldida","ar":["فِي هَذَا الْأُسْبُوعِ أَصْبَحَ الطَّقْسُ مُتَقَلِّبًا.","يَوْمَ الِاثْنَيْنِ كَانَتِ الشَّمْسُ مُشْرِقَةً، وَيَوْمَ الثُّلَاثَاءِ سَقَطَتْ زَخَّاتُ الْمَطَرِ.","قَالَتْ أُمِّي: الشِّتَاءُ عَلَى الْأَبْوَابِ، لَا تَخْرُجْ بِدُونِ مِعْطَفٍ.","لَمْ أَسْمَعْ كَلَامَهَا، وَخَرَجْتُ بِقَمِيصٍ خَفِيفٍ، وَلَمْ آخُذِ الْمِظَلَّةَ.","فِي الطَّرِيقِ نَزَلَ الْمَطَرُ بِقُوَّةٍ، فَرَجَعْتُ إِلَى الْبَيْتِ مُبْتَلًّا.","فِي الْمَسَاءِ أَحْضَرَتْ لِي أُمِّي شَايًا سَاخِنًا وَلِحَافًا، وَجَلَسْتُ بِجَانِبِ الْمِدْفَأَةِ.","الْآنَ لَنْ أَخْرُجَ بِدُونِ مِعْطَفٍ، وَلَسْتُ أَنْسَى نَصِيحَةَ أُمِّي."],"uz":"Bu hafta ob-havo o'zgaruvchan bo'lib qoldi. Dushanba kuni quyosh charaqlab turdi, seshanba kuni shiddatli yomg'ir yog'di. Onam dedi: qish eshik oldida, paltosiz chiqma. Men uning gapini eshitmadim, yengil ko'ylakda chiqdim va soyabonni olmadim. Yo'lda yomg'ir kuchli yog'di, uyga ho'l bo'lib qaytdim. Kechqurun onam menga issiq choy va ko'rpa olib keldi, men pechka yonida o'tirdim. Endi paltosiz chiqmayman va onamning nasihatini unutmayman.","savollar":[["كَيْفَ كَانَ الطَّقْسُ يَوْمَ الثُّلَاثَاءِ؟","Seshanba ob-havo qanday edi?","سَقَطَتْ زَخَّاتُ الْمَطَرِ."],["مَاذَا قَالَتِ الْأُمُّ؟","Ona nima dedi?","لَا تَخْرُجْ بِدُونِ مِعْطَفٍ."],["هَلْ أَخَذَ الْمِظَلَّةَ؟","Soyabonni oldimi?","لَا، لَمْ يَأْخُذْهَا."],["اِسْتَخْرِجْ مِنَ النَّصِّ ثَلَاثَ أَدَوَاتِ نَفْيٍ.","Matndan 3 ta inkor vositasini toping","لَمْ، لَنْ، لَيْسَ (لَسْتُ)، لَا (taqiq)"]],"gloss":[["مُبْتَلٌّ","ho'l"],["بِقُوَّةٍ","kuchli"],["مِدْفَأَةٌ","pechka, isitgich"]]},"lugat":[["اَلْخَمِيسُ","Payshanba"],["اَلشَّالُ","Sharf, ro'mol"],["اَلِاثْنَيْنِ","Dushanba"],["أَفْضَلُ","Eng yaxshi, afzal"],["بَدْلَةٌ","Kostyum"],["اَلْأَرْبِعَاءُ","Chorshanba"],["مُتَقَلِّبٌ","O'zgaruvchan, beqaror"],["مَحَلٌّ","Do'kon, rasta"],["عَلَى الْأَبْوَابِ","Eshik oldida (yaqinlashdi)"],["لِحَافٌ","Ko'rpa"],["حَبِيبٌ","Sevimli, suyukli"],["عُنُقٌ","Bo'yin"],["كُلُّ مَا فِي الْأَمْرِ","Gap shundaki, bor gap shu"],["اِهْتَمَّ","G'amxo'rlik qilmoq, e'tibor bermoq"],["نَفْسٌ","O'zi; jon, nafs"],["حَالَةٌ","Holat, ahvo َوْعِدَ (ذَكَّرَ)",["أَعْرِفُ أَنَّكُمَا نَسِيتُمَا المَوْعِدَ، لِذَلِكَ ذَكَّرْتُكُمْ.","أَعْرِفُ أَنَّكُمَا نَسِيتُمَا المَوْعِدَ، لِذَلِكَ ذَكَّرْتُهُمَا.","أَعْرِفُ أَنَّكُمَا نَسِيتُمَا المَوْعِدَ، لِذَلِكَ أُذَكِّرُكُمَا.","أَعْرِفُ أَنَّكُمَا نَسِيتُمَا المَوْعِدَ، لِذَلِكَ ذَكَّرْتُكُمَا."],3,"«أَنْتُمَا» → «ذَكَّرْتُكُمَا»."],["Sababga koʻra fe'lni toʻgʻri olmosh va shaklda moslang:\nلَقَدْ أَعْجَبَكَ هَذَا القَمِيصُ (اِشْتَرَى)",["لَقَدْ أَعْجَبَكَ هَذَا القَمِيصُ، لِذَلِكَ اِشْتَرَيْتَهُ.","لَقَدْ أَعْجَبَكَ هَذَا القَمِيصُ، لِذَلِكَ اِشْتَرَيْتَهَا.","لَقَدْ أَعْجَبَكَ هَذَا القَمِيصُ، لِذَلِكَ تَشْتَرِيهِ.","لَقَدْ أَعْجَبَكَ هَذَا القَمِيصُ، لِذَلِكَ اِشْتَرَيْتُهُ."],0,"«أَنْتَ» + «القَمِيصُ» (m) → «اِشْتَرَيْتَهُ»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\nقَالُوا: ............ يَنْزِلَ المَطَرُ طَوَالَ الأُسْبُوعِ القَادِمِ.",["لَيْسَ","لَنْ","مَا","لَمْ"],1,"Kelasi zamon inkori → «لَنْ»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\n............ سَمِعْتُ بِهَذَا المَوْضُوعِ مِنْ قَبْلُ.",["لَا","لَمْ","مَا","لَنْ"],2,"Oʻtgan ish inkori (maziy) → «مَا»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\nالوَالِدَانِ ............ يُرِيدَانِ لِأَوْلَادِهِمَا إِلَّا الخَيْرَ.",["لَا","لَمْ","لَنْ","لَيْسَ"],0,"Hozirgi/odat inkori → «لَا»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\nتَعَالَ مَعِي يَا أَخِي، ............ بَيْتِي بَعِيدًا مِنْ هُنَا.",["لَنْ","لَيْسَ","لَمْ","مَا"],1,"Ism (xabar) inkori → «لَيْسَ»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\nهَلْ أَنْتَ مُتْعَبٌ يَا أَحْمَدُ؟ اليَوْمَ ............ تَتَكَلَّمْ فِي الصَّفِّ.",["لَيْسَ","لَنْ","لَمْ","مَا"],2,"Oʻtgan zamon (jazm) inkori → «لَمْ»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\nيَجِيبُ أَنْ تَذْهَبَ أُمِّي إِلَى المُسْتَشْفَى، أَشْعُرُ أَنَّهَا ............ بِخَيْرٍ.",["لَنْ","لَيْسَتْ","مَا","لَمْ"],1,"«هِيَ» ism inkori → «لَيْسَتْ»."],["Boʻsh joyga mos inkor (yoʻqlik) yuklamasini tanlang:\nصَدِيقِي أَيْنَ أَنْتَ؟ ............ رَأَيْتُكَ مُنْذُ شَهْرٍ.",["مَا","لَنْ","لَيْسَ","لَا"],0,"Maziy inkori → «مَا»."],["Gapni mos inkor yuklamasi bilan toʻgʻri inkor qiling:\nهَلْ يَعِيشُ السَّمَكُ خَارِجَ المَاءِ؟",["لَنْ يَعِيشَ السَّمَكُ خَارِجَ المَاءِ.","لَا يَعِيشُ السَّمَكُ خَارِجَ المَاءِ.","لَمْ يَعِشْ السَّمَكُ خَارِجَ المَاءِ.","مَا يَعِيشُ السَّمَكُ خَارِجَ المَاءِ."],1,"Hozirgi haqiqat inkori: «لَا يَعِيشُ»."],["Gapni mos inkor yuklamasi bilan toʻgʻri inkor qiling:\nهَلْ رَأَيْتَ صَدِيقِي عَامِرًا؟",["مَا رَأَيْتُ صَدِيقَكَ عَامِرًا.","لَا أَرَى صَدِيقَكَ عَامِرًا.","لَنْ أَرَى صَدِيقَكَ عَامِرًا.","لَيْسَ رَأَيْتُ صَدِيقَكَ عَامِرًا."],0,"Maziy inkori: «مَا رَأَيْتُ»."],["Gapni mos inkor yuklamasi bilan toʻgʻri inkor qiling:\nهَلْ سَتُصَلِّي الجُمُعَةَ فِي مَسْجِدِ القَرْيَةِ؟",["لَمْ أُصَلِّ الجُمُعَةَ فِي مَسْجِدِ القَرْيَةِ.","مَا صَلَّيْتُ الجُمُعَةَ فِي مَسْجِدِ القَرْيَةِ.","لَنْ أُصَلِّيَ الجُمُعَةَ فِي مَسْجِدِ القَرْيَةِ.","لَيْسَ أُصَلِّي الجُمُعَةَ فِي مَسْجِدِ القَرْيَةِ."],2,"Kelasi inkori: «لَنْ أُصَلِّيَ» (mansub)."],["Gapni mos inkor yuklamasi bilan toʻgʻri inkor qiling:\nهَلِ الِامْتِحَانُ سَهْلٌ؟",["لَيْسَ الِامْتِحَانُ سَهْلٌ.","لَيْسَ الِامْتِحَانُ سَهْلًا.","مَا الِامْتِحَانُ سَهْلٌ.","لَنْ يَكُونَ الِامْتِحَانُ سَهْلًا."],1,"«لَيْسَ» dan keyin xabar mansub: «سَهْلًا»."],["Gapni mos inkor yuklamasi bilan toʻgʻri inkor qiling:\nهَلْ أَتَى المُدِيرُ اليَوْمَ إِلَى الشَّرِكَةِ؟",["لَمْ يَأْتِ المُدِيرُ اليَوْمَ إِلَى الشَّرِكَةِ.","لَا يَأْتِي المُدِيرُ اليَوْمَ إِلَى الشَّرِكَةِ.","لَنْ يَأْتِيَ المُدِيرُ اليَوْمَ إِلَى الشَّرِكَةِ.","لَيْسَ أَتَى المُدِيرُ اليَوْمَ إِلَى الشَّرِكَةِ."],0,"Maziy (jazm) inkori: «لَمْ يَأْتِ»."],["Gapni mos inkor yuklamasi bilan toʻgʻri inkor qiling:\nهَلْ تَشْرَبُونَ القَهْوَةَ صَبَاحًا؟",["لَمْ نَشْرَبْ القَهْوَةَ صَبَاحًا.","مَا شَرِبْنَا القَهْوَةَ صَبَاحًا.","لَنْ نَشْرَبَ القَهْوَةَ صَبَاحًا.","لَا نَشْرَبُ القَهْوَةَ صَبَاحًا."],3,"Hozirgi/odat inkori: «لَا نَشْرَبُ»."],["Gapni mos inkor yuklamasi bilan l majzum: لَا تَجْلِسْ، لَا تَجْلِسِي (ن tushadi)، لَا تَكْتُبَا، لَا تَكْتُبُوا."],["Xarid iboralari","تَخْفِيضَاتٌ · فُرْصَةٌ لَنْ تُعَوَّضَ · غُرْفَةُ تَبْدِيلِ الْمَلَابِسِ · مَقَاسٌ · خَاصٌّ بِـ · هَلْ يُمْكِنُ أَنْ أَقِيسَهُ؟"]],"muhodasa":[["مَتَى تَشْتَرِي الْمَلَابِسَ عَادَةً؟ فِي التَّخْفِيضَاتِ؟","Kiyimni odatda qachon olasiz?","..."],["مَا آخِرُ شَيْءٍ اشْتَرَيْتَهُ؟","Oxirgi sotib olgan narsangiz?","آخِرُ شَيْءٍ اشْتَرَيْتُهُ ..."],["هَلْ تَقِيسُ الْمَلَابِسَ قَبْلَ الشِّرَاءِ؟","Sotib olishdan oldin kiyib ko'rasizmi?","..."],["مَنِ الشَّخْصُ الَّذِي يُسَاعِدُكَ فِي اخْتِيَارِ الْمَلَابِسِ؟","Kiyim tanlashda kim yordam beradi?","الشَّخْصُ الَّذِي ... هُوَ ..."],["هَلْ تَشْتَرِي اللُّحُومَ الْمُثَلَّجَةَ؟ لِمَاذَا؟","Muzlatilgan go'sht olasizmi?","لَا، لَا أَشْتَرِيهَا لِأَنَّ ..."],["مَا الْمَتْجَرُ الَّذِي تُحِبُّهُ فِي مَدِينَتِكَ؟","Shahringizdagi yoqtirgan do'koningiz?","الْمَتْجَرُ الَّذِي أُحِبُّهُ ..."],["(rol: sotuvchi) هَذِهِ فُرْصَةٌ لَنْ تُعَوَّضَ!","Bu qaytarilmas imkoniyat! (javob bering)","..."],["أَعْطِ نَصِيحَةً لِصَدِيقٍ يُسْرِفُ فِي التَّسَوُّقِ.","Isrofgar do'stga maslahat bering (taqiq bilan)","لَا تَشْتَرِ كُلَّ شَيْءٍ! لَا تُسْرِفْ!"],["«الطَّاوِلَةُ ___ اشْتَرَيْتُهَا» va «الْكِتَابُ ___ قَرَأْتُهُ»","","الَّتِي · الَّذِي"],["«Otam va onam sotib olishmaydi»","","أَبِي وَأُمِّي لَا يَشْتَرِيَانِ."],["Ikkingizga taqiq: «Yozmanglar!»; ayolga: «O'tirma!»","","لَا تَكْتُبَا · لَا تَجْلِسِي"]],"faoliyat":"«Kim u?» o'yini: o'quvchi ism mavsul bilan topishmoq aytadi: «هُوَ الَّذِي يَبِيعُ اللَّحْمَ» (qassob), «هِيَ الَّتِي تُعَالِجُ الْمَرْضَى». Boshqalar topadi.","matn":{"sarlavha":"يَوْمُ التَّخْفِيضَاتِ","sarlavha_uz":"Chegirmalar kuni","ar":["أَعْلَنَ الْمَتْجَرُ الْكَبِيرُ الَّذِي فِي وَسَطِ الْمَدِينَةِ عَنْ تَخْفِيضَاتٍ تَصِلُ إِلَى خَمْسِينَ فِي الْمِائَةِ.","ذَهَبَتْ لَيْلَى مَعَ أُخْتِهَا مُبَكِّرًا، لِأَنَّ الْفُرْصَةَ لَنْ تُعَوَّضَ.","كَانَ الْمَتْجَرُ مَلِيئًا بِالنَّاسِ الَّذِينَ جَاؤُوا مِنْ كُلِّ مَكَانٍ.","اخْتَارَتْ لَيْلَى فُسْتَانًا أَحْمَرَ، وَقَاسَتْهُ فِي غُرْفَةِ تَبْدِيلِ الْمَلَابِسِ، وَلَكِنَّ مَقَاسَهُ كَانَ صَغِيرًا.","قَالَ الْبَائِعُ: لَا تَحْزَنِي، عِنْدَنَا مَقَاسٌ آخَرُ فِي الْفَرْعِ الثَّانِي، وَخِدْمَةُ التَّوْصِيلِ مَجَّانًا.","أَمَّا أُخْتُهَا فَلَمْ تَشْتَرِ شَيْئًا، وَقَالَتْ: لَا أَشْتَرِي إِلَّا مَا أَحْتَاجُهُ.","رَجَعَتَا إِلَى الْبَيْتِ، وَبَعْدَ يَوْمَيْنِ وَصَلَ الْفُسْتَانُ الَّذِي اشْتَرَتْهُ لَيْلَى."],"uz":"Shahar markazidagi katta do'kon ellik foizgacha chegirma e'lon qildi. Laylo singlisi bilan erta bordi, chunki bu qaytarilmas imkoniyat edi. Do'kon har tarafdan kelgan odamlarga to'la edi. Laylo qizil ko'ylak tanladi va kiyinish xonasida kiyib ko'rdi, lekin o'lchami kichik edi. Sotuvchi: xafa bo'lmang, boshqa filialda boshqa o'lcham bor, yetkazib berish bepul, dedi. Singlisi esa hech narsa olmadi va: faqat kerakli narsamni olaman, dedi. Ikkalasi uyga qaytishdi, ikki kundan keyin Laylo sotib olgan ko'ylak yetib keldi.","savollar":[["كَمْ كَانَتِ التَّخْفِيضَاتُ؟","Chegirma qancha edi?","تَصِلُ إِلَى خَمْسِينَ فِي الْمِائَةِ."],["مَا الْمُشْكِلَةُ فِي الْفُسْتَانِ؟","Ko'ylakda qanday muammo bor edi?","مَقَاسُهُ كَانَ صَغِيرًا."],["هَلِ اشْتَرَتِ الْأُخْتُ شَيْئًا؟ لِمَاذَا؟","Singlisi biror narsa oldimi?","لَا، لِأَنَّهَا لَا تَشْتَرِي إِلَّا مَا تَحْتَاجُهُ."],["فِي «لَا تَحْزَنِي» — «لَا» نَافِيَةٌ أَمْ نَاهِيَةٌ؟","Bu لَا inkormi yoki taqiq?","نَاهِيَةٌ (taqiq)."]],"gloss":[["فُسْتَانٌ","ko'ylak (ayollar)"],["اِخْتَارَ","tanladi"],["أَعْلَنَ","e'lon qildi"]]},"lugat":[["اِنْتِشَارٌ","Tarqalish, yoyilish"],["أَحْمَرُ","Qizil"],["بَنَى","Qurmoq"],["عَلَى غَيْرِ الْعَادَةِ","Odatdan tashqari"],["نَفَقٌ","Tunel"],["فَسَدَ","Buzilmoq, aynimoq"],["كَفَى","Yetarli bo'lmoq"],["فُرْصَةٌ لَنْ تُعَوَّضَ","Qaytarilmas imkoniyat"],["جَيِّدٌ","Yaxshi, sifatli"],["اَلَّذِينَ","...gan kishilar (muzakkar ko'plik)"],["عَوَّضَ","O'rnini to'ldirmoq, qoplamoq"],["لَا تَكْفِي","Yetarli emas"],["سِبَاقٌ","Poyga, musobaqa"],["صَحْنٌ","Likop, tarelka"],["اَللُّحُومُ الْ  shaxsga moslab taqiq (نهي) shakliga aylantiring:\nاُكْتُبْ وَاجِبَكَ لَيْلًا. (أَنْتُمَا)",["أَنْتُمَا لَا تَكْتُبْ وَاجِبَكَ لَيْلًا.","أَنْتُمَا لَا تَكْتُبَا وَاجِبَكُمَا لَيْلًا.","أَنْتُمَا لَا تَكْتُبُوا وَاجِبَكُمْ لَيْلًا.","أَنْتُمَا لَا تَكْتُبَانِ وَاجِبَكُمَا لَيْلًا."],1,"«أَنْتُمَا» taqiq → «لَا تَكْتُبَا»."],["Buyruqni qavs ichidagi shaxsga moslab taqiq (نهي) shakliga aylantiring:\nاِذْهَبْ قَبْلَ المَوْعِدِ بِسَاعَةٍ. (أَنْتِ)",["أَنْتِ لَا تَذْهَبْ قَبْلَ المَوْعِدِ بِسَاعَةٍ.","أَنْتِ لَا تَذْهَبِي قَبْلَ المَوْعِدِ بِسَاعَةٍ.","أَنْتِ لَا تَذْهَبِينَ قَبْلَ المَوْعِدِ بِسَاعَةٍ.","أَنْتِ لَا تَذْهَبْنَ قَبْلَ المَوْعِدِ بِسَاعَةٍ."],1,"«أَنْتِ» taqiq → «لَا تَذْهَبِي»."],["Buyruqni qavs ichidagi shaxsga moslab taqiq (نهي) shakliga aylantiring:\nاِسْتَمِعْ كَلَامَ النَّاسِ دَائِمًا. (أَنْتُمْ)",["أَنْتُمْ لَا تَسْتَمِعْ كَلَامَ النَّاسِ دَائِمًا.","أَنْتُمْ لَا تَسْتَمِعُوا كَلَامَ النَّاسِ دَائِمًا.","أَنْتُمْ لَا تَسْتَمِعُونَ كَلَامَ النَّاسِ دَائِمًا.","أَنْتُمْ لَا تَسْتَمِعْنَ كَلَامَ النَّاسِ دَائِمًا."],1,"«أَنْتُمْ» taqiq → «لَا تَسْتَمِعُوا»."],["Buyruqni qavs ichidagi shaxsga moslab taqiq (نهي) shakliga aylantiring:\nاُنْظُرْ إِلَى هَذِهِ الصُّورَةِ. (أَنْتُنَّ)",["أَنْتُنَّ لَا تَنْظُرْ إِلَى هَذِهِ الصُّورَةِ.","أَنْتُنَّ لَا تَنْظُرْنَ إِلَى هَذِهِ الصُّورَةِ.","أَنْتُنَّ لَا تَنْظُرُوا إِلَى هَذِهِ الصُّورَةِ.","أَنْتُنَّ لَا تَنْظُرِي إِلَى هَذِهِ الصُّورَةِ."],1,"«أَنْتُنَّ» taqiq → «لَا تَنْظُرْنَ»."],["Buyruqni qavs ichidagi shaxsga moslab taqiq (نهي) shakliga aylantiring:\nاِجْلِسْ عَلَى هَذَا الكُرْسِيِّ. (أَنْتِ)",["أَنْتِ لَا تَجْلِسْ عَلَى هَذَا الكُرْسِيِّ.","أَنْتِ لَا تَجْلِسِي عَلَى هَذَا الكُرْسِيِّ.","أَنْتِ لَا تَجْلِسْنَ عَلَى هَذَا الكُرْسِيِّ.","أَنْتِ لَا تَجْلِسِينَ عَلَى هَذَا الكُرْسِيِّ."],1,"«أَنْتِ» taqiq → «لَا تَجْلِسِي»."],["Gap turini aniqlang (amr / nahy / isbot / inkor):\nتَسْكُنُ عَائِلَتِي فِي حَيٍّ فَقِيرٍ.",["الأَمْرُ (Buyruq)","النَّهْيُ (Taqiq)","الإِثْبَاتُ (Darak/Tasdiq)","النَّفْيُ (Inkor)"], ajrur)."],["Olmosh muzofun ilayh","رَأْيُكُمْ، سَيَّارَتُنَا، عَمَلِي — olmosh ham muzofun ilayh hisoblanadi."],["Sog'liq iboralari","عِنْدِي صُدَاعٌ · ضَرْبَةُ شَمْسٍ · أَقْرَاصٌ مُسَكِّنَةٌ · صَيْدَلِيَّةٌ · مَا رَأْيُكَ أَنْ …؟ · بِالرَّغْمِ مِنْ."]],"muhodasa":[["مَاذَا تَفْعَلُ إِذَا شَعَرْتَ بِصُدَاعٍ؟","Boshingiz og'risa nima qilasiz?","أَسْتَرِيحُ / آخُذُ قُرْصًا مُسَكِّنًا ..."],["مَا الْأَطْعِمَةُ الْمُفِيدَةُ وَالْأَطْعِمَةُ الضَّارَّةُ فِي رَأْيِكَ؟","Foydali va zararli taomlar?","..."],["هَلْ تَشْرَبُ الْمِيَاهَ الْغَازِيَّةَ؟","Gazli ichimlik ichasizmi?","..."],["مَا نِظَامُ نَوْمِكَ؟","Uyqu tartibingiz qanday?","..."],["هَلْ أُصِبْتَ بِضَرْبَةِ شَمْسٍ؟","Oftob urganmi?","..."],["مَا رَأْيُكَ فِي التَّدْخِينِ؟","Chekish haqida fikringiz?","..."],["مَا رَأْيُكَ أَنْ نَمْشِيَ بَعْدَ الدَّرْسِ؟","Darsdan keyin yursakmi? (taklif)","فِكْرَةٌ جَيِّدَةٌ! / ..."],["مَا نَصِيحَةُ طَبِيبِكَ لَكَ؟","Shifokoringizning maslahati?","..."],["«Qiz maktabi», «ovqat menyusi» — muzofun ilayhni ayting","","مَدْرَسَةُ الْبِنْتِ · قَائِمَةُ الطَّعَامِ"],["«Bemorni ziyorat qilish — burch»: زِيَارَةُ nega marfu'?","","Mubtado."],["«Sizning fikringizni bilaman» — olmosh?","","أَعْرِفُ رَأْيَكُمْ — ـكُمْ muzofun ilayh."]],"faoliyat":"«Salomatlik jurnali»: har o'quvchi bir kunlik ovqat va harakatini izofa bilan aytadi: فُطُورُ الصَّبَاحِ، طَعَامُ الْغَدَاءِ، رِيَاضَةُ الْمَسَاءِ… Guruh eng sog'lom kunni tanlaydi.","matn":{"sarlavha":"نَصِيحَةُ الطَّبِيبِ","sarlavha_uz":"Shifokor nasihati","ar":["كَانَ كَرِيمٌ يَشْعُرُ بِصُدَاعٍ شَدِيدٍ كُلَّ يَوْمٍ، وَبِالرَّغْمِ مِنْ ذَلِكَ لَمْ يَذْهَبْ إِلَى الطَّبِيبِ.","كَانَ يَأْخُذُ الْأَقْرَاصَ الْمُسَكِّنَةَ مِنَ الصَّيْدَلِيَّةِ فَقَطْ.","فِي يَوْمٍ مِنَ الْأَيَّامِ قَالَتْ لَهُ زَوْجَتُهُ: مَا رَأْيُكَ أَنْ نَذْهَبَ إِلَى عِيَادَةِ الدُّكْتُورِ أَحْمَدَ؟","سَأَلَهُ الطَّبِيبُ عَنْ نِظَامِ نَوْمِهِ وَطَعَامِهِ.","قَالَ كَرِيمٌ: أَنَامُ مُتَأَخِّرًا، وَأَشْرَبُ الْمِيَاهَ الْغَازِيَّةَ وَالْعَصَائِرَ الْمُعَلَّبَةَ كَثِيرًا.","قَالَ الطَّبِيبُ: سَبَبُ الصُّدَاعِ قِلَّةُ النَّوْمِ وَقِلَّةُ الْمَاءِ. اِشْرَبِ الْمَاءَ، وَنَمْ مُبَكِّرًا، وَامْشِ فِي هَوَاءِ الْحَدِيقَةِ.","بَعْدَ شَهْرٍ تَحَسَّنَتْ حَالَةُ كَرِيمٍ، وَعَرَفَ أَنَّ صِحَّةَ الْجِسْمِ نِعْمَةٌ عَظِيمَةٌ."],"uz":"Karim har kuni qattiq bosh og'rig'ini sezardi, shunga qaramay shifokorga bormadi. U faqat dorixonadan og'riq qoldiruvchi tabletka olardi. Kunlardan bir kun xotini unga: doktor Ahmadning klinikasiga borsak-chi? dedi. Shifokor undan uyqu va ovqat tartibini so'radi. Karim: kech uxlayman, gazli suv va konserva sharbatlarni ko'p ichaman, dedi. Shifokor: bosh og'rig'ining sababi — uyqu va suv kamligi. Suv iching, erta uxlang, bog' havosida yuring, dedi. Bir oydan keyin Karimning ahvoli yaxshilandi va u tana sog'lig'i buyuk ne'mat ekanini bildi.","savollar":[["مَاذَا كَانَ يَأْخُذُ كَرِيمٌ؟","Karim nima olardi?","الْأَقْرَاصَ الْمُسَكِّنَةَ."],["مَنِ اقْتَرَحَتِ الذَّهَابَ إِلَى الطَّبِيبِ؟","Shifokorga borishni kim taklif qildi?","زَوْجَتُهُ."],["مَا سَبَبُ الصُّدَاعِ؟","Bosh og'rig'ining sababi?","قِلَّةُ النَّوْمِ وَقِلَّةُ الْمَاءِ."],["اِسْتَخْرِجْ ثَلَاثَ إِضَافَاتٍ مِنَ النَّصِّ.","Matndan 3 ta izofa toping","عِيَادَةِ الدُّكْتُورِ، نِظَامِ نَوْمِهِ، هَوَاءِ الْحَدِيقَةِ، صِحَّةَ الْجِسْمِ …"]],"gloss":[["صُدَاعٌ","bosh og'rig'i"],["قِلَّةٌ","kamlik"],["نِعْمَةٌ","ne'mat"]]},"lugat":[["مَا رَأْيُكَ أَنْ...؟","...ga nima deysan?"],["ضَرْبَةُ شَمْسٍ","Oftob urishi"],["قُوَّةٌ","Kuch"],["ثَقِيلٌ","Og'ir"],["وَصْفَةٌ عِلَاجِيَّةٌ","Davolash retsepti"],["تَامٌّ","To'liq, mukammal"],["أَدَّى","Olib bormoq, sabab bo'lmoq"],["رَأْسٌ","Bosh"],["ضَرْبَةٌ","Zarba, urish"],["ظَنَّ","O'ylamoq, gumon qilmoq"],["اَلتَّدْخِينُ","Chekish (sigaret)"],["اِعْتَنَى","G'amxo'rlik qilmoq, parvarishlamoq"],["اَلْهَوَاءُ","Havo"],["صُعُوبَةٌ","Qiyinchilik"],["مِئْذَنَةٌ","Minora"],["فَاسِدٌ","Buzilgan, aynigan"],["بَذَلَ","Sarflamoq (kuch, harakat)"],["مِيَاهٌ غَازِيَّةٌ","Gazlangan suvlar"],["ثِيَابٌ","Kiyimlar, liboslar"],["هُدُوءٌ","Tinchlik, sokinl َّرَتْ طَرِيقَةَ التَّوْظِيفِ؟","Texnologiya ishga yollashni o'zgartirdimi?","..."],["(rol: HR) لِمَاذَا تُرِيدُ هَذِهِ الْوَظِيفَةَ؟","Bu lavozimni nega xohlaysiz?","..."],["«أَيْنَ الْقَلَمُ؟» — makon zarfi bilan javob","","فَوْقَ الْمَكْتَبِ / بَيْنَ الْأَوْرَاقِ"],["«Nima haqida gaplashdingiz?» / «Nimadan yasalgan?»","","عَمَّ تَحَدَّثْتُمْ؟ · مِمَّ يُصْنَعُ؟"],["«Hech narsa o'zgarmadi»","","لَمْ يَتَغَيَّرْ شَيْءٌ."]],"faoliyat":"«Ish suhbati 2.0»: HR va nomzod. Nomzod rezyumesi haqida gapiradi (qachon bitirgan, qayerda ishlagan — zarflar bilan). HR kamida 5 ta turli so'roq so'zidan foydalanadi.","matn":{"sarlavha":"رِحْلَةُ الْبَحْثِ عَنْ عَمَلٍ","sarlavha_uz":"Ish qidirish safari","ar":["تَخَرَّجَ يُوسُفُ مِنْ كُلِّيَّةِ التِّجَارَةِ قَبْلَ سَنَةٍ، وَلَمْ يَحْصُلْ عَلَى عَمَلٍ حَتَّى الْآنَ.","فِي الْبِدَايَةِ كَانَ يَبْحَثُ فِي الْجَرَائِدِ الْوَرَقِيَّةِ، وَلَكِنَّ هَذِهِ الطَّرِيقَةَ عَفَا عَلَيْهَا الزَّمَنُ.","ثُمَّ نَصَحَهُ صَدِيقُهُ أَنْ يَنْشُرَ سِيرَتَهُ الذَّاتِيَّةَ فِي مَوَاقِعِ التَّوْظِيفِ.","بَعْدَ أُسْبُوعٍ اتَّصَلَتْ بِهِ شَرِكَةٌ، وَطَلَبَتْ مِنْهُ الْحُضُورَ يَوْمَ الْأَرْبِعَاءِ صَبَاحًا.","الشَّرِكَةُ تَقَعُ خَلْفَ الْمَحَطَّةِ، بَيْنَ الْبَنْكِ وَالصَّيْدَلِيَّةِ.","اسْتَمَرَّتِ الْمُقَابَلَةُ سَاعَةً وَاحِدَةً، وَسَأَلُوهُ عَنْ خِبْرَتِهِ وَعَنِ اللُّغَاتِ.","عَصْرًا جَاءَهُ الْخَبَرُ: لَقَدْ قَبِلُوكَ! فَفَرِحَ يُوسُفُ كَثِيرًا وَشَكَرَ صَدِيقَهُ."],"uz":"Yusuf bir yil oldin savdo fakultetini bitirgan, hozirgacha ish topmagan. Avvaliga qog'oz gazetalardan qidirardi, lekin bu usul eskirgan. So'ng do'sti unga rezyumesini ishga yollash saytlarida e'lon qilishni maslahat berdi. Bir haftadan keyin bir kompaniya qo'ng'iroq qilib, chorshanba ertalab kelishini so'radi. Kompaniya bekat orqasida, bank va dorixona orasida joylashgan. Suhbat bir soat davom etdi, undan tajribasi va tillar haqida so'rashdi. Asrda xabar keldi: sizni qabul qilishdi! Yusuf juda xursand bo'ldi va do'stiga rahmat aytdi.","savollar":[["مِنْ أَيِّ كُلِّيَّةٍ تَخَرَّجَ يُوس َلِمَتْ يَدَاكِ!"],"uz":"Ali universitetdan qaytib: juda qornim och, pitsa yemoqchiman! dedi. Onasi: fastfud yog'ga to'la, u semizlik sabablaridan biri, dedi. Keyin: kel, birga sog'lom taom tayyorlaymiz, dedi. Ali yangi sabzavotlarni yuvdi, onasi qiyma va piyozni to'g'radi. Ona: taom pishishi uchun yarim soat kutishimiz kerak, dedi. Alining singlisi esa salat va zakuskalar tayyorladi. Ovqatdan keyin Ali: haqsiz, onajon, bu pitsadan mazaliroq, qo'llaringiz dard ko'rmasin! dedi.","savollar":[["مَاذَا أَرَادَ عَلِيٌّ أَنْ يَأْكُلَ؟","Ali nima yemoqchi edi?","بِيتْزَا."],["لِمَاذَا رَفَضَتِ الْأُمُّ؟","Ona nega rozi bo'lmadi?","لِأَنَّ الْوَجَبَاتِ السَّرِيعَةَ مَلِيئَةٌ بِالدُّهُونِ."],["كَمْ مُدَّةً انْتَظَرُوا؟","Qancha kutishdi?","نِصْفَ سَاعَةٍ."],["مَاذَا فَعَلَتِ الْأُخْتُ؟","Singlisi nima qildi?","حَضَّرَتِ السَّلَطَةَ وَالْمُقَبِّلَاتِ."]],"gloss":[["يَنْضَجُ","pishadi"],["قَطَّعَ","to'g'radi"],["صِحِّيٌّ","sog'lom"]]},"lugat":[["لُغْزٌ","Topishmoq, jumboq"],["دُهْنٌ","Yog' (hayvon yog'i)"],["بَعْدَ قَلِيلٍ","Birozdan so'ng"],["مُقْبِلٌ","Kelgusi, kelayotgan"],["تَمَّ","Amalga oshmoq, bajarilmoq"],["حَضَّرَ","Tayyorlamoq"],["قُبْلَةٌ","O'pich, bo'sa"],["كَبُرَ","Ulg'aymoq, katta bo'lmoq"],["عَشِقَ","Ishqiboz bo'lmoq, juda sevmoq"],["قَسَّمَ","Taqsimlamoq, bo'lib chiqmoq"],["اَلِاهْتِمَامُ بِـ","E'tibor, g'amxo'rlik"],["مَعَكَ حَقٌّ","Haqsan, gaping to'g'ri"],["مَلِيءٌ بِـ","To'la, ...ga to'lgan"],["مُقَبِّلَاتٌ","Zakuskalar, ishtaha ochuvchi yegulik"],["قُدْرَةٌ","Qudrat, qobiliyat"],["بِيتْزَا","Pitsa"],["مُدَّةٌ","Muddat, davr"],["طَلَبَ","So'ramoq, talab qilmoq"],["مُوَافِقٌ","Rozi"],["وَاضِحٌ","Aniq, ravshan"],["زَيْتٌ","Moy (o'simlik yog'i)"],["اَلسِّمْنَةُ","Semizlik"],["جَاعَ","Och qolmoq, ochiqmoq"],["مَزَحَ","Hazillashmoq"],["غِذَائِيٌّ","Oziqaviy, oziq-ovqatga oid"],["مَجْمُوعَةٌ","Guruh, to'plam"],["مُكَوِّنٌ","Tarkibiy qism"],["أَدَاةُ الرَّبْطِ","Bog'lovchi (so'z)"]],"test":[["Boʻsh joyga sifatni mavsufga mos (eʼrob va jins) shaklda tanlang:\nتَنَا ا.","تَعَلَّمَ الطِّفْلُ أَنْ يَمْشِيَ مُبَكِّرًا.","تَعَلَّمَ الطِّفْلُ المَشْيُ مُبَكِّرًا."],2,"«أَنْ يَمْشِيَ» (huwa)."],["Masdarli gapni «أَنْ + fe'l» shakliga toʻgʻri aylantiring:\nأُمِّي تُفَكِّرُ بِالذَّهَابِ إِلَى السُّوقِ اليَوْمَ.",["أُمِّي تُفَكِّرُ أَنْ تَذْهَبَ إِلَى السُّوقِ اليَوْمَ.","أُمِّي تُفَكِّرُ أَنْ يَذْهَبَ إِلَى السُّوقِ اليَوْمَ.","أُمِّي تُفَكِّرُ أَنْ أَذْهَبَ إِلَى السُّوقِ اليَوْمَ.","أُمِّي تُفَكِّرُ بِالذَّهَابَ إِلَى السُّوقِ اليَوْمَ."],0,"«أَنْ تَذْهَبَ» (hiya)."],["Masdarli gapni «أَنْ + fe'l» shakliga toʻgʻri aylantiring:\nلَا أُحِبُّ التَّفْكِيرَ فِي المَاضِي كَثِيرًا.",["لَا أُحِبُّ أَنْ تُفَكِّرَ فِي المَاضِي كَثِيرًا.","لَا أُحِبُّ أَنْ أُفَكِّرَ فِي المَاضِي كَثِيرًا.","لَا أُحِبُّ أَنْ يُفَكِّرَ فِي المَاضِي كَثِيرًا.","لَا أُحِبُّ التَّفْكِيرُ فِي المَاضِي كَثِيرًا."],1,"«أَنْ أُفَكِّرَ» (ana)."],["Masdarli gapni «أَنْ + fe'l» shakliga toʻgʻri aylantiring:\nعَائِلَتِي تُفَكِّرُ فِي السَّفَرِ إِلَى لُبْنَانَ هَذَا الصَّيْفَ.",["عَائِلَتِي تُفَكِّرُ أَنْ تُسَافِرَ إِلَى لُبْنَانَ هَذَا الصَّيْفَ.","عَائِلَتِي تُفَكِّرُ أَنْ يُسَافِرَ إِلَى لُبْنَانَ هَذَا الصَّيْفَ.","عَائِلَتِي تُفَكِّرُ أَنْ أُسَافِرَ إِلَى لُبْنَانَ هَذَا الصَّيْفَ.","عَائِلَتِي تُفَكِّرُ فِي السَّفَرُ إِلَى لُبْنَانَ هَذَا الصَّيْفَ."],0,"«أَنْ تُسَافِرَ» (hiya/oila)."],["Masdarli gapni «أَنْ + fe'l» shakliga toʻgʻri aylantiring:\nخُذْ اسْتِرَاحَةً بَعْدَ كِتَابَةِ الوَاجِبِ.",["خُذْ اسْتِرَاحَةً بَعْدَ أَنْ كَتَبَ الوَاجِبَ.","خُذْ اسْتِرَاحَةً بَعْدَ أَنْ تَكْتُبِي الوَاجِبَ.","خُذْ اسْتِرَاحَةً بَعْدَ كِتَابَةَ الوَاجِبِ.","خُذْ اسْتِرَاحَةً بَعْدَ أَنْ تَكْتُبَ الوَاجِبَ."],3,"«أَنْ تَكْتُبَ» (anta)."],["Gapni «أَمَّا ... فَـ ...» uslubida toʻgʻri davom ettiring:\nالرَّجُلُ يُفَضِّلُ لَحْمَ الدَّجَاجِ، .................... زَوْجَتُهُ.",["أَمَّا زَوْجَتُهُ فَتُفَضِّلُ لَحْمَ البَقَرِ","لَكِنَّ زَوْجَتُهُ تُفَضِّلُ لَحْمَ البَقَرِ","أَمَّا زَوْجَتُهُ تُفَضِّلُ لَحْمَ البَقَرِ","زَوْجَتُهُ فَتُفَضِّلُ لَحْمَ البَقَرِ"],0,"«أَمَّا زَوْجَتُهُ فَتُفَضِّلُ 2_9","mavzu":"Sayohat va tarix; nakira/ma'rifa, sabab (لِأَنَّ)","qoidalar":[["Nakira va ma'rifa","Nakira — tanvinli: رِحْلَةٌ، نُقُودًا. Ma'rifa turlari: ال bilan (الطِّفْلُ), olmosh, atoqli ot, ishora (هَذَا), ism mavsul (الَّذِي), ma'rifaga izofa."],["ال + egalik birga kelmaydi","✗ الْعَمَلِهِ → ✓ عَمَلُهُ yoki الْعَمَلُ."],["Sabab","لِأَنَّ + ism/olmosh: لِأَنَّهُ، لِأَنَّنِي، لِأَنَّ الْجَوَّ جَمِيلٌ · لِـ / كَيْ + muzori' (maqsad)."],["Sifat mosligi ma'rifada","رِحْلَةٌ رَائِعَةٌ · السَّاعَةُ الرَّابِعَةُ · الصِّنَاعَاتُ الْيَدَوِيَّةُ الْجَمِيلَةُ."]],"muhodasa":[["مَا أَجْمَلُ مَكَانٍ زُرْتَهُ؟ لِمَاذَا؟","Ziyorat qilgan eng go'zal joyingiz? Nega?","... لِأَنَّهُ ..."],["أَيُّ مَدِينَةٍ عَرَبِيَّةٍ تَحْلُمُ بِزِيَارَتِهَا؟","Qaysi arab shahrini ziyorat qilishni orzu qilasiz?","..."],["مَا الْآثَارُ الْمَشْهُورَةُ فِي أُوزْبَكِسْتَانَ؟","O'zbekistondagi mashhur obidalar?","رِيجِسْتَانُ فِي سَمَرْقَنْدَ، ..."],["مَاذَا تَشْتَرِي مِنَ السُّوقِ الْقَدِيمِ؟","Eski bozordan nima olasiz?","الصِّنَاعَاتِ الْيَدَوِيَّةَ ..."],["هَلْ تَلْتَقِطُ الصُّوَرَ كَثِيرًا فِي السَّفَرِ؟","Safarda ko'p surat olasizmi?","..."],["مَا الطَّعَامُ الَّذِي جَرَّبْتَهُ فِي بَلَدٍ آخَرَ؟","Boshqa yurtda tatib ko'rgan taomingiz?","..."],["لِمَاذَا تَتَعَلَّمُ الْعَرَبِيَّةَ؟ (لِأَنَّ bilan)","Nega arab tilini o'rganyapsiz?","لِأَنَّنِي أُرِيدُ أَنْ …"],["صِفْ مَدِينَتَكَ لِسَائِحٍ فِي ثَلَاثِ جُمَلٍ.","Shahringizni sayyohga 3 gapda tasvirlang","..."],["Xatoni toping: «الْعَمَلِهِ»","","عَمَلِهِ — ال va egalik birga kelmaydi."],["«هَذَا»، «الَّذِي»، «مُحَمَّدٌ» — nakirami, ma'rifami?","","Hammasi ma'rifa."],["«Chunki men charchadim»","","لِأَنَّنِي مُرْهَقٌ / تَعِبْتُ."]],"faoliyat":"«Gid»: har o'quvchi o'z shahridagi bitta obida haqida 1 daqiqalik ekskursiya o'tkazadi (nakira/ma'rifa, sifatlar, لِأَنَّ bilan). Guruh savol beradi.","matn":{"sarlavha":"رِحْلَةٌ إِلَى بُخَارَى","sarlavha_uz":"Buxoroga sayohat","ar":["فِي الرَّبِيعِ الْمَاضِي قُمْتُ مَعَ صَدِيقِي الْعَرَبِيِّ خَالِدٍ بِرِحْلَةٍ رَائِعَةٍ إِلَى بُخَارَى.","وَصَلْنَا إِلَى الْمَدِينَةِ فِي السَّاعَةِ الرَّابِعَةِ، وَذَهَبْنَا مُبَاشَرَةً إِلَى الْمَدِينَةِ الْقَدِيمَةِ.","زُرْنَا مِئْذَنَةَ كَلَانَ الْعَظِيمَةَ، وَهِيَ مَبْنِيَّةٌ مِنَ الطُّوبِ مُنْذُ حَوَالَيْ تِسْعَةِ قُرُونٍ.","الْتَقَطَ خَالِدٌ صُوَرًا كَثِيرَةً، لِأَنَّ الزَّخَارِفَ عَلَى الْجُدْرَانِ جَمِيلَةٌ جِدًّا.","بَعْدَ ذَلِكَ تَجَوَّلْنَا فِي السُّوقِ الْقَدِيمِ الَّذِي يَشْتَمِلُ عَلَى الصِّنَاعَاتِ الْيَدَوِيَّةِ.","اشْتَرَى خَالِدٌ سَجَّادَةً صَغِيرَةً لِأُمِّهِ، وَقَالَ: الْكَرَمُ فِي بُخَارَى لَيْسَ لَهُ مَثِيلٌ!","فِي الْمَسَاءِ أَكَلْنَا الْبِلَافَ الْبُخَارِيَّ، ثُمَّ رَجَعْنَا إِلَى الْفُنْدُقِ مُرْهَقَيْنِ وَسَعِيدَيْنِ."],"uz":"O'tgan bahorda arab do'stim Xolid bilan Buxoroga ajoyib sayohat qildim. Shaharga soat to'rtda yetib keldik va to'g'ri eski shaharga bordik. Buyuk Minorai Kalonni ziyorat qildik, u taxminan to'qqiz asrdan beri g'ishtdan qurilgan holda turibdi. Xolid juda ko'p surat oldi, chunki devorlardagi naqshlar juda chiroyli. Keyin qo'l hunarmandchiligi mahsulotlari bor eski bozorni aylandik. Xolid onasiga kichik gilam sotib oldi va: Buxorodagi mehmondo'stlikning tengi yo'q! dedi. Kechqurun Buxoro palovini yedik, so'ng mehmonxonaga charchagan, ammo baxtiyor holda qaytdik.","savollar":[["مَتَى وَصَلَا إِلَى بُخَارَى؟","Buxoroga qachon yetib kelishdi?","فِي السَّاعَةِ الرَّابِعَةِ."],["لِمَاذَا الْتَقَطَ خَالِدٌ صُوَرًا كَثِيرَةً؟","Xolid nega ko'p surat oldi?","لِأَنَّ الزَّخَارِفَ جَمِيلَةٌ جِدًّا."],["مَاذَا اشْتَرَى؟ لِمَنْ؟","Nima oldi, kimga?","سَجَّادَةً صَغِيرَةً لِأُمِّهِ."],["«رِحْلَةٍ رَائِعَةٍ» — nakira yoki ma'rifa?","","Nakira."]],"gloss":[["الطُّوبُ","g'isht"],["زَخَارِفُ","naqshlar"],["قُرُونٌ","asrlar"],["مَثِيلٌ","tengi, o'xshashi"]]},"lugat":[["عَظِيمٌ","Ulug', buyuk"],["حَجَرٌ","Tosh"],["كُوسَا","Kabachok, qovoqcha"],["أُنْثَى","Urg'ochi; ayol jinsi"],["كَيْ","...ishi uchun, toki"],["اَلْكَرَمُ","Saxiylik, mehmondo'stlik"],["ضَخْمٌ","Ulkan, bahaybat"],["أَدَوَاتُ التَّعْلِيلِ","Sabab · رَضِيَ اللهُ عَنْهُ · صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ."],["Tarixiy vaqt","قَرْنٌ asr · مَوْلِدٌ tavallud · وَفَاةٌ vafot · حَتَّى يَوْمِنَا هَذَا — bugungi kungacha."]],"muhodasa":[["مَنْ عَالِمُكَ الْمُفَضَّلُ؟ لِمَاذَا؟","Sevimli olimingiz? Nega?","..."],["مَاذَا تَعْرِفُ عَنِ الْإِمَامِ الْبُخَارِيِّ؟","Imom Buxoriy haqida nima bilasiz?","وُلِدَ فِي بُخَارَى، أَلَّفَ «الْجَامِعَ الصَّحِيحَ» …"],["مَنْ عُلَمَاءُ أُوزْبَكِسْتَانَ الْمَشْهُورُونَ؟","O'zbekistonning mashhur olimlari?","الْبُخَارِيُّ، التِّرْمِذِيُّ، الْخَوَارِزْمِيُّ، ابْنُ سِينَا، الْبِيرُونِيُّ …"],["فِي أَيِّ عِلْمٍ اشْتَهَرَ الْخَوَارِزْمِيُّ؟","Xorazmiy qaysi ilmda mashhur?","فِي الرِّيَاضِيَّاتِ وَعِلْمِ الْفَلَكِ."],["مَا صِفَاتُ طَالِبِ الْعِلْمِ النَّاجِحِ؟","Muvaffaqiyatli tolibi ilmning sifatlari?","..."],["هَلْ تَحْفَظُ حَدِيثًا؟ قُلْهُ.","Biror hadis yod bilasizmi? Ayting.","..."],["لَمْ يَحْضُرْ إِلَّا …؟ (bugungi darsga kim keldi)","Bugun faqat kim keldi?","لَمْ يَحْضُرْ إِلَّا ..."],["مَا الْكِتَابُ الَّذِي تَقْرَؤُهُ الْآنَ؟","Hozir qaysi kitobni o'qiyapsiz?","..."],["«Talabalar keldi, faqat bittasi kelmadi»","","حَضَرَ الطُّلَّابُ إِلَّا طَالِبًا."],["«Faqat tirishqoq muvaffaq bo'ldi» — mustasnoning kelishigi?","","لَمْ يَنْجَحْ إِلَّا الْمُجْتَهِدُ — marfu' (foil)."],["«الْأُمُّ فِي الْمَطْبَخِ» — xabar turi?","","Shibhu jumla (jar-majrur)."]],"faoliyat":"«Olim kim?»: o'quvchilar navbatma-navbat bir olim haqida 3 ta faktni aytadi (qayerda tug'ilgan, nima yozgan, qaysi ilmda), qolganlar olimni topadi.","matn":{"sarlavha":"الْإِمَامُ التِّرْمِذِيُّ","sarlavha_uz":"Imom Termiziy","ar":["الْإِمَامُ مُحَمَّدُ بْنُ عِيسَى التِّرْمِذِيُّ مُحَدِّثٌ عَظِيمٌ، وُلِدَ فِي مَدِينَةِ تِرْمِذَ فِي الْقَرْنِ الثَّالِثِ الْهِجْرِيِّ.","طَلَبَ الْعِلْمَ مُنْذُ صِغَرِهِ، وَسَافَرَ إِلَى خُرَاسَانَ وَالْعِرَاقِ وَالْحِجَازِ.","تَعَلَّمَ مِنْ عُلَمَاءَ كَثِيرِينَ، وَمِنْهُمُ الْإِمَامُ الْبُخَارِيُّ رَحِمَهُ اللهُ.","أَلَّفَ كُتُبًا كَثِيرَةً، وَأَشْهَرُهَا «سُنَنُ التِّرْمِذِيِّ» وَ«الشَّمَائِلُ الْ ا يَبْتَعِدُ عَنْ أُمِّهِ، لِأَنَّهُ يَعْتَمِدُ عَلَيْهَا فِي كُلِّ شَيْءٍ.","فِي يَوْمٍ ضَلَّ دَغْفَلٌ صَغِيرٌ الطَّرِيقَ، فَبَحَثَتْ عَنْهُ الْجَمَاعَةُ كُلُّهَا حَتَّى وَجَدَتْهُ.","لِلْأَسَفِ، يَصِيدُ بَعْضُ النَّاسِ الْفِيَلَةَ مِنْ أَجْلِ الْمَالِ، لِذَلِكَ قَلَّ عَدَدُهَا.","يَجِبُ أَنْ نَحْمِيَ هَذِهِ الْحَيَوَانَاتِ، لِأَنَّهَا جُزْءٌ مِنْ تَوَازُنِ الْبِيئَةِ."],"uz":"Fil — quruqlikda yashovchi eng katta hayvon, u to'da bo'lib yashaydigan hayvonlardan. Fil o'tlar va daraxt barglari bilan oziqlanadi, hech qachon go'sht yemaydi. Filning ikki katta qulog'i bor, hid bilish sezgisi juda kuchli. Fil bolasi «dag'fal» deyiladi, u onasidan uzoqlashmaydi, chunki hamma narsada unga tayanadi. Bir kuni kichik fil bolasi yo'ldan adashdi, butun to'da uni topguncha qidirdi. Afsuski, ba'zi odamlar pul uchun fillarni ovlaydi, shuning uchun ularning soni kamaydi. Bu hayvonlarni himoya qilishimiz kerak, chunki ular atrof-muhit muvozanatining bir qismi.","savollar":[["عَلَى مَاذَا يَتَغَذَّى الْفِيلُ؟","Fil nima bilan oziqlanadi?","عَلَى الْأَعْشَابِ وَأَوْرَاقِ الشَّجَرِ."],["مَا اسْمُ صَغِيرِ الْفِيلِ؟","Fil bolasi nima deyiladi?","الدَّغْفَلُ."],["لِمَاذَا قَلَّ عَدَدُ الْفِيَلَةِ؟","Fillar soni nega kamaydi?","لِأَنَّ بَعْضَ النَّاسِ يَصِيدُونَهَا مِنْ أَجْلِ الْمَالِ."],["اِسْتَخْرِجْ «الَّتِي» وَ«لِذَلِكَ» وَ«حَتَّى» مِنَ النَّصِّ.","Matndan shu so'zlarni topib, vazifasini ayting","(ustoz tekshiradi)"]],"gloss":[["أَعْشَابٌ","o'tlar"],["جَمَاعَاتٌ","to'dalar"],["لِلْأَسَفِ","afsuski"],["يَصِيدُ","ovlaydi"]]},"lugat":[["حَرَّكَ","Qimirlatmoq, harakatlantirmoq"],["لَدَى","Huzurida, ...da (bor)"],["اَلْمَفْرُوشَاتُ","To'shama-jihozlar"],["عَلَى سَبِيلِ الْمِثَالِ","Masalan, misol uchun"],["قُطْنِيٌّ","Paxtali"],["رَكَضَ","Chopmoq, yugurmoq"],["دَغْفَلٌ","Fil bolasi"],["وَحْشِيٌّ","Yovvoyi"],["أُذُنٌ","Quloq"],["شِبْلٌ","Sher bolasi"],["صَادَقَ","Do'st tutinmoq"],["اَلتَّزَاوُجُ","Juftlashish"],["أَظْهَرَ","Ko'rsatmoq, namoyon qilmoq"],["ضَاعَ","Yo'qolmoq"],["جَسَدٌ","Tana, const O = DATA.order, LS = DATA.lessons;
const LV = {a0:6,a1:12,a2:12};
const store = {get(k,d){try{const v=localStorage.getItem('ud_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ud_'+k,JSON.stringify(v))}catch(e){}}};
let S = Object.assign({lvl:'a1',n:5,tab:'takror',group:[],harakat:true,uzHide:true,textFrom:null,seed:1}, store.get('state',{}));
S.textFrom=null;
(function hash(){const h=(location.hash||'').slice(1).toLowerCase();const m=h.match(/^(a[0-2])-(\d{1,2})$/);if(m&&LV[m[1]]&&+m[2]>=1&&+m[2]<=LV[m[1]]){S.lvl=m[1];S.n=+m[2];}})();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR=/[؀-ۿ]/;
function arwrap(s){ // wrap Arabic runs inside mixed text
  return esc(s).replace(/([؀-ۿ][؀-ۿً-ْٰ\s،؟؛«»\.\-…ـ]*[؀-ۿً-ْٰـ]|[؀-ۿ])/g,'<span class="ar-inline" dir="rtl">$1</span>');
}
const stripH=s=>s.replace(/[ً-ْٰ]/g,'');
function rng(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function pick(arr,k,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}
const key=(l,n)=>l+'_'+n;
const label=id=>{const L=LS[id];return L.lvl+'-'+L.n};

function currentId(){ // group mode: lowest position
  if(S.group.length){let best=S.group.map(g=>O.indexOf(g)).sort((a,b)=>a-b)[0];return O[best]}
  return key(S.lvl,S.n);
}
function doneSet(id){
  const i=O.indexOf(id); const all=O.slice(0,i);
  const lvl=id.split('_')[0];
  let same=all.filter(x=>x.startsWith(lvl+'_'));
  let prevTail=[];
  if(same.length<2){ const prev=all.filter(x=>!x.startsWith(lvl+'_')); prevTail=prev.slice(-3); }
  return {all, same, prevTail, recent: all[all.length-1]||null};
}
function save(){store.set('state',{lvl:S.lvl,n:S.n,tab:S.tab,group:S.group,harakat:S.harakat,uzHide:S.uzHide})}

/* header */
const lvlSeg=document.getElementById('lvlSeg'), lessonRow=document.getElementById('lessonRow');
function drawHeader(){
  lvlSeg.innerHTML=Object.keys(LV).map(l=>`<button data-l="${l}" aria-pressed="${l===S.lvl}">${l.toUpperCase()}</button>`).join('');
  const cur=O.indexOf(key(S.lvl,S.n));
  lessonRow.innerHTML=Array.from({length:LV[S.lvl]},(_,i)=>{const id=key(S.lvl,i+1);const d=O.indexOf(id)<cur;
    return `<button data-n="${i+1}" class="${d?'done':''}" aria-pressed="${i+1===S.n}" title="${esc(LS[id].mavzu)}">${i+1}</button>`}).join('');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===S.tab));
}
lvlSeg.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.lvl=b.dataset.l;S.n=Math.min(S.n,LV[S.lvl]);S.textFrom=null;render()};
lessonRow.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.n=+b.dataset.n;S.textFrom=null;render()};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;render();window.scrollTo({top:0})};

/* blocks */
function qItem(q,src,i){
  const [ar,uz,ans]=q; const isAr=AR.test(ar)&&!/[a-z]{3}/i.test(ar.replace(/\([^)]*\)/g,''));
  return `<li class="q"><div class="meta"><span>${i+1}</span><span>${src}</span></div>
    <div class="${isAr?'ar':'txt'}">${isAr?esc(ar):arwrap(ar)}</div>
    ${uz?`<div class="uz">${arwrap(uz)}</div>`:''}
    <button class="reveal" data-rev>Namuna javob ▾</button>
    <div class="ans" hidden>${AR.test(ans)&&!/[a-z]{4}/i.test(ans)?`<div class="ar">${esc(ans)}</div>`:arwrap(ans)}</div></li>`;
}
function testItem(t,src,i){
  const [q,opts,c,iz]=t;
  return `<li class="q" data-c="${c}"><div class="meta"><span>${i+1}</span><span>${src}</span></div>
   <div class="qtext">${arwrap(q)}</div>
   <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${arwrap(String(o))}</button>`).join('')}</div>
   <div class="ans" hidden>${arwrap(iz||'')}</div></li>`;
}
function rulesBlock(ids,openId){
  return ids.map(id=>{const L=LS[id];return `<details class="rules" ${id===openId?'open':''}><summary><span class="num">${label(id)}</span><span class="t">${esc(L.mavzu)}</span></summary>
   <dl class="rl">${L.qoidalar.map(([t,b])=>`<div><dt>${esc(t)}</dt><dd>${arwrap(b)}</dd></div>`).join('')}</dl></details>`}).join('');
}
function vocabBlock(words){
  return `<div class="vocab">${words.map(([a,u,src])=>`<button class="vcard" data-v><span class="a">${esc(a)}</span><span class="u ${S.uzHide?'hid':''}">${esc(u)}</span>${src?`<span class="src">${src}</span>`:''}</button>`).join('')}</div>`;
}
function readBlock(id){
  const M=LS[id].matn;
  const lines=M.ar.map(l=>`<p>${esc(S.harakat?l:stripH(l))}</p>`).join('');
  return `<div class="read">
    <div class="rt"><div><div class="ar">${esc(S.harakat?M.sarlavha:stripH(M.sarlavha))}</div><div class="muted" style="font-size:.85rem">${esc(M.sarlavha_uz)} · ${label(id)} saviyasi · yangi matn</div></div>
      <div class="toggles"><button class="btn" data-harakat>${S.harakat?'Harakatsiz':'Harakat bilan'}</button><button class="btn" data-tr>Tarjima</button></div></div>
    <div class="ar body">${lines}</div>
    ${M.gloss&&M.gloss.length?`<div class="gloss"><span class="muted" style="background:none;padding-left:0">Yangi so'zlar:</span>${M.gloss.map(([a,u])=>`<span><span class="ar-inline">${esc(a)}</span> — ${esc(u)}</span>`).join('')}</div>`:''}
    <div class="tr" hidden>${esc(M.uz)}</div>
    <h3 style="font-size:1rem;margin:14px 0 8px">Matn bo'yicha savollar</h3>
    <ol class="qs">${M.savollar.map((q,i)=>qItem(q,'matn',i)).join('')}</ol></div>`;
}

function renderTakror(id){
  const L=LS[id]; const d=doneSet(id);
  const r=rng(S.seed*31+O.indexOf(id));
  let html=`<div class="status"><div class="who">O'quvchi: <em>${L.lvl}-${L.n}</em> darsida</div>`;
  if(!d.recent){
    html+=`<p>Hali birorta dars yopilmagan. Tanishuv suhbati o'tkazing va «Dars kartasi»dan A0-1 materialini ishlating.</p></div>`;
    return html;
  }
  const scope=d.same.length?d.same:[];
  const pool=[...d.prevTail,...scope];
  html+=`<p>Tugatgan: ${d.same.length?`<b>${L.lvl}-1…${L.lvl}-${L.n-1}</b>`:'—'}${d.prevTail.length?` · oldingi daraja oxiri: ${d.prevTail.map(label).join(', ')}`:''}. Savollar faqat shu darslardan olinadi. Joriy dars (${L.lvl}-${L.n}: ${esc(L.mavzu)}) hali o'rganilmoqda — undan chuqur so'ramang.</p>
   <div class="chips"><span class="chip now">Oxirgi yopilgan: ${label(d.recent)} · ${esc(LS[d.recent].mavzu)}</span></div></div>`;
  if(S.group.length) html+=`<p class="note">Guruh rejimi: ${S.group.length} o'quvchi, eng past nuqta tanlangan.</p>`;

  // muhodasa
  const rec=d.recent; const older=pool.filter(x=>x!==rec);
  let mq=pick(LS[rec].muhodasa.map(q=>[q,label(rec)]),6,r);
  let oq=pick(older.flatMap(x=>LS[x].muhodasa.map(q=>[q,label(x)])),6,r);
  const mu=[...mq,...oq];
  html+=`<section class="block"><div class="bh"><div><h2>Muhodasa savollari</h2><div class="sub">6 ta oxirgi darsdan, 6 ta oldingilaridan · tugmani bosib namuna javobni oching</div></div><button class="btn" data-shuffle>Boshqa savollar ↻</button></div>
   <ol class="qs">${mu.map(([q,s],i)=>qItem(q,s,i)).join('')}</ol></section>`;

  // matn
  const tf=S.textFrom&&pool.includes(S.textFrom)?S.textFrom:rec;
  html+=`<section class="block"><div class="bh"><div><h2>O'qish matni</h2><div class="sub">Kitobdagi matn emas — o'sha saviyadagi yangi matn. Avval harakatsiz o'qiting.</div></div>
    <select id="textSel" aria-label="Matn darsi">${pool.slice().reverse().map(x=>`<option value="${x}" ${x===tf?'selected':''}>${label(x)} — ${esc(LS[x].matn.sarlavha_uz)}</option>`).join('')}</select></div>
    ${readBlock(tf)}</section>`;

  // qoida tekshiruvi
  const tq=[...pick(LS[rec].test.map(t=>[t,label(rec)]),3,r),...pick(older.flatMap(x=>LS[x].test.map(t=>[t,label(x)])),3,r)];
  html+=`<section class="block"><div class="bh"><div><h2>Qoida tekshiruvi</h2><div class="sub">Tizimdagi qovaid testlaridan · og'zaki so'rang, keyin variantni bosing</div></div><button class="btn" data-shuffle>↻</button></div>
    <ol class="qs">${tq.map(([t,s],i)=>testItem(t,s,i)).join('')}</ol></section>`;

  // lug'at
  const vw=[...pick(LS[rec].lugat.map(v=>[...v,label(rec)]),6,r),...pick(older.flatMap(x=>LS[x].lugat.map(v=>[...v,label(x)])),6,r)];
  html+=`<section class="block"><div class="bh"><div><h2>Lug'at tezkor</h2><div class="sub">Arabcha so'zni ko'rsating — o'quvchi ma'nosini aytsin. Kartani bossangiz tarjima ochiladi.</div></div>
    <div class="toggles"><button class="btn" data-uzhide>${S.uzHide?'Hammasini ochish':'Yashirish'}</button><button class="btn" data-shuffle>↻</button></div></div>${vocabBlock(vw)}</section>`;

  // qoidalar xaritasi
  html+=`<section class="block"><div class="bh"><div><h2>O'tilgan qoidalar</h2><div class="sub">Qaysi darsda nima o'tilgan — oxirgisi ochiq</div></div></div>${rulesBlock(pool.slice().reverse(),rec)}</section>`;
  return html;
}

function renderKarta(id){
  const L=LS[id];
  let html=`<div class="status"><div class="who"><em>${L.lvl}-${L.n}</em> · ${esc(L.mavzu)}</div><p>Shu darsning to'liq kartasi: qoidalar, barcha muhodasa savollari, guruh mashg'uloti, matn va lug'at.</p>
   <div class="chips"><span class="chip">${L.muhodasa.length} savol</span><span class="chip">${L.lugat.length} so'z</span><span class="chip">${L.test.length} test</span></div></div>`;
  html+=`<section class="block"><div class="bh"><h2>Qoidalar</h2></div>${rulesBlock([id],id)}</section>`;
  html+=`<section class="block"><div class="bh"><h2>Muhodasa savollari</h2></div><ol class="qs">${L.muhodasa.map((q,i)=>qItem(q,label(id),i)).join('')}</ol></section>`;
  html+=`<section class="block"><div class="bh"><h2>Guruh mashg'uloti</h2></div><div class="act">${arwrap(L.faoliyat)}</div></section>`;
  html+=`<section class="block"><div class="bh"><h2>O'qish matni</h2></div>${readBlock(id)}</section>`;
  html+=`<section class="block"><div class="bh"><div><h2>Darsning lug'ati</h2><div class="sub">Mufradot testlaridan · ${L.lugat.length} ta yangi so'z</div></div><button class="btn" data-uzhide>${S.uzHide?'Tarjimani ochish':'Yashirish'}</button></div>${vocabBlock(L.lugat)}</section>`;
  return html;
}

function renderGuide(){
  return `<div class="guide"><div class="status"><div class="who">Jonli dars qanday o'tadi</div><p>Haftada bir marta, guruh, ~60 daqiqa. Maqsad — o'quvchi tizimda o'qiganini og'zaki ishlata olishini tekshirish.</p></div>
  <section class="block"><div class="bh"><h2>60 daqiqalik reja</h2></div><div class="plan">
   <div><b>0–5</b><span>Salomlashish, har bir o'quvchidan «qaysi darsdasiz?» — tepada daraja va darsni tanlang. Turli joyda bo'lsa, «Guruh» qismiga hammasini qo'shing.</span></div>
   <div><b>5–20</b><span><strong>Muhodasa.</strong> Takrorlash sahifasidagi savollar. Har o'quvchiga 2–3 ta; javobni to'liq gap bilan so'rang.</span></div>
   <div><b>20–35</b><span><strong>O'qish.</strong> Matnni avval harakatsiz o'qiting (bu haqiqiy tekshiruv), xatoda harakatni oching. Keyin matn savollari.</span></div>
   <div><b>35–45</b><span><strong>Qoida tekshiruvi.</strong> Testni og'zaki bering, keyin variantni bosib izohni ko'rsating.</span></div>
   <div><b>45–55</b><span><strong>Guruh mashg'uloti</strong> (Dars kartasida) yoki lug'at tezkor o'yini.</span></div>
   <div><b>55–60</b><span>Xulosa: har o'quvchiga bitta zaif nuqta va bitta maqtov. Zaif nuqtani botdagi <span class="ar-inline">/xato</span> hisoboti bilan solishtiring.</span></div>
  </div></section>
  <section class="block"><div class="bh"><h2>Guruh: bir nechta o'quvchi</h2></div>
   <p class="note">O'quvchilar turli darslarda bo'lsa, har birining joyini qo'shing. Sahifa eng past nuqtani oladi — hamma tushunadigan savollar chiqadi. Oldinroqdagilarga «Dars kartasi»dan qo'shimcha savol bering.</p>
   ${groupBox()}</section>
  <section class="block"><div class="bh"><h2>Manba va qoidalar</h2></div><ul>
   <li>«O'tilgan» = o'quvchi joriy darsdan <b>oldingi</b> barcha darslar (bot mini-testidagi mantiq bilan bir xil).</li>
   <li>Lug'at va qoida testlari — Tanvir tizimidagi mufradot/qovaid JSON'laridan. Har so'z birinchi uchragan darsiga yozilgan.</li>
   <li>Muhodasa savollari va o'qish matnlari shu daftar uchun yangidan yozilgan; matnlar faqat o'sha darsgacha bo'lgan so'zlardan tuzilgan, har matnda eng ko'pi 3–4 yangi so'z (ostida izohlangan).</li>
   <li>Havolaga <b>#a2-5</b> qo'shsangiz, sahifa to'g'ridan A2-5 da ochiladi.</li>
  </ul></section></div>`;
}
function groupBox(){
  return `<div class="group"><div class="row">${S.group.length?S.group.map((g,i)=>`<span class="pill ${g===currentId()?'min':''}">${label(g)}<button data-gdel="${i}" aria-label="O'chirish">×</button></span>`).join(''):'<span class="muted">Hozir bitta o\'quvchi rejimi.</span>'}</div>
   <div class="row" style="margin-top:8px"><button class="btn" data-gadd>+ Tanlangan darsni (${S.lvl.toUpperCase()}-${S.n}) qo'shish</button>${S.group.length?'<button class="btn" data-gclear>Tozalash</button>':''}</div></div>`;
}

function render(){
  drawHeader();
  const id=currentId();
  const main=document.getElementById('main');
  if(S.tab==='takror') main.innerHTML=renderTakror(id)+`<section class="block"><div class="bh"><h2>Guruh</h2></div>${groupBox()}</section>`;
  else if(S.tab==='karta') main.innerHTML=renderKarta(key(S.lvl,S.n));
  else main.innerHTML=renderGuide();
  save();
}

document.getElementById('main').addEventListener('click',e=>{
  const t=e.target;
  const rev=t.closest('[data-rev]'); if(rev){const a=rev.nextElementSibling;a.hidden=!a.hidden;rev.textContent=a.hidden?'Namuna javob ▾':'Yopish ▴';return}
  const opt=t.closest('.opt'); if(opt){const li=opt.closest('.q');const c=+li.dataset.c;li.querySelectorAll('.opt').forEach(o=>{o.classList.remove('ok','bad');if(+o.dataset.j===c)o.classList.add('ok')});if(+opt.dataset.j!==c)opt.classList.add('bad');li.querySelector('.ans').hidden=false;return}
  const v=t.closest('[data-v]'); if(v){v.querySelector('.u').classList.toggle('hid');return}
  if(t.closest('[data-shuffle]')){S.seed++;render();return}
  if(t.closest('[data-uzhide]')){S.uzHide=!S.uzHide;render();return}
  if(t.closest('[data-harakat]')){S.harakat=!S.harakat;const y=window.scrollY;render();window.scrollTo({top:y});return}
  const tr=t.closest('[data-tr]'); if(tr){const x=tr.closest('.read').querySelector('.tr');x.hidden=!x.hidden;return}
  if(t.closest('[data-gadd]')){const k=key(S.lvl,S.n);if(!S.group.includes(k))S.group.push(k);render();return}
  const gd=t.closest('[data-gdel]'); if(gd){S.group.splice(+gd.dataset.gdel,1);render();return}
  if(t.closest('[data-gclear]')){S.group=[];render();return}
});
document.getElementById('main').addEventListener('change',e=>{if(e.target.id==='textSel'){S.textFrom=e.target.value;const y=window.scrollY;render();window.scrollTo({top:y})}});
const fab=document.getElementById('fab');
function fabUpd(){const id=currentId();fab.textContent='▲ '+label(id)+(S.group.length?' · guruh':'');fab.hidden=window.scrollY<300}
window.addEventListener('scroll',fabUpd,{passive:true});
fab.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
const _r=render;render=function(){_r();fabUpd()};
render();
</script>

</body>
</html>
