<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Tanvir ustoz daftari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Noto+Naskh+Arabic:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F5EEE1; --surface:#FFFBF4; --surface2:#EFE5D3; --ink:#2A2019; --muted:#76664F;
  --line:#DDCFB8; --gold:#A87520; --gold-soft:#F1DFB9; --brown:#6B4423;
  --ok:#2F7A4B; --ok-soft:#DCEFE2; --bad:#A33A2B; --bad-soft:#F6DEDA;
  --shadow:0 1px 2px rgba(60,40,20,.08),0 4px 14px rgba(60,40,20,.06);
  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --surface:#221C16; --surface2:#2C241C; --ink:#F1E6D4; --muted:#B4A38A;
    --line:#3D3226; --gold:#DDAA4C; --gold-soft:#3A2E1A; --brown:#D9B48A;
    --ok:#7BC795; --ok-soft:#1F3226; --bad:#E58C7C; --bad-soft:#3A221D;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#221C16; --surface2:#2C241C; --ink:#F1E6D4; --muted:#B4A38A;
  --line:#3D3226; --gold:#DDAA4C; --gold-soft:#3A2E1A; --brown:#D9B48A;
  --ok:#7BC795; --ok-soft:#1F3226; --bad:#E58C7C; --bad-soft:#3A221D;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.35rem;line-height:2.05}
.ar-inline{font-family:var(--f-ar);font-size:1.15em;direction:rtl;unicode-bidi:isolate}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-disp);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 10px}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.brand h1{font-size:1.25rem;color:var(--brown)}
.brand h1 b{font-family:var(--f-ar);color:var(--gold);font-weight:600;margin-left:4px}
.brand small{color:var(--muted);font-size:.8rem}
.picker{display:grid;gap:8px;margin-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:700;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--brown);color:var(--bg)}
.lessons{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.lessons button{flex:0 0 auto;min-width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.lessons button.done{background:var(--gold-soft);border-color:transparent}
.lessons button[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}

/* status */
.status{margin:18px 0 6px;display:grid;gap:4px}
.status .who{font-family:var(--f-disp);font-size:1.5rem;line-height:1.2}
.status .who em{font-style:normal;color:var(--gold)}
.status p{margin:0;color:var(--muted);max-width:65ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.now{background:var(--gold-soft);color:var(--brown)}

section.block{margin-top:22px}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bh h2{font-size:1.2rem}
.bh .sub{font-size:.85rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--brown);color:var(--bg);border-color:var(--brown)}
.btn:hover{border-color:var(--gold)}

/* question list */
ol.qs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.q .meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.q .uz{font-size:.92rem;color:var(--muted)}
.q .txt{font-weight:600}
.reveal{margin-top:6px;border:0;background:none;padding:0;color:var(--gold);font-weight:700;font-size:.88rem}
.ans{margin-top:6px;padding:8px 12px;border-radius:9px;background:var(--gold-soft)}
.ans .ar{font-size:1.2rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:8px}
.opt{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);text-align:start}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt .ar-inline{font-size:1.2em}
.qtext{white-space:pre-line}

/* rules */
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.rules summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary .num{font-family:var(--f-disp);color:var(--gold);font-weight:650;min-width:3.2em;font-variant-numeric:tabular-nums}
details.rules summary .t{font-weight:600}
details.rules[open] summary{border-bottom:1px dashed var(--line)}
dl.rl{margin:0;padding:8px 14px 12px;display:grid;gap:8px}
dl.rl dt{font-weight:700;font-size:.9rem;color:var(--brown)}
dl.rl dd{margin:0;font-size:.95rem}
dl.rl dd .ar-inline{font-size:1.15em}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.vcard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:center;display:grid;gap:2px;min-height:78px;align-content:center}
.vcard .a{font-family:var(--f-ar);font-size:1.35rem;direction:rtl}
.vcard .u{font-size:.88rem;color:var(--muted)}
.vcard .u.hid{color:transparent;background:var(--surface2);border-radius:6px}
.vcard .src{font-size:.7rem;color:var(--muted);letter-spacing:.05em}

/* reading */
.read{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.read .rt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.read .rt .ar{font-size:1.5rem;font-weight:600;color:var(--brown)}
.read .body p{margin:0}
.read .tr{margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:.95rem}
.gloss{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:.88rem}
.gloss span{background:var(--surface2);padding:2px 8px;border-radius:7px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink)}

.act{background:var(--surface2);border-radius:12px;padding:12px 14px}
.act b{color:var(--brown)}
.note{font-size:.9rem;color:var(--muted);max-width:65ch}

/* group */
.group{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.group .row{gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.pill button{border:0;background:none;padding:0 6px;color:var(--muted)}
.pill.min{background:var(--gold-soft);color:var(--brown)}

/* guide */
.plan{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.plan div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.plan div:first-child{border-top:0}
.plan b{font-variant-numeric:tabular-nums;color:var(--gold);font-family:var(--f-disp)}
.guide p,.guide li{max-width:65ch}
.guide ul{padding-left:1.2em}
@media (max-width:520px){
  .ar{font-size:1.25rem}
  .status .who{font-size:1.25rem}
  .plan div{grid-template-columns:70px 1fr}
  .picker{gap:6px}
  .lessons button{height:32px;min-width:32px}
  .tabs{padding-top:6px}
  .chip{text-transform:none;letter-spacing:0}
}
@media (prefers-reduced-motion:no-preference){.ans,.opt{transition:background .15s,border-color .15s}}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:10px 16px;background:var(--brown);color:var(--bg);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
@media (min-width:521px){.fab{display:none}}
@media (max-width:520px){header.top{position:static}.lessons button{height:40px;min-width:40px}.tabs button{padding:8px 10px}.reveal{padding:6px 0}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ustoz daftari <b>بَيِّنَة</b></h1>
      <small>Tanvir · A0–A2 · 30 dars</small>
    </div>
    <div class="picker">
      <div class="row">
        <div class="seg" id="lvlSeg" role="group" aria-label="Daraja"></div>
        <span class="muted hint" style="font-size:.85rem">O'quvchi hozir qaysi darsda?</span>
      </div>
      <div class="lessons" id="lessonRow" role="group" aria-label="Dars"></div>
      <nav class="tabs" role="tablist">
        <button data-tab="takror" aria-pressed="true">Takrorlash</button>
        <button data-tab="karta" aria-pressed="false">Dars kartasi</button>
        <button data-tab="guide" aria-pressed="false">Qo'llanma</button>
      </nav>
    </div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" hidden aria-label="Tepaga — dars tanlash">▲ A1-5</button>
</div>

<script>

sherigi bilan salomlashadi, ismini, qayerdanligini so'raydi, keyin guruhga uni tanishtiradi: «هَذَا ... هُوَ مِنْ ...».","matn":{"sarlavha":"تَعَارُفٌ فِي الدَّرْسِ","sarlavha_uz":"Darsda tanishuv","ar":["عَلِيٌّ: اَلسَّلَامُ عَلَيْكُمْ.","زَيْدٌ: وَعَلَيْكُمُ السَّلَامُ.","عَلِيٌّ: أَنَا عَلِيٌّ. مَا اسْمُكَ؟","زَيْدٌ: اِسْمِي زَيْدٌ.","عَلِيٌّ: مِنْ أَيْنَ أَنْتَ يَا زَيْدُ؟","زَيْدٌ: أَنَا مِنْ بُخَارَى. وَأَنْتَ؟","عَلِيٌّ: أَنَا مِنْ خِيوَةَ. هَلْ أَنْتَ طَبِيبٌ؟","زَيْدٌ: لَا، أَنَا مُعَلِّمٌ. وَأَنْتَ؟","عَلِيٌّ: أَنَا طَبِيبٌ. تَشَرَّفْتُ.","زَيْدٌ: تَشَرَّفْتُ. مَعَ السَّلَامَةِ.","عَلِيٌّ: إِلَى اللِّقَاءِ."],"uz":"Ali: Assalomu alaykum. Zayd: Vaalaykum assalom. Ali: Men Aliman. Ismingiz nima? Zayd: Ismim Zayd. Ali: Qayerdansiz, Zayd? Zayd: Men Buxorodanman. Siz-chi? Ali: Men Xivadanman. Siz shifokormisiz? Zayd: Yo'q, men o'qituvchiman. Siz-chi? Ali: Men shifokorman. Tanishganimdan xursandman. Zayd: Men ham. Salomat bo'ling. Ali: Ko'rishguncha.","savollar":[["مِنْ أَيْنَ زَيْدٌ؟","Zayd qayerdan?","هُوَ مِنْ بُخَارَى."],["هَلْ عَلِيٌّ مُعَلِّمٌ؟","Ali o'qituvchimi?","لَا، هُوَ طَبِيبٌ."],["مَنِ الْمُعَلِّمُ؟","O'qituvchi kim?","زَيْدٌ."],["مِنْ أَيْنَ عَلِيٌّ؟","Ali qayerdan?","مِنْ خِيوَةَ."]],"gloss":[]},"lugat":[["اَلسَّلَامُ عَلَيْكُمْ","Assalomu alaykum"],["وَعَلَيْكُمُ السَّلَامُ","Vaalaykum assalom"],["كَيْفَ حَالُكَ؟","Ahvolingiz qanday?"],["بِخَيْرٍ وَالْحَمْدُ لِلَّهِ","Yaxshi, Allohga shukr"],["مَا اسْمُكَ؟","Ismingiz nima?"],["مِنْ أَيْنَ أَنْتَ؟","Qayerdansiz?"],["أَهْلًا وَسَهْلًا","Xush kelibsiz"],["تَشَرَّفْتُ","Tanishganimdan xursandman"],["صَبَاحُ الْخَيْرِ","Xayrli tong"],["مَسَاءُ الْخَيْرِ","Xayrli kech"],["إِلَى اللِّقَاءِ","Ko'rishguncha"],["مَعَ السَّلَامَةِ","Salomat bo'ling"],["نَعَمْ","Ha"],["لَا","Yo'q"],["شُكْرًا","Rahmat"],["عَفْوًا","Arzimaydi"],["غُرْفَةٌ","Xona"],["مُعَلِّمٌ","O'qituvchi"],["عَمَّةٌ","Amma"],["بَعْضٌ","Ba'zi"],["يَحْفَظُ","Yodlaydi"],["طَبِيبٌ","Shifokor"],["صُورَةٌ","Surat"],["أَيْضًا","Ham"],["أَنَا","Men" g» zamiri qo'shilganda so'z oxiridagi «ta marbuta» (ة) qaysi harfga o'zgaradi?",["Sukun (ْ) belgisiga","Ochiq «ta» (ت) harfiga","Alif (ا) harfiga","O'zgarmasdan qoladi"],1,"Zamir qo'shilganda ة ochiq ت ga aylanadi: غُرْفَتِي."],["«طَبِيبٌ» (shifokor) so'zining to'g'ri ko'plik shaklini aniqlang.",["طَبِيبُونَ","أَطِبَّاءُ","طِبَابٌ","أَطْبَابٌ"],1,"طَبِيبٌ — siniq ko'plik: أَطِبَّاءُ."],["«طَالِبٌ» (talaba) so'zining ko'plik shakli qaysi javobda to'g'ri ko'rsatilgan?",["طَالِبُونَ","طَالِبَاتٌ","طُلَّابٌ","طَالِبَانِ"],2,"طَالِبٌ — siniq ko'plik: طُلَّابٌ. طَالِبَاتٌ — talaba qizlar (muannas)."],["«حَلَّاقٌ» (sartarosh) so'zining ko'plik shakli qaysi usulda yasaladi?",["To'g'ri muannas ko'plik (ات) qo'shish bilan","Siniq ko'plik shaklida","To'g'ri muzakkar ko'plik (ونَ) qo'shish bilan: حَلَّاقُونَ","Hech qanday qo'shimchasiz"],2,"حَلَّاقٌ — to'g'ri muzakkar ko'plik: حَلَّاقُونَ."],["«صَدِيقٌ» (do'st) so'zining ko'plik shaklini toping.",["صَدِيقُونَ","أَصْدِقَاءُ","صُدُوقٌ","أَصْحَابٌ"],1,"صَدِيقٌ — siniq ko'plik: أَصْدِقَاءُ."],["«تَاجِرٌ» (savdogar) so'zining siniq ko'plik shakli qaysi?",["تَاجِرُونَ","تُجَّارٌ","تَاجِرَاتٌ","تِجَارَاتٌ"],1,"تَاجِرٌ — siniq ko'plik: تُجَّارٌ."],["«تِلْمِيذٌ» (o'quvchi) so'zining ko'plik shakli qaysi variantda to'g'ri yozilgan?",["تَلَامِيذُ","تِلْمِيذُونَ","تَلَامِذٌ","تِلْمِيذَاتٌ"],0,"تِلْمِيذٌ — siniq ko'plik: تَلَامِيذُ."],["Gapni to'ldiring: «هَذَا مُحَمَّدٌ وَهَذَا ...» (Bu Muhammad va bu uning sartaroshi).",["حَلَّاقُهَا","حَلَّاقُكَ","حَلَّاقُهُ","حَلَّاقِي"],2,"«Uning (erkak) sartaroshi» = حَلَّاقُهُ."],["«U (ayol) Zahro va bu uning surati» gapining arabcha tarjimasi qaysi?",["هُوَ زَهْرَةُ وَهَذِهِ صُورَتُهُ","هِيَ زَهْرَةُ وَهَذِهِ صُورَتُهَا","أَنْتِ زَهْرَةُ وَهَذِهِ صُورَتُكِ","هِيَ زَهْرَةُ وَهَذَا صُورَتِي"],1,"هِيَ (u — ayol) + صُورَتُهَا (uning surati): هِيَ زَهْرَةُ وَهَذِهِ صُورَتُهَا."],["«أَنْتَ عَامِلٌ وَهُوَ مُدِيرُكَ» gapining to'g'ri tarjimasi qaysi?",["Sen ishchisan va u sening mudiringdir.","U ishchi va sen uning mudirisan.","Men ishchiman va u mening mudirim.","Sen mudirsan va u sening ishching."],0,"أَنْتَ عَامِلٌ = sen ishchisan; مُدِيرُكَ = sening mudiring."],["Gapni grammatik jihatdan to'g'ri to'ldiring: «أَنْتِ مُعَلِّمَةٌ وَهِيَ ...» (Sen o'qituvchisan (ayol) va u sening o'quvching (ayol)).",["تِلْمِيذُهُ","تِلْمِيذَتُكَ","تِلْمِيذَتُكِ","تِلْمِيذِي"],2,"«O'quvching (ayol, senga — ayolga)» = تِلْمِيذَتُكِ (muannas ة + ـُكِ)."],["«أَنَا مُعَلِّمٌ وَهَذَا طَالِبِي» gapida muttasil zamir qaysi so'zga qo'shilgan?",["أَنَا","مُعَلِّمٌ","هَذَا","طَالِبِي"],3,"Muttasil zamir ـِي «طَالِب» so'ziga qo'shilgan: طَالِبِي = mening talabam."],["«U oshpaz va bu uning taomi» gapidagi «taomi» so'zi qanday yoziladi?",["طَعَامُهَا","طَعَامُهُ","طَعَامُكَ","طَعَامِي"],1,"«Uning (erkak) taomi» = طَعَامُهُ."],["«هُوَ مُهَنْدِسٌ وَهَذَا قَلَمُهُ» gapida gapiruvchi kim haqida gapirmoqda?",["O'zi haqida","Suhbatdosh ayol haqida","G'oyibdagi bir erkak muhandis haqida","Ko'pchilik haqida"],2,"هُوَ va ـهُ — g'oyibdagi (uchinchi shaxs) erkak haqida."],["«هَذِهِ دُكْتُورَةٌ وَهَذَا قَلَمُهَا» gapida nima uchun «قَلَمُهَا» shakli ishlatilgan?",["Qalam muannas jinsida bo'lgani uchun","Shifokor ayol (دُكْتُورَةٌ) jinsiga moslashgani uchun","Gapda «هَذِهِ» ko'rsatkich olmoshi kelgani uchun","Tasodifiy ravishda"],1,"ـهَا zamiri egasi — ayol (دُكْتُورَة) ga moslashadi, qalamning jinsiga emas."],["O'zbekcha gapning to'g'ri arabcha variantini toping: «U Zaynab va u sening o'qituvching (ayol kishiga nisbatan)».",["هُوَ زَيْنَبُ وَهُوَ مُعَلِّمُكَ","هِيَ زَيْنَبُ وَهُوَ مُعَلِّمُكِ","هِيَ زَيْنَبُ وَهِيَ مُعَلِّمَتُكِ","أَنْتِ زَيْنَبُ وَأَنَا مُعَلِّمُكِ"],2,"هِيَ + مُعَلِّمَتُكِ (ayol o'qituvchi, senga — ayolga): هِيَ زَيْنَبُ وَهِيَ مُعَلِّمَتُكِ."],["«Shifokorlar sening ustozlaringdir» gapida «shifokorlar» so'zi uchun qaysi ko'plik ishlatilishi kerak?",["طَالِبُونَ","أَطِبَّاءُ","حَلَّاقُونَ","تُجَّارٌ"],1,"Shifokorlar = أَطِبَّاءُ (طَبِيبٌ ning ko'pligi)."],["«Savdogarlar uning sotuvchilaridir» gapining ma'nosi qaysi kasb egalariga tegishli?",["Muhandislarga","O'qituvchilarga","Tijorat/savdo bilan shug'ullanuvchilarga","Shifokorlarga"],2,"تُجَّار (savdogarlar) — tijorat/savdo bilan shug'ullanuvchilar."],["Quyidagilardan qaysi biri munfasil (yakka holda yoziladigan) zamir EMAS?",["أَنَا","أَنْتَ","ـِي (Mening)","هِيَ"],2,"ـِي — muttasil (so'zga qo'shiladigan) zamir. أَنَا, أَنْتَ, هِيَ — munfasil."],["«Haydovchilar mening do'stlarimdir» gapidagi «do'stlarim» so'zining arabcha ko'rinishi qanday bo'ladi?",["أَصْدِقَائِي","صَدِيقِي","أَصْدِقَاؤُكَ","صَدِيقُهُ"],0,"أَصْدِقَاء (do'stlar) + ـِي = أَصْدِقَائِي (mening do'stlarim)."]],"lvl":"A0","n":2},"a0_3":{"id":"a0_3","mavzu":"Oila, sonlar 1–10","qoidalar":[["1 va 2 sonlari","Ma'duddan keyin keladi, jinsda mos: كِتَابٌ وَاحِدٌ، أُخْتٌ وَاحِدَةٌ. 2 uchun ko'pincha ikkilikning o'zi yetadi: كِتَابَانِ."],["3–10: mukholafa","Son ma'dudga jinsda TESKARI: muzakkar ma'dud → ة bilan: ثَلَاثَةُ أَعْمَامٍ؛ muannas ma'dud → ة-siz: ثَلَاثُ سَيَّارَاتٍ. Ma'dud ko'plik va majrur."],["كَمْ so'rog'i","كَمْ + birlik, mansub (tanvin fatha): كَمْ أَخًا لَكَ؟ كَمْ غُرْفَةً فِي الْبَيْتِ؟"],["Ikkilik (tasniya)","ـَانِ (marfu') / ـَيْنِ (mansub-majrur): أَخَوَانِ، صُورَتَانِ (ة → ت)."],["Egalik: عِنْدَ، لِـ، مَعَ","عِنْدِي / لِي / مَعِي — menda bor; عِنْدَكَ، لَكِ، مَعَهُ، مَعَهَا …"]],"muhodasa":[["كَمْ أَخًا لَكَ؟","Nechta akangiz/ukangiz bor?","لِي أَخٌ وَاحِدٌ / أَخَوَانِ / ثَلَاثَةُ إِخْوَةٍ."],["كَمْ أُخْتًا لَكَ؟","Nechta opa-singlingiz bor?","لِي أُخْتَانِ / ثَلَاثُ أَخَوَاتٍ."],["مَا اسْمُ أَبِيكَ؟ وَمَا اسْمُ أُمِّكَ؟","Otangizning, onangizning ismi?","اِسْمُ أَبِي ... وَاسْمُ أُمِّي ..."],["هَلْ لَكَ عَمٌّ؟ هَلْ لَكَ خَالٌ؟","Amakingiz / tog'angiz bormi?","نَعَمْ، لِي عَمَّانِ. / لَا ..."],["كَمْ حَفِيدًا لِجَدِّكَ؟","Bobongizning nechta nabirasi bor?","لِجَدِّي ... أَحْفَادٍ."],["كَمْ غُرْفَةً فِي بَيْتِكَ؟","Uyingizda nechta xona bor?","فِي بَيْتِي أَرْبَعُ غُرَفٍ."],["مَنْ مَعَكَ الْآنَ؟","Hozir yoningizda kim bor?","مَعِي أُخْتِي / لَا أَحَدَ."],["كَمْ صُورَةً عِنْدَكَ فِي الْهَاتِفِ؟ (taxminan)","Telefoningizda nechta surat bor?","عِنْدِي ..."],["1 dan 10 gacha sanang.","","وَاحِدٌ، اثْنَانِ، ثَلَاثَةٌ، أَرْبَعَةٌ، خَمْسَةٌ، سِتَّةٌ، سَبْعَةٌ، ثَمَانِيَةٌ، تِسْعَةٌ، عَشَرَةٌ"],["«5 ta kalit» va «5 ta mashina» — farqi nima?","","خَمْسَةُ مَفَاتِيحَ (مِفْتَاح — m) · خَمْسُ سَيَّارَاتٍ (سَيَّارَة — f)"],["«Senda (ayolga)», «u (ayol) bilan»","","عِنْدَكِ · مَعَهَا"]],"faoliyat":"Har o'quvchi oila a'zolarini sanab «شَجَرَةُ الْعَائِلَةِ» (oila shajarasi)ni og'zaki tuzadi. Qolganlar «كَمْ ...؟» bilan savol beradi.","matn":{"sarlavha":"عَائِلَةُ زَيْنَبَ","sarlavha_uz":"Zaynabning oilasi","ar":["اِسْمِي زَيْنَبُ، وَأَنَا مِنْ فَرْغَانَةَ.","أَبِي تَاجِرٌ، وَأُمِّي مُعَلِّمَةٌ.","لِي أَخَوَانِ: خَالِدٌ وَسَعِيدٌ. خَالِدٌ طَبِيبٌ، وَسَعِيدٌ تِلْمِيذٌ.","وَلِي أُخْتٌ وَاحِدَةٌ، اسْمُهَا مَرْيَمُ.","جَدِّي وَجَدَّتِي فِي بَيْتِنَا أَيْضًا. لِجَدِّي سَبْعَةُ أَحْفَادٍ.","فِي بَيْتِنَا خَمْسُ غُرَفٍ.","عِنْدَ عَمِّي سَيَّارَتَانِ، وَعِنْدَ خَالِي ثَلَاثُ بَنَاتٍ."],"uz":"Ismim Zaynab, men Farg'onadanman. Otam savdogar, onam o'qituvchi. Ikkita akam bor: Xolid va Said. Xolid shifokor, Said o'quvchi. Bitta singlim bor, ismi Maryam. Bobom va buvim ham bizning uyda. Bobomning yettita nabirasi bor. Uyimizda beshta xona bor. Amakimning ikkita mashinasi bor, tog'amning esa uchta qizi bor.","savollar":[["كَمْ أَخًا لِزَيْنَبَ؟","Zaynabning nechta akasi bor?","لَهَا أَخَوَانِ."],["مَا مِهْنَةُ أُمِّهَا؟","Onasining kasbi nima?","مُعَلِّمَةٌ."],["كَمْ حَفِيدًا لِجَدِّهَا؟","Bobosining nechta nabirasi bor?","سَبْعَةُ أَحْفَادٍ."],["كَمْ بِنْتًا لِخَالِهَا؟","Tog'asining nechta qizi bor?","ثَلَاثُ بَنَاتٍ."]],"gloss":[]},"lugat":[["أَبٌ","Ota"],["أُمٌّ","Ona"],["جَدٌّ","Bobo"],["جَدَّةٌ","Buvi"],["أَخٌ","Aka/uka"],["أُخْتٌ","Opa/singil"],["اِبْنٌ","O'g'il"],["بِنْتٌ","Qiz"],["وَلَدٌ","Bola (umumiy)"],["عَمٌّ","Amaki (ota tomondan)"],["خَالٌ","Tog'a (ona tomondan)"],["يَأْخُذُ","Oladi"],["حَفِيدٌ","Nabira"],["زَوْجٌ","Er"],["زَوْجَةٌ","Xotin"],["شَجَرَةٌ","Daraxt"],["ضَيْفٌ","Mehmon"],["بَيْتٌ","Uy"],["نَحْنُ","Biz"],["🔁 Takror (2-dars): صَدِيقٌ","Do'st"],["🔁 Takror (1-dars): صُورَةٌ","Surat"],["🔁 Takror (2-dars): بَائِعٌ","Sotuvchi"],["🔁 Takror (2-dars): مَطْعَمٌ","Restoran"]],"test":[["3-10 sonlarning muannas (ayol jinsi) shakli qaysi harfni qo'shish bilan yasaladi?",["Ta marbuta (ة)","Alif (ا)","Nun (ن)","Ya (ي)"],0,"Sonning muannas shakli ة qo'shib yasaladi (mukholafa qoidasi bo'yicha u muzakkar ma'dud bilan ishlatiladi)."],["«ثَلَاثٌ» (uch) sonining muannas shakli qaysi?",["ثَلَاثَةٌ","ثُلَاثٌ","ثَلَاثُونَ","ثَالِثٌ"],0,"ة qo'shiladi: ثَلَاثَةٌ. ثَلَاثُونَ = o'ttiz, ثَالِثٌ = uchinchi."],["1 va 2 sonlari sanalayotgan narsa (ma'dud)ga nisbatan qayerda keladi?",["Ma'duddan keyin","Ma'duddan oldin","Gap boshida","Doim alohida"],0,"1 va 2 ma'duddan keyin keladi va jinsda mos bo'ladi: كِتَابٌ وَاحِدٌ، كِتَابَانِ."],["«Menda ikkita kitob bor» — to'g'ri ifodani toping.",["عِنْدِي كِتَابَانِ","عِنْدِي اِثْنَانِ كِتَابٌ","عِنْدِي كِتَابٌ اِثْنَانِ","عِنْدِي كِتَابَيْنِ"],0,"Ikkilik shaklning o'zi yetadi: عِنْدِي كِتَابَانِ; ta'kid uchun عِنْدِي كِتَابَانِ اثْنَانِ."],["3-10 sonlarda son va ma'dudning jinsi qanday munosabatda bo'ladi?",["Bir-biriga teskari (mukholafa)","Bir xil (muvofiq)","Hech qanday bog'liqlik yo'q","Doim muzakkar bo'ladi"],0,"Mukholafa qoidasi: muzakkar ma'dud → muannas son (ة bilan), muannas ma'dud → muzakkar son (ة-siz)."],["3-10 sanashda ma'dud (sanalayotgan narsa) qaysi ko'rinishda va qaysi kelishikda bo'ladi?",["Ko'plik, majrur (jar)","Birlik, marfu'","Ikkilik, mansub","Ko'plik, marfu'"],0,"3-10 dan keyin ma'dud ko'plik va majrur (mudof ilayh) bo'ladi: ثَلَاثَةُ كُتُبٍ."],["«لِي ثَلَاثَةُ أَعْمَامٍ» gapida «أَعْمَام» so'zining birligi va jinsi qaysi?",["عَمٌّ — muzakkar","عَمَّةٌ — muannas","خَالٌ — muzakkar","أُمٌّ — muannas"],0,"أَعْمَام ning birligi عَمّ (amaki) — muzakkar; shu sababli son muannas (ثَلَاثَة) kelgan."],["«ثَلَاثَةُ أَعْمَامٍ» birikmasida nega son muannas (ة bilan) kelgan?",["Ma'dud (عَمّ) muzakkar bo'lgani uchun","Ma'dud muannas bo'lgani uchun","Gap boshida kelgani uchun","Tasodifan"],0,"Mukholafa: ma'dud muzakkar bo'lsa, son muannas shaklda (ة bilan) keladi."],["«عِنْدِي ثَلَاثُ سَيَّارَاتٍ» gapida nega «ثَلَاثُ» muzakkar (ة-siz) kelgan?",["Ma'dud (سَيَّارَة) muannas bo'lgani uchun","Ma'dud muzakkar bo'lgani uchun","Son doim ة-siz keladi","«عِنْدِي» bo'lgani uchun"],0,"سَيَّارَة muannas → son teskari, ya'ni muzakkar shaklda (ثَلَاث, ة-siz)."],["«Mening bitta xolam bor» — to'g'ri variantni toping.",["عِنْدِي خَالَةٌ وَاحِدَةٌ","عِنْدِي وَاحِدُ خَالَةٍ","عِنْدِي خَالَةٌ وَاحِدٌ","عِنْدِي خَالَتَانِ"],0,"«1» ma'duddan keyin va jinsda mos: خَالَةٌ وَاحِدَةٌ. Sonsiz ham bo'ladi: عِنْدِي خَالَةٌ."],["Arab tilida «nechta?» / «qancha?» so'rog'i qaysi so'z bilan beriladi?",["كَمْ","مَنْ","مَا","أَيْنَ"],0,"كَمْ = nechta/qancha. مَنْ = kim, مَا = nima, أَيْنَ = qayer."],["«كَمْ» dan keyin so'ralayotgan narsa (tamyiz) qanday bo'ladi?",["Birlik, mansub tanvin (ـًا)","Ko'plik, majrur","Ikkilik, marfu'","Birlik, marfu'"],0,"كَمْ dan keyin tamyiz birlik va mansub bo'ladi: كَمْ كِتَابًا."],["«كَمْ صَدِيقًا لَكَ؟» so'rog'ining o'zbekcha tarjimasi qaysi?",["Sening nechta do'sting bor?","Do'sting kim?","Do'sting qayerda?","Sen do'stmisan?"],0,"كَمْ صَدِيقًا لَكَ؟ = Sening nechta do'sting bor?"],["«Senda (erkak) nechta kitob bor?» — to'g'ri arabcha variant.",["كَمْ كِتَابًا عِنْدَكَ؟","كَمْ كُتُبٌ عِنْدَكَ؟","كَمْ عِنْدَكَ كُتُبٌ؟","مَنْ كِتَابًا لَكَ؟"],0,"كَمْ + birlik mansub: كَمْ كِتَابًا عِنْدَكَ؟"],["«كَمْ مِفْتَاحًا مَعَهَا؟» savoliga «Unda beshta kalit bor» javobi qaysi?",["مَعَهَا خَمْسَةُ مَفَاتِيحَ","مَعَهَا خَمْسُ مَفَاتِيحَ","مَعَهَا خَمْسَةُ مِفْتَاحٍ","مَعَهُ خَمْسُ مَفَاتِيحَ"],0,"kalit مِفْتَاح muzakkar → son muannas خَمْسَة; ma'dud ko'plik-majrur مَفَاتِيحَ."],["«Muhammadning oltita amakisi bor» — to'g'ri arabcha variant.",["لِمُحَمَّدٍ سِتَّةُ أَعْمَامٍ","لِمُحَمَّدٍ سِتُّ أَعْمَامٍ"," lari bilan o'tiradi va ularga kitob o'qib beradi.","savollar":[["مَا مِهْنَةُ حَسَنٍ؟","Hasanning kasbi nima?","هُوَ طَبَّاخٌ."],["مَاذَا يَشْرَبُ صَبَاحًا؟","Ertalab nima ichadi?","يَشْرَبُ الشَّايَ."],["أَيْنَ تَعْمَلُ زَوْجَتُهُ؟","Xotini qayerda ishlaydi?","فِي مَدْرَسَةٍ."],["مَاذَا يَفْعَلُ الْأَوْلَادُ بَعْدَ الدَّرْسِ؟","Bolalar darsdan keyin nima qiladi?","يَرْجِعُونَ إِلَى الْبَيْتِ وَيَلْعَبُونَ."]],"gloss":[]},"lugat":[["يَكْتُبُ","Yozadi"],["يَدْرُسُ","Dars qiladi"],["يَقْرَأُ","O'qiydi"],["يَذْهَبُ","Ketadi"],["يَدْخُلُ","Kiradi"],["يَخْرُجُ","Chiqadi"],["يَرْجِعُ","Qaytadi"],["يَجْلِسُ","O'tiradi"],["يَسْمَعُ","Eshitadi"],["يَشْرَبُ","Ichadi"],["يَلْعَبُ","O'ynaydi"],["يَطْبُخُ","Pishiradi"],["يَعْمَلُ","Ishlaydi"],["قَبْلَ","Oldin"],["بَعْدَ","Keyin"],["ثُمَّ","So'ng"],["صَبَاحًا","Ertalab"],["مَسَاءً","Kechqurun"],["الآنَ","Hozir"],["شَايٌ","Choy"],["هُمْ","Ular"],["أَنْتُمْ","Sizlar"],["هُمَا","U ikkisi"],["🔁 Takror (3-dars): جَدَّةٌ","Buvi"],["شَهْرٌ","Oy"],["🔁 Takror (3-dars): أُخْتٌ","Opa/singil"],["🔁 Takror (3-dars): بَيْتٌ","Uy"],["فَوْقَ","Tepasida"],["🔁 Takror (3-dars): غُرْفَةٌ","Xona"]],"test":[["«Mening otam muhandis, u ishga ketyapti» gapining arabcha to'g'ri tarjimasi qaysi?",["أَبِي مُهَنْدِسٌ وَهُوَ يَذْهَبُ إِلَى الْعَمَلِ","أُمِّي مُهَنْدِسَةٌ وَهِيَ تَذْهَبُ إِلَى الْعَمَلِ","أَخِي طَبِيبٌ وَهُوَ يَذْهَبُ إِلَى الْمَدْرَسَةِ","أَبِي طَبِيبٌ وَهُوَ يَجْلِسُ فِي الْمَطْعَمِ"],0,"«otam» = أَبِي, «muhandis» = مُهَنْدِسٌ, «u (erkak) ketyapti» = هُوَ يَذْهَبُ."],["«Uning (ayol) onasi oshxonada taom pishiradi» gapini aniqlang.",["أُمُّهَا تَطْبُخُ الطَّعَامَ فِي الْمَطْبَخِ","أُمُّهُ يَطْبُخُ الطَّعَامَ فِي الْغُرْفَةِ","أُمِّي تَطْبُخُ الطَّعَامَ فِي الْمَطْبَخِ","أُخْتُهَا تَشْرَبُ الشَّايَ فِي الْمَطْبَخِ"],0,"«uning (ayol) onasi» = أُمُّهَا, «oshxona» = الْمَطْبَخ, fe'l muannas تَطْبُخُ."],["«Bizning uyimizda to'qqizta xona bor» gapini toping.",["فِي بَيْتِنَا تِسْعُ غُرَفٍ","فِي بَيْتِكُمْ تِسْعُ غُرَفٍ","فِي بَيْتِنَا أَرْبَعُ غُرَف ,["جَدُّنَا فِي الْمَطْعَمِ.","جَدِّي فِي الْمَطْبَخِ.","جَدُّكُمْ فِي الْمَطْعَمِ.","جَدُّهَا فِي الصَّالَةِ."],0,"«bizning bobomiz» = جَدُّنَا; restoran = الْمَطْعَم."],["«Ular (ayollar)ning uyi katta» gapini aniqlang:",["بَيْتُهُنَّ كَبِيرٌ.","بَيْتُهُمْ كَبِيرٌ.","بَيْتُكُنَّ كَبِيرٌ.","بَيْتُنَا كَبِيرٌ."],0,"«ular (ayollar)ning» = ـهُنَّ → بَيْتُهُنَّ."],["كَمْ طَاوِلَةً فِي الصَّالَةِ؟ (4) savoliga to'g'ri javobni tanlang:",["فِي الصَّالَةِ أَرْبَعُ طَاوِلَاتٍ.","فِي الصَّالَةِ ثَلَاثُ طَاوِلَاتٍ.","أَرْبَعُ طَاوِلَاتٍ فِي الْمَطْبَخِ.","فِي الْغُرْفَةِ أَرْبَعُ طَاوِلَاتٍ."],0,"طَاوِلَة muannas → son ة-siz أَرْبَع; joy الصَّالَة (zal): فِي الصَّالَةِ أَرْبَعُ طَاوِلَاتٍ."],["كَمْ بَابًا فِي الْبَيْتِ؟ (2) savolining javobi qaysi qatorda to'g'ri berilgan?",["فِي الْبَيْتِ بَابَانِ.","فِي الْبَيْتِ بَابٌ وَاحِدٌ.","فِي الْبَيْتِ ثَلَاثَةُ أَبْوَابٍ.","أَبْوَابٌ كَثِيرَةٌ فِي الْبَيْتِ."],0,"«2 ta» uchun ikkilik: بَابَانِ."],["كَمْ كُرْسِيًّا فِي الْمَطْبَخِ؟ (3) savoliga to'g'ri javob:",["فِي الْمَطْبَخِ ثَلَاثَةُ كَرَاسِيَّ.","فِي الْمَطْبَخِ خَمْسَةُ كَرَاسِيَّ.","فِي الصَّالَةِ ثَلَاثَةُ كَرَاسِيَّ.","ثَلَاثَةُ كَرَاسِيَّ فِي الْغُرْفَةِ."],0,"كُرْسِيّ muzakkar → son ة bilan ثَلَاثَة; joy الْمَطْبَخ (oshxona)."],["كَمْ خِزَانَةً فِي الْغُرْفَةِ؟ (5) savolining to'g'ri javobi:",["فِي الْغُرْفَةِ خَمْسُ خِزَانَاتٍ.","فِي الْغُرْفَةِ أَرْبَعُ خِزَانَاتٍ.","فِي الْبَيْتِ خَمْسُ خِزَانَاتٍ.","خَمْسُ خِزَانَاتٍ فِي الْمَطْبَخِ."],0,"خِزَانَة muannas → son ة-siz خَمْس; joy الْغُرْفَة (xona)."],["كَمْ دَفْتَرًا فِي الْخِزَانَةِ؟ (10) savoliga javob bering:",["فِي الْخِزَانَةِ عَشَرَةُ دَفَاتِرَ.","فِي الْخِزَانَةِ خَمْسَةُ دَفَاتِرَ.","عَشَرَةُ دَفَاتِرَ فِي الْمَكْتَبِ.","فِي الْخِزَانَةِ تِسْعَةُ دَفَاتِرَ."],0,"دَفْتَر muzakkar → 10 = عَشَرَة (ة bilan); joy الْخِزَانَة (shkaf)."],["«Zalda otam va amakim bor» gapining arabcha tarjimasi:",["فِي الصَّالَةِ أَبِي وَعَمِّي.","فِي الْغُرْفَةِ أَبِي وَخَالِي.","أَبِي وَعَمِّي فِي الْمَطْبَخِ.","فِي الصَّالَةِ جَدِّي وَ r va shakllar)","فِي الْمَدْرَسَةِ (Maktabda)"],0,"Mavzu: «عَرِّفْ بِنَفْسِكَ وَبِأَفْرَادِ أُسْرَتِكَ»."],["Arab tilida «Ikki sherik / Ikki do'st» ma'nosini anglatuvchi to'g'ri variantni tanlang.",["زَمِيلٌ","زَمِيلَتَانِ","زَمِيلَانِ","زُمَلَاءُ"],2,"زَمِيلَانِ = ikki sherik (muzakkar ikkilik)."]],"lvl":"A1","n":2},"a1_3":{"id":"a1_3","mavzu":"Ta'lim, ko'plik, tartib sonlar","qoidalar":[["To'g'ri ko'plik","Muzakkar: ـُونَ / ـِينَ: مُهَنْدِسُونَ. Muannas: ـَاتٌ: طَالِبَاتٌ، مُعَلِّمَاتٌ."],["Siniq ko'plik","Qolipsiz, yodlanadi: بَيْتٌ → بُيُوتٌ، كِتَابٌ → كُتُبٌ، طَالِبٌ → طُلَّابٌ، دَرْسٌ → دُرُوسٌ."],["G'ayri aqliy ko'plik","Jonsiz/hayvon ko'pligi — muannas birlik kabi: هَذِهِ كُتُبٌ جَدِيدَةٌ (هَؤُلَاءِ emas). هَؤُلَاءِ — faqat odamlar uchun."],["Tartib sonlar","اَلْأَوَّلُ، الثَّانِي، الثَّالِثُ، الرَّابِعُ، الْخَامِسُ … Muannas: الْأُولَى، الثَّانِيَةُ، الثَّالِثَةُ."]],"muhodasa":[["فِي أَيِّ مَرْحَلَةٍ تَدْرُسُ؟","Qaysi bosqichda o'qiysiz?","أَدْرُسُ فِي الْجَامِعَةِ / فِي الْمَدْرَسَةِ الثَّانَوِيَّةِ."],["مَا الْمَادَّةُ الْمُفَضَّلَةُ عِنْدَكَ؟","Sevimli faningiz qaysi?","أُحِبُّ الْعُلُومَ / الطِّبَّ / الشَّرِيعَةَ …"],["هَلِ اللُّغَةُ الْعَرَبِيَّةُ سَهْلَةٌ أَمْ صَعْبَةٌ؟","Arab tili osonmi yoki qiyin?","..."],["مَتَى يَبْدَأُ دَرْسُكَ؟","Darsingiz qachon boshlanadi?","يَبْدَأُ فِي السَّاعَةِ ..."],["مَاذَا تَفْعَلُ فِي وَقْتِ الِاسْتِرَاحَةِ؟","Tanaffusda nima qilasiz?","أَذْهَبُ إِلَى الْمَقْصِفِ ..."],["هَلْ عِنْدَكَ مُعْجَمٌ؟ هَلْ تَسْتَخْدِمُهُ كَثِيرًا؟","Lug'atingiz bormi?","..."],["مَاذَا تُرِيدُ أَنْ تَكُونَ فِي الْمُسْتَقْبَلِ؟","Kelajakda kim bo'lmoqchisiz?","أُرِيدُ أَنْ أَكُونَ مُتَرْجِمًا / ..."],["هَلْ حَصَلْتَ عَلَى دَرَجَةٍ عَالِيَةٍ فِي الِامْتِحَانِ؟","Imtihonda yuqori baho oldingizmi?","..."],["«بَيْتٌ» va «كِتَابٌ» ko'pligi?","","بُيُوتٌ · كُتُبٌ"],["Xatoni toping: «هَؤُلَاءِ كُتُبٌ»","","هَذِهِ كُتُبٌ — jonsiz ko'plik."],["«Birinchi dars», «uchinchi talaba (qiz)»","","الدَّرْسُ الْأَوَّلُ · الطَّالِبَةُ الثَّالِثَةُ"]],"faoliyat":"«Dars jadvali»: o'quvchilar juftlikda bir-birining haftalik jadvalini so'raydi: الدَّرْسُ الْأَوَّلُ … فِي السَّاعَةِ … Keyin sherigining jadvalini guruhga aytib beradi.","matn":{"sarlavha":"يَوْمٌ فِي مَعْهَدِ اللُّغَاتِ","sarlavha_uz":"Tillar institutida bir kun","ar":["أَنَا طَالِبَةٌ فِي مَعْهَدِ اللُّغَاتِ، وَأَدْرُسُ اللُّغَةَ الْعَرَبِيَّةَ وَاللُّغَةَ الْإِنْجِلِيزِيَّةَ.","فِي صَفِّنَا اثْنَا عَشَرَ طَالِبًا: سِتُّ طَالِبَاتٍ وَسِتَّةُ طُلَّابٍ.","الدَّرْسُ الْأَوَّلُ يَبْدَأُ فِي السَّاعَةِ الثَّامِنَةِ، وَهُوَ دَرْسُ الْقِرَاءَةِ.","الدَّرْسُ الثَّانِي صَعْبٌ قَلِيلًا، وَلَكِنَّ الْأُسْتَاذَ رَحِيمٌ وَيَشْرَحُ جَيِّدًا.","فِي وَقْتِ الِاسْتِرَاحَةِ نَذْهَبُ إِلَى الْمَقْصِفِ، وَنَأْكُلُ الْجُبْنَ وَالْخُبْزَ.","كُتُبُ الْمَعْهَدِ جَدِيدَةٌ وَمُفِيدَةٌ.","فِي الْمُسْتَقْبَلِ أُرِيدُ أَنْ أَكُونَ مُتَرْجِمَةً."],"uz":"Men tillar institutida talabaman, arab va ingliz tillarini o'qiyman. Sinfimizda o'n ikki talaba bor: olti qiz va olti yigit. Birinchi dars soat sakkizda boshlanadi, bu o'qish darsi. Ikkinchi dars biroz qiyin, lekin ustoz mehribon va yaxshi tushuntiradi. Tanaffusda bufetga borib, pishloq va non yeymiz. Institut kitoblari yangi va foydali. Kelajakda tarjimon bo'lmoqchiman.","savollar":[["كَمْ طَالِبًا فِي الصَّفِّ؟","Sinfda nechta talaba bor?","اثْنَا عَشَرَ طَالِبًا."],["مَتَى يَبْدَأُ الدَّرْسُ الْأَوَّلُ؟","Birinchi dars qachon boshlanadi?","فِي السَّاعَةِ الثَّامِنَةِ."],["أَيْنَ يَذْهَبُونَ فِي الِاسْتِرَاحَةِ؟","Tanaffusda qayerga borishadi?","إِلَى الْمَقْصِفِ."],["مَاذَا تُرِيدُ أَنْ تَكُونَ؟","Kim bo'lmoqchi?","مُتَرْجِمَةً."]],"gloss":[["يَشْرَحُ","tushuntiradi"]]},"lugat":[["مُشْكِلَةٌ","Muammo"],["أَمْسِ","Kecha (o'tgan kun)"],["خَافَ","Qo'rqmoq"],["مُتَوَسِّطُ الْحَالِ","O'rtahol"],["مُعْجَمٌ","Lug'at (kitobi)"],["اَللُّغَةُ الْإِنْجِلِيزِيَّةُ","Ingliz tili"],["غَدًا","Ertaga"],["فَلَّاحٌ","Dehqon"],["غَنِيٌّ","Boy, badavlat"],["اَلْهَنْدَسَةُ","Muhandislik"],["اَلْخَامِسُ","Beshinchi"],["وَاجِبٌ","Uy vazifasi"],["اَلْمَدْرَسَةُ ا «___ كُتُبٌ جَدِيدَةٌ» (Bular yangi kitoblar) gapida bo'sh joyga qaysi ko'rsatish olmoshi darslik qoidasiga ko'ra to'g'ri?",["هَؤُلَاءِ","هَذِهِ","هَذَا","هَذَانِ"],1,"G'ayri aqliy (aqlsiz) narsalar ko'pligi birlik-muannas — «هَذِهِ» bilan keladi."],["Quyidagi gaplarning qaysi biri grammatik jihatdan MUTLAQO XATO?",["هَذِهِ سَيَّارَاتٌ","هَؤُلَاءِ أَطِبَّاءُ","هَؤُلَاءِ كُتُبٌ","هَذِهِ بُيُوتٌ"],2,"كُتُبٌ — aqlsiz narsalar ko'pligi, «هَؤُلَاءِ» emas «هَذِهِ» bilan kelishi kerak."],["«هَؤُلَاءِ بَنَاتٌ» gapining tarjimasi qaysi?",["Bu — qiz bola.","Bular qizlardir.","Ular qizlardir.","Bu ikkisi qiz boladir."],1,"هَؤُلَاءِ = bular (yaqin, aqlli ko'plik), بَنَاتٌ = qizlar."],["Bo'sh joyga mos olmoshni qo'ying: «___ سَيَّارَاتٌ سَرِيعَةٌ» (Bular tezkor mashinalar).",["هَؤُلَاءِ","هَذَا","هَذِهِ","هُنَّ"],2,"سَيَّارَاتٌ — aqlsiz narsalar ko'pligi, «هَذِهِ» bilan keladi."],["«Biz shifokorlarmiz» gapining arabcha to'g'ri tarjimasini toping.",["أَنَا طَبِيبٌ","نَحْنُ أَطِبَّاءُ","هُمْ أَطِبَّاءُ","أَنْتُمْ أَطِبَّاءُ"],1,"Biz = نَحْنُ, shifokorlar = أَطِبَّاءُ."],["Faqat ayollardan iborat guruhga qarata «Sizlar yangi talabasizlar» demoqchi bo'lsak, qaysi olmoshni ishlatamiz?",["أَنْتُمْ","أَنْتُنَّ","هُنَّ","نَحْنُ"],1,"Ayollar guruhiga murojaat: أَنْتُنَّ = sizlar (ayollar)."],["«هُمْ فَلَّاحُونَ نَشِيطُونَ» gapining o'zbekcha tarjimasi qaysi?",["Sizlar g'ayratli dehqonlarsiz.","Ular g'ayratli dehqonlardir.","Biz g'ayratli dehqonlarmiz.","Ular ikki g'ayratli dehqondir."],1,"هُمْ = ular (erkaklar), فَلَّاحُونَ نَشِيطُونَ = g'ayratli dehqonlar."],["«Sizlar (erkaklar guruhiga) muhandissizlar» gapida qaysi shaxs olmoshi ishlatiladi?",["أَنْتُنَّ","أَنْتُمْ","هُمْ","هُنَّ"],1,"Erkaklar guruhiga murojaat: أَنْتُمْ = sizlar (erkaklar)."],["Bo'sh joyga mos olmoshni qo'ying: «___ مُعَلِّمَاتٌ مُخْلِصَاتٌ» (Ular samimiy o'qituvchi ayollardir).",["هُمْ","هُنَّ","أَنْتُمْ","هُوَ"],1,"Ayollar ko'pligi (g'oyib): هُنَّ = ular (ayollar)."],["«هُمْ لَاعِبَانِ مَاهِرَانِ» gapidagi xatoni tuzatib, to'g'ri variantni ko'rsating.",["هَذَا لَاعِبَانِ مَاهِرَانِ","هُمَا لَاعِبَانِ مَاهِرَانِ","هُنَّ لَاعِبَانِ مَاهِرَانِ","أَنْتُمْ لَاعِبَانِ مَاهِرَانِ"],1,"«لَاعِبَانِ» — ikkilik, shuning uchun «هُمْ» emas, «هُمَا» (ular ikkisi) bo'lishi kerak."],["«مُحَمَّدٌ وَأَحْمَدُ طَالِبَانِ نَشِيطٌ» gapidagi belgilangan so'zning to'g'ri shakli qanday bo'ladi?",["نَشِيطُونَ","نَشِيطَاتٌ","نَشِيطَانِ","نَشِيطَةٌ"],2,"Mavsuf «طَالِبَانِ» ikkilik, sifat ham ikkilik bo'lishi kerak: نَشِيطَانِ."],["«أَنْتِ جَدَّاتٌ طَيِّبَاتٌ» gapidagi xato olmoshni to'g'rilang.",["أَنْتُمْ","أَنْتُنَّ","هُوَ","أَنْتُمَا"],1,"«جَدَّاتٌ» — ayollar ko'pligi, olmosh «أَنْتُنَّ» bo'lishi kerak."],["«هُوَ اِسْمِي خَدِيجَةُ» gapidagi xatoni tuzating.",["أَنَا اِسْمِي خَدِيجَةُ","هِيَ اِسْمِي خَدِيجَةُ","أَنْتِ اِسْمِي خَدِيجَةُ","نَحْنُ اِسْمِي خَدِيجَةُ"],0,"«اِسْمِي» (ismim) — birinchi shaxs, shuning uchun «أَنَا اِسْمِي خَدِيجَةُ»."],["«أَنْتُمْ طُلَّابٌ نَشِيطُونَ» gapida qanday xato bor?",["«طُلَّابٌ» o'rniga «طَالِبٌ» bo'lishi kerak.","Gap to'g'ri, unda xato yo'q.","«أَنْتُمْ» o'rniga «أَنْتِ» bo'lishi kerak.","«نَشِيطُونَ» o'rniga «نَشِيطَاتٌ» bo'lishi kerak."],1,"أَنْتُمْ (sizlar-erkaklar) + طُلَّابٌ (talabalar) + نَشِيطُونَ (g'ayratli) — barchasi mos, gap to'g'ri."],["«أُرِيدُ أَنْ أَكُونَ مُعَلِّمًا» gapining ma'nosi nima?",["Men o'qituvchini yaxshi ko'raman.","Men o'qituvchi bo'lishni xohlayman.","Men maktabda o'qiyman.","Ustozim kelishini xohlayman."],1,"أُرِيدُ أَنْ أَكُونَ = bo'lishni xohlayman."],["«Men gohida qahva ichaman, doimo suv ichaman» gapining arabcha to'g'ri tarjimasini toping.",["أَشْرَبُ الْقَهْوَةَ دَائِمًا، وَأَشْرَبُ الْمَاءَ أَحْيَانًا.","أَشْرَبُ الْقَهْوَةَ أَحْيَانًا، وَأَشْرَبُ الْمَاءَ دَائِمًا.","أُرِيدُ أَنْ أَشْرَبَ الْقَهْوَةَ وَالْمَاءَ.","شَرِبْتُ كَثِيرًا مِنَ الْمَاءِ وَالْقَهْوَةِ."],1,"أَحْيَانًا = gohida (qahva), دَائِمًا = doimo (suv)."],["«شَرِبْتُ كَثِيرًا مِنَ الْمَاءِ» gapidagi «كَثِيرًا مِنَ» iborasi nima degani?",["...dan bir oz","...dan ko'p (ko'p miqdorda)","...ga yaqin","...dan keyin"],1,"كَثِيرًا مِنَ = ...dan ko'p (ko'p miqdorda)."],["«Katta tanaffus qachon? Sen tanaffusda nima qilasan?» savolining arabcha shakli qaysi?",["أَيْنَ تَدْرُسُ؟ وَمَاذَا تَدْرُسُ؟","كَمْ سَاعَةً تَدْرُسُ فِي الْيَوْمِ؟","مَتَى وَقْتُ الاِسْتِرَاحَةِ؟ وَمَاذَا تَفْعَلُ فِيهَا؟","كَمْ يَوْمًا تَدْرُسُ فِي الْأُسْبُوعِ؟"],2,"مَتَى وَقْتُ الاِسْتِرَاحَةِ؟ = tanaffus qachon?, مَاذَا تَفْعَلُ فِيهَا؟ = unda nima qilasan?"]],"lvl":"A1","n":3},"a1_4":{"id":"a1_4","mavzu":"Kasb va ish, ismiy gap","qoidalar":[["Ismiy gap","Mubtado (ism, marfu') + xabar (marfu'): الْمُهَنْدِسُ مَشْغُولٌ. Muannas mubtadoga muannas xabar: الطَّالِبَةُ مُجْتَهِدَةٌ."],["Bog'langan (egalik) olmoshlar","ـِي، ـكَ، ـكِ، ـهُ، ـهَا، ـنَا، ـكُمْ، ـهُمْ: عَمَلِي، عَمَلُهُ، عَمَلُنَا."],["لَيْسَ — ismiy gap inkori","لَيْسَ + xabar mansub: هُوَ لَيْسَ طَبِيبًا. Tuslanadi: لَسْتُ، لَسْتَ، لَيْسَتْ، لَيْسُوا."],["Hafta kunlari","اَلسَّبْتُ، الْأَحَدُ، الِاثْنَيْنِ، الثُّلَاثَاءُ، الْأَرْبِعَاءُ، الْخَمِيسُ، الْجُمُعَةُ."]],"muhodasa":[["مَا عَمَلُكَ؟ وَأَيْنَ تَعْمَلُ؟","Ishingiz nima, qayerda ishlaysiz?","أَعْمَلُ ... فِي شَرِكَةٍ / فِي مَتْجَرٍ ..."],["كَمْ سَاعَةً تَعْمَلُ فِي الْيَوْمِ؟","Kuniga necha soat ishlaysiz?","أَعْمَلُ ثَمَانِيَ سَاعَاتٍ تَقْرِيبًا."],["هَلْ عَمَلُكَ حُكُومِيٌّ أَمْ خَاصٌّ؟","Ishingiz davlatnikimi yoki xususiy?","..."],["مَتَى تَسْتَيْقِظُ لِلْعَمَلِ؟","Ishga qachon uyg'onasiz?","أَسْتَيْقِظُ مُبَكِّرًا، فِي السَّاعَةِ ..."],["مَا يَوْمُ عُطْلَتِكَ؟","Dam olish kuningiz qaysi?","عُطْلَتِي يَوْمَ الْجُمُعَةِ / الْأَحَدِ."],["هَلْ رَاتِبُكَ كَافٍ؟ :)","Maoshingiz yetarlimi?","الْحَمْدُ لِلَّهِ ..."],["مَا مُمَيِّزَاتُ عَمَلِكَ؟","Ishingizning afzalliklari?","..."],["أَيُّ عَمَلٍ تُحِبُّ؟ طَيَّارٌ أَمْ طَبَّاخٌ أَمْ فَلَّاحٌ؟","Qaysi ishni yoqtirasiz?","..."],["«Men shifokor emasman», «u (ayol) band emas»","","لَسْتُ طَبِيبًا · لَيْسَتْ مَشْغُولَةً"],["«Bizning ishimiz qiyin»","","عَمَلُنَا صَعْبٌ."],["Mehnat qilayotgan odamga nima deysiz?","","أَعَانَكَ اللهُ / يَسَّرَ اللهُ لَكَ"]],"faoliyat":"«Ish suhbati» rol o'yini: bir o'quvchi — kompaniya direktori, boshqasi — ishga kiruvchi. Direktor tajriba (خِبْرَةٌ), ish vaqti, maosh haqida so'raydi.","matn":{"sarlavha":"الطَّيَّارُ يُوسُفُ","sarlavha_uz":"Uchuvchi Yusuf","ar":["يُوسُفُ طَيَّارٌ فِي شَرِكَةِ طَيَرَانٍ كَبِيرَةٍ.","هُوَ يَسْتَيْقِظُ مُبَكِّرًا، يُصَلِّي الْفَجْرَ، ثُمَّ يَذْهَبُ إِلَى الْمَطَارِ.","عَمَلُهُ صَعْبٌ، وَلَكِنَّهُ يُحِبُّهُ كَثِيرًا.","يَعْمَلُ عَشْرَ سَاعَاتٍ تَقْرِيبًا فِي الْيَوْمِ، وَيُسَافِرُ إِلَى بِلَادٍ كَثِيرَةٍ.","رَاتِبُهُ مُمْتَازٌ، وَلَهُ حَافِزٌ شَهْرِيٌّ أَيْضًا.","عُطْلَتُهُ يَوْمُ السَّبْتِ وَيَوْمُ الْأَحَدِ.","فِي الْعُطْلَةِ يَسْتَرِيحُ فِي الْبَيْتِ وَيَتَجَوَّلُ مَعَ أُسْرَتِهِ.","يُوسُفُ لَيْسَ كَسْلَانَ، هُوَ نَشِيطٌ وَمُجْتَهِدٌ."],"uz":"Yusuf katta aviakompaniyada uchuvchi. U erta uyg'onadi, bomdodni o'qiydi, so'ng aeroportga boradi. Ishi qiyin, lekin uni juda yaxshi ko'radi. Kuniga taxminan o'n soat ishlaydi va ko'p mamlakatlarga uchadi. Maoshi a'lo, oylik rag'bat puli ham bor. Dam olish kunlari — shanba va yakshanba. Dam olishda uyda hordiq chiqaradi va oilasi bilan sayr qiladi. Yusuf dangasa emas, u g'ayratli va tirishqoq.","savollar":[["أَيْنَ يَعْمَلُ يُوسُفُ؟","Yusuf qayerda ishlaydi?","فِي شَرِكَةِ طَيَرَانٍ."],["كَمْ سَاعَةً يَعْمَلُ؟","Necha soat ishlaydi?","عَشْرَ سَاعَاتٍ تَقْرِيبًا."],["مَتَى عُطْلَتُهُ؟","Dam olishi qachon?","يَوْمَ السَّبْتِ وَالْأَحَدِ."],["هَلْ يُوسُفُ كَسْلَانُ؟","Yusuf dangasami?","لَا، هُوَ لَيْسَ كَسْلَانَ، هُوَ نَشِيطٌ."]],"gloss":[["بِلَادٌ","mamlakatlar"]]},"lugat":[["حَتَّى","...gacha; hatto"],["سَعِيدٌ بِـ","...dan xursand"],["خِبْرَةٌ","Tajriba"],["بَيْضٌ","Tuxum"],["اَلْأَحَدُ","Yakshanba"],["تَحَدَّثْ","Gapir, so'zlab ber"],["صَالُونُ حِلَاقَةٍ","Sartaroshxona"],["وَسَطُ الْبَلَدِ","Shahar markazi"],["دَجَاجٌ","Tovuq"],["أَعَانَكَ اللهُ","Alloh yordamchi bo'lsin"],["عَلَى الْأَقَلِّ","Kamida"],["مَرِيضٌ","Bemor, kasal odam"],["مَتْجَرٌ","Magazin, savdo s  اللهُ لَهُ."],["Bo'shliqni to'ldiring: «ذَهَبْتُ إِلَى ___» (Men o'z sinfimga ketdim).",["صَفِّهِ","صَفِّكِ","صَفِّي","صَفِّهَا"],2,"«o'z sinfimga» (men) — صَفِّي."],["«عَمَلُ كُلِّ يَوْمٍ» birikmasining ma'nosi nima?",["Haftada bir kunlik ish","Har kungi ish / har kuni ishlash","Ishning oxiri","Kechki ish"],1,"عَمَلُ كُلِّ يَوْمٍ = har kungi ish."],["«الطَّبِيبُ يُحِبُّ عَمَلَهُ، لِأَنَّهُ ___» gapini mantiqan to'ldiring.",["يَأْكُلُ الطَّعَامَ","يُسَاعِدُ النَّاسَ","يَذْهَبُ إِلَى السُّوقِ","يَنَامُ كَثِيرًا"],1,"Shifokor ishini sevadi, chunki «يُسَاعِدُ النَّاسَ» (odamlarga yordam beradi)."],["«الْكِتَابُ لِي» (Kitob meniki) gapini bog'langan olmosh yordamida qanday qisqartirish mumkin?",["كِتَابُكَ","كِتَابِي","كِتَابُهُ","كِتَابُنَا"],1,"«meniki» — كِتَابِي."],["«الْقَلَمُ لَكَ» (Qalam seniki) iborasi qaysi so'zga teng?",["قَلَمِي","قَلَمُكَ","قَلَمُهُ","قَلَمُهَا"],1,"«seniki» — قَلَمُكَ."],["«عَمَلُنَا صَعْبٌ» gapida kishilik olmoshi (نَحْنُ) qanday o'zgarish hosil qilgan?",["عَمِلْتُ bo'lgan","عَمَلُنَا bo'lib, egalik shakliga o'tgan","Hech qanday o'zgarish yo'q","Bog'lanmagan shaklda qolgan"],1,"نَحْنُ → ـنَا egalik olmoshi: عَمَلُنَا (ishimiz)."],["«أَنَا سَعِيدٌ بِـ ___ يَا أَصْدِقَائِي» (Ey do'stlarim, men sizlardan xursandman). Bo'sh joyga mos olmoshni qo'ying.",["بِهِ","بِكَ","بِكُمْ","بِهِمَا"],2,"«sizlar» (do'stlar — ko'plik) — بِكُمْ."],["«أَبِي وَأُمِّي فِي الْقَرْيَةِ، وَأَذْهَبُ ___» (Ota-onam qishloqda, men ularning oldiga boraman). Bo'sh joyga mos predlog va olmosh birikmasini toping.",["إِلَيْهِ","إِلَيْهِمَا","إِلَيْهَا","إِلَيْكَ"],1,"Ota va ona — ikki kishi (ikkilik): إِلَيْهِمَا (ular ikkisiga)."],["«يَجِبُ أَنْ نَدْرُسَ كَثِيرًا، لِأَنَّ ___ مُهِمٌّ جِدًّا» (Ko'p o'qishimiz kerak, chunki imtihonimiz juda muhim).",["اِمْتِحَانِي","اِمْتِحَانَكُنَّ","اِمْتِحَانَنَا","اِمْتِحَانَهُ"],2,"«imtihonimiz» (biz) — اِمْتِحَانَنَا."],["«أَنَا أُحِبُّ الرِّيَاضَةَ كَثِيرًا» gapining tarjimasi qaysi javobda to'g'ri berilgan?",["Men kitob o'qishni yaxshi ko'raman.","Men sportni juda yaxshi ko'raman.","Men ishlashni afzal ko'raman.","Men dam olishni xohlayman."],1,"الرِّيَاضَةَ = sport, كَثِيرًا = juda."],["Qaysi javobda «Kishilik olmoshi → Bog'langan olmosh» juftligi XATO berilgan?",["هُوَ → ـهُ","هِيَ → ـهَا","أَنْتِ → ـكَ","أَنْتُمْ → ـكُمْ"],2,"«أَنْتِ» (sen — ayol) ga «ـكِ» mos keladi, «ـكَ» emas."],["«كَمْ سَاعَةً تَعْمَلُ؟» savoliga qaysi javob mos keladi?",["أَعْمَلُ فِي الْمَدْرَسَةِ.","أَعْمَلُ ثَمَانِيَ سَاعَاتٍ.","أَنَا مُهَنْدِسٌ نَشِيطٌ.","الْعَمَلُ صَعْبٌ جِدًّا."],1,"«Necha soat ishlaysan?» ga soat soni bilan javob: ثَمَانِيَ سَاعَاتٍ (sakkiz soat)."]],"lvl":"A1","n":4},"a1_5":{"id":"a1_5","mavzu":"Turar joy, o'tgan zamon, fe'liy gap","qoidalar":[["O'tgan zamon (maziy) tuslanishi","أَنَا جَلَسْتُ · أَنْتَ جَلَسْتَ · أَنْتِ جَلَسْتِ · هُوَ جَلَسَ · هِيَ جَلَسَتْ · نَحْنُ جَلَسْنَا · هُمْ جَلَسُوا."],["Fe'liy gap","Fe'l bilan boshlanadi: سَكَنَ الْجَارُ فِي الشُّقَّةِ. Foil muannas bo'lsa fe'lga ـَتْ: سَكَنَتِ الْجَارَةُ."],["Uy iboralari","تُطِلُّ عَلَى — ...ga qaragan · تَتَكَوَّنُ مِنْ — ...dan iborat · خَاصٌّ بِـ — ...ga xos · قَرِيبٌ مِنْ — ...ga yaqin."],["اَلَّذِي / اَلَّتِي","Nisbiy olmosh: الْبَيْتُ الَّذِي سَكَنْتُ فِيهِ · الشُّقَّةُ الَّتِي اشْتَرَيْتُهَا."]],"muhodasa":[["هَلْ تَسْكُنُ فِي بَيْتٍ أَمْ فِي شُقَّةٍ؟","Hovlidami yoki kvartirada yashaysiz?","أَسْكُنُ فِي شُقَّةٍ / بَيْتٍ."],["مِمَّ يَتَكَوَّنُ بَيْتُكَ؟","Uyingiz nimalardan iborat?","يَتَكَوَّنُ مِنْ ثَلَاثِ غُرَفٍ وَمَطْبَخٍ وَحَمَّامٍ."],["فِي أَيِّ طَابِقٍ شُقَّتُكَ؟ هَلْ فِيهَا مِصْعَدٌ؟","Kvartirangiz nechanchi qavatda? Lift bormi?","شُقَّتِي فِي الطَّابِقِ ..."],["عَلَى مَاذَا تُطِلُّ نَافِذَةُ غُرْفَتِكَ؟","Xonangiz derazasi nimaga qaragan?","تُطِلُّ عَلَى الشَّارِعِ / الْحَدِيقَةِ."],["هَلْ حَيُّكَ هَادِئٌ أَمْ مُزْدَحِمٌ؟","Mahallangiz tinchmi yoki gavjum?","..."],["مَنْ جَارُكَ؟ هَلْ تَعْرِفُهُ جَيِّدًا؟","Qo'shningiz kim?","..."],["أَيْنَ سَكَنْتَ قَبْلَ هَذَا الْبَيْتِ؟","Bu uydan oldin qayerda yashagansiz?","سَكَنْتُ فِي ..."],["مَاذَا اشْتَرَيْتَ لِلْبَيْتِ أَخِيرًا؟","Yaqinda uy uchun nima sotib oldingiz?","اشْتَرَيْتُ ثَلَّاجَةً / سَجَّادَةً ..."],["«جَلَسَ» — أَنَا, أَنْتِ, هُمْ uchun","","جَلَسْتُ · جَلَسْتِ · جَلَسُوا"],["«Qo'shni ayol ko'chib keldi» (سَكَنَ)","","سَكَنَتِ الْجَارَةُ."],["Muzlatgich qaysi xonada turadi?","","فِي الْمَطْبَخِ."]],"faoliyat":"«Kvartira ijarasi»: bir o'quvchi — uy egasi, ikkinchisi — ijarachi. Ijarachi xonalar, qavat, lift, narx (دُولَارٌ), mebel (مَفْرُوشَةٌ؟) haqida so'raydi.","matn":{"sarlavha":"شُقَّتِي الْجَدِيدَةُ","sarlavha_uz":"Mening yangi kvartiram","ar":["فِي الشَّهْرِ الْمَاضِي سَكَنْتُ فِي شُقَّةٍ جَدِيدَةٍ.","الشُّقَّةُ فِي الطَّابِقِ الْخَامِسِ، وَفِي الْبِنَايَةِ مِصْعَدٌ.","تَتَكَوَّنُ الشُّقَّةُ مِنْ غُرْفَتَيْنِ لِلنَّوْمِ، وَغُرْفَةِ جُلُوسٍ، وَمَطْبَخٍ، وَحَمَّامٍ.","غُرْفَةُ الْجُلُوسِ وَاسِعَةٌ، وَلَهَا شُرْفَةٌ تُطِلُّ عَلَى حَدِيقَةٍ جَمِيلَةٍ.","الشُّقَّةُ مَفْرُوشَةٌ: فِيهَا أَرِيكَةٌ وَسَرِيرَانِ وَثَلَّاجَةٌ.","الْحَيُّ هَادِئٌ وَقَرِيبٌ مِنَ الْمَسْجِدِ.","أَمْسِ زَارَنِي جَارِي، وَشَرِبْنَا الشَّايَ فِي الشُّرْفَةِ."],"uz":"O'tgan oy yangi kvartiraga ko'chdim. Kvartira beshinchi qavatda, binoda lift bor. Kvartira ikkita yotoqxona, mehmonxona, oshxona va hammomdan iborat. Mehmonxona keng, uning chiroyli bog'ga qaragan balkoni bor. Kvartira jihozlangan: divan, ikkita karavot va muzlatgich bor. Mahalla tinch va masjidga yaqin. Kecha qo'shnim meni ziyorat qildi, balkonda choy ichdik.","savollar":[["فِي أَيِّ طَابِقٍ الشُّقَّةُ؟","Kvartira nechanchi qavatda?","فِي الطَّابِقِ الْخَامِسِ."],["مِمَّ تَتَكَوَّنُ الشُّقَّةُ؟","Kvartira nimalardan iborat?","مِنْ غُرْفَتَيْنِ لِلنَّوْمِ وَغُرْفَةِ جُلُوسٍ وَمَطْبَخٍ وَحَمَّامٍ."],["عَلَى مَاذَا تُطِلُّ الشُّرْفَةُ؟","Balkon nimaga qaragan?","عَلَى حَدِيقَةٍ جَمِيلَةٍ."],["مَاذَا فَعَلَ مَعَ جَارِهِ؟","Qo'shnisi bilan nima qildi?","شَرِبَا الشَّايَ فِي الشُّرْفَةِ."]],"gloss":[]},"lugat":[["تَعَلَّمَ","O'rganmoq"],["قَرِيبٌ مِنْ","Yaqin (...ga)"],["أَرِيكَةٌ","Divan"],[ uchun","مَنْ — Sabab (السَّبَب) uchun"],3,"مَنْ — shaxs (kim) uchun; sabab uchun «لِمَاذَا» ishlatiladi."]],"lvl":"A1","n":7},"a1_8":{"id":"a1_8","mavzu":"Restoranda; maziy tuslanishi, sonlar 3–99","qoidalar":[["Maziy — to'liq tuslanish","وَصَلْتُ · وَصَلْتَ · وَصَلْتِ · وَصَلَ · وَصَلَتْ · وَصَلْنَا · وَصَلْتُمْ · وَصَلُوا · وَصَلَا (هُمَا) · وَصَلْتُمَا."],["3–10","Son ma'dudga jinsda teskari, ma'dud KO'PLIK va majrur: سَبْعُ لِيرَاتٍ، ثَمَانِي سَاعَاتٍ، خَمْسَةُ أَطْبَاقٍ."],["11–99","Ma'dud BIRLIK va mansub: خَمْسَةَ عَشَرَ كِتَابًا، عِشْرُونَ طَالِبًا، ثَلَاثُونَ دِينَارًا."],["Restoran iboralari","قَائِمَةُ الطَّعَامِ مِنْ فَضْلِكَ · مَاذَا تَطْلُبُ؟ · الْحِسَابُ مِنْ فَضْلِكَ · بِالْهَنَاءِ وَالشِّفَاءِ · سَلِمَتْ يَدَاكِ."]],"muhodasa":[["مَاذَا تَنَاوَلْتَ عَلَى الْفُطُورِ الْيَوْمَ؟","Bugun nonushtada nima yedingiz?","تَنَاوَلْتُ ..."],["هَلْ تُحِبُّ اللَّحْمَ الْمَشْوِيَّ أَمِ الْمَسْلُوقَ؟","Kabobmi yoki qaynatilgan go'sht?","..."],["مَتَى ذَهَبْتَ إِلَى الْمَطْعَمِ آخِرَ مَرَّةٍ؟ مَاذَا طَلَبْتَ؟","Oxirgi marta restoranda nima buyurtma qildingiz?","ذَهَبْتُ ... وَطَلَبْتُ ..."],["هَلْ أَنْتَ جَائِعٌ الْآنَ أَمْ شَبْعَانُ؟","Hozir ochmisiz yoki to'q?","..."],["مَا أَكْلَتُكَ الْمُفَضَّلَةُ؟","Sevimli taomingiz?","..."],["(rol: nodil) أَهْلًا! مَاذَا تَطْلُبُ؟","Xush kelibsiz! Nima buyurasiz?","أُرِيدُ دَجَاجًا مَشْوِيًّا وَعَصِيرًا مِنْ فَضْلِكَ."],["كَمْ طَالِبًا فِي صَفِّكُمْ؟ (11+)","Sinfingizda nechta talaba bor?","فِي صَفِّنَا خَمْسَةَ عَشَرَ طَالِبًا."],["كَمْ سَاعَةً تَنَامُ؟","Necha soat uxlaysiz?","أَنَامُ ثَمَانِيَ سَاعَاتٍ / سَبْعَ سَاعَاتٍ."],["«وَصَلَ» — نَحْنُ, هُمَا, أَنْتُمَا","","وَصَلْنَا · وَصَلَا · وَصَلْتُمَا"],["«7 lira» va «20 lira»","","سَبْعُ لِيرَاتٍ · عِشْرُونَ لِيرَةً"],["Oshpazni maqtang","","سَلِمَتْ يَدَاكَ / يَدَاكِ! الطَّعَامُ لَذِيذٌ."]],"faoliyat":"«Restoran»: ustoz menyu yozadi (narxlari bilan). Bir o'quvchi — nodil, qolganlari — mijozlar. Har mijoz buyurtma beradi va oxirida hisobni (sonlar bilan) hisoblaydi.","matn":{"sarlavha":"عَشَاءٌ مَعَ الْأَصْدِقَاءِ","sarlavha_uz":"Do'stlar bilan kechki ovqat","ar":["أَمْسِ ذَهَبْنَا أَنَا وَأَرْبَعَةُ أَصْدِقَاءَ إِلَى مَطْعَمٍ جَدِيدٍ.","جَاءَ النَّادِلُ وَأَعْطَانَا قَائِمَةَ الطَّعَامِ.","طَلَبَ صَدِيقِي أَحْمَدُ لَحْمًا مَشْوِيًّا مَعَ الْأَرُزِّ، وَطَلَبَ عَلِيٌّ سَمَكًا مَقْلِيًّا.","أَنَا نَبَاتِيٌّ، لِذَلِكَ طَلَبْتُ سَلَطَةً مِنَ الْخَسِّ وَالطَّمَاطِمِ وَفَاصُولْيَا.","شَرِبْنَا عَصِيرَ الْبُرْتُقَالِ، وَكَانَ الطَّعَامُ لَذِيذًا جِدًّا.","كَانَ الْحِسَابُ خَمْسَةً وَسَبْعِينَ دُولَارًا، فَدَفَعَ كُلُّ وَاحِدٍ خَمْسَةَ عَشَرَ دُولَارًا.","رَجَعْنَا إِلَى الْبَيْتِ فِي السَّاعَةِ الْعَاشِرَةِ وَنَحْنُ شِبَاعٌ وَسُعَدَاءُ."],"uz":"Kecha men va to'rt do'stim yangi restoranga bordik. Ofitsiant kelib menyuni berdi. Do'stim Ahmad guruch bilan kabob, Ali esa qovurilgan baliq buyurdi. Men vegetarianman, shuning uchun salat bargi, pomidor va loviyadan salat buyurdim. Apelsin sharbati ichdik, taom juda mazali edi. Hisob yetmish besh dollar bo'ldi, har birimiz o'n besh dollardan to'ladik. Soat o'nda to'q va xursand holda uyga qaytdik.","savollar":[["كَمْ شَخْصًا ذَهَبُوا إِلَى الْمَطْعَمِ؟","Restoranga necha kishi bordi?","خَمْسَةُ أَشْخَاصٍ."],["مَاذَا طَلَبَ عَلِيٌّ؟","Ali nima buyurdi?","سَمَكًا مَقْلِيًّا."],["لِمَاذَا طَلَبَ الْكَاتِبُ سَلَطَةً؟","Muallif nega salat buyurdi?","لِأَنَّهُ نَبَاتِيٌّ."],["كَمْ دَفَعَ كُلُّ وَاحِدٍ؟","Har biri qancha to'ladi?","خَمْسَةَ عَشَرَ دُولَارًا."]],"gloss":[["شِبَاعٌ","to'q (ko'plik)"],["سُعَدَاءُ","xursandlar"]]},"lugat":[["قَارِنْ","Taqqosla"],["لَذِيذٌ","Mazali, lazzatli"],["قَلِيلًا","Ozgina, biroz"],["مَشْوِيٌّ","Kabob qilingan (cho'g'da)"],["وَجْبَةٌ دَسِمَةٌ","To'yimli (yog'li) taom"],["بَدَّلَ","Almashtirmoq"],["لَحْمٌ","Go'sht"],["فَاصُولْيَا","Loviya"],["حَلِيبٌ","Sut"],["حَمَلَ","Ko'tarmoq, olib yurmoq"],["فَطِيرَةٌ","Pirog, qatlama"],["تَذَكَّرْ","Eslab qol"],["بَطَاطِسُ","Kartoshka"],["اَلْجَرْيُ","Yugurish"],["نَادِلٌ","Ofitsiant"],["مَسْلُوقٌ","Qaynatilgan"],["خَسٌّ","Salat bargi  ko'rasiz."],["«سَيَكُونُ الْوَاجِبُ جَاهِزًا بَعْدَ قَلِيلٍ» jumlasi qanday tarjima qilinadi?",["Taom birozdan keyin tayyor bo'ladi.","Vazifa birozdan keyin tayyor bo'ladi.","Dars birozdan keyin boshlanadi.","Namoz birozdan keyin o'qiladi."],1,"الْوَاجِبُ = vazifa, جَاهِزًا بَعْدَ قَلِيلٍ = birozdan keyin tayyor."],["Ofitsiant mijozga «Taom birozdan keyin tayyor bo'ladi» demoqchi, u qaysi jumlani aytishi kerak?",["سَيَكُونُ الطَّعَامُ جَاهِزًا بَعْدَ قَلِيلٍ","سَيَكُونُ الْوَاجِبُ جَاهِزًا بَعْدَ قَلِيلٍ","لَا تَتَأَخَّرْ عَنِ الْمَطْعَمِ","سَلِمَتْ يَدَاكَ يَا طَبَّاخُ"],0,"الطَّعَامُ = taom; سَيَكُونُ الطَّعَامُ جَاهِزًا بَعْدَ قَلِيلٍ."],["«Ikki qiz (talaba) taomni tanovul qilishdi» gapining to'g'ri arabcha tarjimasini aniqlang.",["الطَّالِبَانِ تَنَاوَلَا الطَّعَامَ","الطَّالِبَاتُ تَنَاوَلْنَ الطَّعَامَ","الطَّالِبَتَانِ تَنَاوَلَتَا الطَّعَامَ","الطُّلَّابُ تَنَاوَلُوا الطَّعَامَ"],2,"Ikki talaba qiz — muannas ikkilik: الطَّالِبَتَانِ تَنَاوَلَتَا."],["«شَرِبْتُمُ الْعَصِيرَ فِي الاسْتِرَاحَةِ» gapining o'zbekcha tarjimasi:",["Biz tanaffusda sharbat ichdik.","Sizlar (erkaklar) tanaffusda sharbat ichdingiz.","Ular tanaffusda sharbat ichdilar.","Sizlar (ayollar) tanaffusda sharbat ichdingiz."],1,"شَرِبْتُمْ = sizlar (erkaklar) ichdingiz."],["Arab tilida 3 dan 10 gacha bo'lgan sonlarning qoidasi qanday?",["Son jinsda moslashadi, sanaladigan narsa birlik va mansub bo'ladi.","Son jinsda teskari bo'ladi, sanaladigan narsa ko'plik va majrur (zerli) bo'ladi.","Sanaladigan narsa har doim birlik va majrur bo'ladi.","Son va sanaladigan narsa har doim mansub (fathali) bo'ladi."],1,"3–10: son sanaladigan narsaga jinsda teskari, narsa esa ko'plik va majrur bo'ladi."],["Arab tilida 11 dan 99 gacha bo'lgan sonlardan keyin keladigan ot (sanaladigan narsa) qanday holatda bo'ladi?",["Ko'plik va majrur (جمع مجرور)","Birlik va mansub (مفرد منصوب)","Birlik va majrur (مفرد مجرور)","Ko'plik va mansub (جمع منصوب)"],1,"11–99: sanaladigan narsa birlik va mansub (tamyiz) bo'ladi."],["«قَرَأْتُ عِشْرِينَ رِوَايَةً» gapidagi grammatik qoida qaysi javobda to'g'ri izohlangan?",["20 sonidan keyin sanaladigan narsa ko'plik va majrur kelgan.","20 sonidan keyin sanaladigan narsa birlik va mansub kelgan.","3–10 qoidasiga binoan majrur bo'lgan.","Bu yerda fe'l va foil moslashmagan."],1,"20 (11–99 oralig'i): «رِوَايَةً» birlik va mansub (tamyiz) bo'lgan."]],"lvl":"A1","n":8},"a1_9":{"id":"a1_9","mavzu":"Xarid; kelasi zamon (سـ / سَوْفَ)","qoidalar":[["Kelasi zamon","Muzori' oldiga سَـ (yaqin) yoki سَوْفَ (uzoqroq): سَأَشْتَرِي، سَوْفَ تَبْدَأُ الدِّرَاسَةُ."],["Muzori' ikkilik va ayol shakllari","أَنْتِ تَذْهَبِينَ · هُمَا يَسْأَلَانِ (m) / تَذْهَبَانِ (f) · أَنْتُمَا تَشْتَرِيَانِ."],["Xarid iboralari","كَمِ الثَّمَنُ؟ / بِكَمْ هَذَا؟ · هَلْ تُرِيدُ شَيْئًا آخَرَ؟ · غَالٍ ↔ رَخِيصٌ · طَازَجٌ · تَخْفِيضَاتٌ."],["O'lchov","كِيلُو مِنَ الطَّمَاطِمِ · عُلْبَةُ حَلِيبٍ · قَارُورَةُ مَاءٍ · كِيسٌ."]],"muhodasa":[["مَاذَا سَتَشْتَرِي هَذَا الْأُسْبُوعَ؟","Bu hafta nima sotib olasiz?","سَأَشْتَرِي ..."],["أَيْنَ تَشْتَرِي الْخَضْرَاوَاتِ عَادَةً؟","Sabzavotni odatda qayerdan olasiz?","مِنَ السُّوقِ / مِنَ الْبَقَّالِ."],["كَمْ ثَمَنُ كِيلُو اللَّحْمِ فِي مَدِينَتِكَ؟","Shahringizda bir kilo go'sht qancha?","..."],["هَلْ تُحِبُّ التَّسَوُّقَ؟ لِمَاذَا؟","Xarid qilishni yoqtirasizmi?","..."],["مَاذَا سَتَفْعَلُ غَدًا؟","Ertaga nima qilasiz?","سَوْفَ ..."],["(rol: sotuvchi) أَهْلًا، مَاذَا تُرِيدُ؟","Nima xohlaysiz?","أُرِيدُ كِيلُو مِنَ التُّفَّاحِ، كَمِ الثَّمَنُ؟"],["هَلْ تَشْتَرِي مِنَ الْإِنْتَرْنِتِ؟","Internetdan xarid qilasizmi?","..."],["هَلْ هَذَا الْقَمِيصُ غَالٍ أَمْ رَخِيصٌ؟ (rasm)","Bu ko'ylak qimmatmi yoki arzon?","..."],["«Men sotib olaman» → kelasi zamon","","سَأَشْتَرِي / سَوْفَ أَشْتَرِي"],["«Ular ikkisi (qizlar) boradi»","","هُمَا تَذْهَبَانِ"],["Sotuvchi: «Yana biror narsa xohlaysizmi?»","","هَلْ تُرِيدُ شَيْئًا آخَرَ؟"]],"faoliyat":"«Bozor»: o'quvchilarga xarid ro'yxati beriladi (3 ta mahsulot). Ular sotuvchi-o'quvchidan narx so'raydi, savdolasha َكَ أَلَمٌ فِي الْبَطْنِ؟","Qorningiz og'risa nima qilasiz?","إِذَا ... أَشْرَبُ ..."],["كَمْ مَرَّةً تُنَظِّفُ أَسْنَانَكَ فِي الْيَوْمِ؟","Kuniga necha marta tish tozalaysiz?","مَرَّتَيْنِ."],["هَلْ تُمَارِسُ الرِّيَاضَةَ لِلصِّحَّةِ؟","Sog'liq uchun sport bilan shug'ullanasizmi?","..."],["(rol: shifokor) مِمَّ تَشْكُو؟","Nimadan shikoyat qilasiz?","عِنْدِي أَلَمٌ فِي ..."],["هَلْ حَجَزْتَ مَوْعِدًا عِنْدَ طَبِيبِ الْأَسْنَانِ؟","Tish shifokoriga navbat oldingizmi?","..."],["مَاذَا تَقُولُ لِصَدِيقٍ مَرِيضٍ؟","Kasal do'stga nima deysiz?","شَفَاكَ اللهُ، لَا بَأْسَ عَلَيْكَ."],["«U dorini olmadi» — ikki xil inkor","","لَمْ يَأْخُذِ الدَّوَاءَ · مَا أَخَذَ الدَّوَاءَ"],["«Mening vaqtim yo'q»","","لَيْسَ عِنْدِي وَقْتٌ."],["Gapdagi foil va maf'ulni toping: «فَحَصَ الطَّبِيبُ الْمَرِيضَ»","","foil: الطَّبِيبُ · maf'ul: الْمَرِيضَ"]],"faoliyat":"«Klinikada»: juft rol o'yini — bemor va shifokor. Bemor kartochkada yozilgan og'riqni (tish, qorin, oyoq) aytadi; shifokor savol beradi va maslahat (يَجِبُ أَنْ …، لَا تَأْكُلْ …) beradi.","matn":{"sarlavha":"عِنْدَ طَبِيبِ الْأَسْنَانِ","sarlavha_uz":"Tish shifokorida","ar":["شَعَرَ خَالِدٌ بِأَلَمٍ شَدِيدٍ فِي سِنِّهِ، فَلَمْ يَنَمْ جَيِّدًا فِي اللَّيْلِ.","فِي الصَّبَاحِ حَجَزَ مَوْعِدًا فِي الْعِيَادَةِ، وَذَهَبَ إِلَيْهَا فِي السَّاعَةِ الْعَاشِرَةِ.","سَأَلَهُ الطَّبِيبُ: هَلْ تُنَظِّفُ أَسْنَانَكَ كُلَّ يَوْمٍ؟","قَالَ خَالِدٌ: لَا، لَا أُنَظِّفُهَا كُلَّ يَوْمٍ، وَآكُلُ الْحَلْوَى كَثِيرًا.","فَحَصَ الطَّبِيبُ السِّنَّ وَقَالَ: عِنْدَكَ تَسَوُّسٌ، تَحْتَاجُ إِلَى حَشْوٍ.","بَعْدَ نِصْفِ سَاعَةٍ انْتَهَى الْعِلَاجُ، وَأَعْطَاهُ الطَّبِيبُ وَصْفَةً طِبِّيَّةً.","قَالَ الطَّبِيبُ: يَجِبُ أَنْ تُنَظِّفَ أَسْنَانَكَ مَرَّتَيْنِ فِي الْيَوْمِ. شَفَاكَ اللهُ!"],"uz":"Xolid tishida qattiq og'riq sezdi va kechasi yaxshi uxlay olmadi. Ertalab klinikaga navbat oldi va soat o'nda bordi. Shifokor undan so'radi: Tishlaringizni har kuni tozalaysizmi? Xolid: Yo'q, har kuni tozalamayman, shirinlikni ko'p yeyman, dedi. Shifokor tishni tekshirib: Sizda karies bor, plomba kerak, dedi. Yarim soatdan keyin davolash tugadi, shifokor unga retsept berdi. Shifokor: Tishlaringizni kuniga ikki marta tozalashingiz kerak. Alloh shifo bersin!","savollar":[["لِمَاذَا لَمْ يَنَمْ خَالِدٌ جَيِّدًا؟","Xolid nega yaxshi uxlamadi?","لِأَنَّهُ شَعَرَ بِأَلَمٍ فِي سِنِّهِ."],["هَلْ يُنَظِّفُ خَالِدٌ أَسْنَانَهُ كُلَّ يَوْمٍ؟","Xolid tishini har kuni tozalaydimi?","لَا، لَا يُنَظِّفُهَا كُلَّ يَوْمٍ."],["مَاذَا قَالَ الطَّبِيبُ بَعْدَ الْفَحْصِ؟","Tekshiruvdan keyin shifokor nima dedi?","عِنْدَكَ تَسَوُّسٌ، تَحْتَاجُ إِلَى حَشْوٍ."],["كَمْ مَرَّةً يَجِبُ أَنْ يُنَظِّفَ أَسْنَانَهُ؟","Necha marta tozalashi kerak?","مَرَّتَيْنِ فِي الْيَوْمِ."]],"gloss":[]},"lugat":[["لَا بَأْسَ عَلَيْكَ","Hechqisi yo'q, tuzalib ketasiz"],["سَيَّارَةُ الْإِسْعَافِ","Tez yordam mashinasi"],["عَاجِلٌ","Tez, shoshilinch"],["كَلَامٌ","Gap, so'z"],["وَصْفَةٌ طِبِّيَّةٌ","Retsept (dori yozuvi)"],["حَشَا","To'ldirmoq; plombalamoq"],["شَفَاكَ اللهُ","Alloh shifo bersin"],["مُلَوَّثٌ","Ifloslangan"],["اِسْتَجَابَ","Javob qaytarmoq, ijobat qilmoq"],["تَسَوُّسُ الْأَسْنَانِ","Tish kariesi (chirishi)"],["أَرْجُو لَكَ الشِّفَاءَ الْعَاجِلَ","Tez shifo tilayman"],["مَعْجُونٌ","Pasta (tish pastasi)"],["حَافَظَ","Saqlamoq, muhofaza qilmoq"],["أَلَمٌ","Og'riq"],["بَطْنٌ","Qorin"],["جَزَاكَ اللهُ خَيْرًا","Alloh yaxshi mukofot bersin"],["اَلرَّاحَةُ","Dam olish, orom"],["اَلْعُشْبُ","O't, maysa"],["رَجَا","Umid qilmoq, iltimos qilmoq"],["حَشْوُ الْأَسْنَانِ","Tish plombalash"],["سِنٌّ","Tish"],["إِذَا","Agar"],["حَجَزَ","Band qilmoq (joy, navbat)"],["نِصْفٌ","Yarim"],["نَظَّفَ","Tozalamoq"],["فَحَصَ","Tekshirmoq (tibbiy)"],["اِسْتَطَاعَ","Qodir bo'lmoq, ...olmoq"],["أَرْسَلَ","Yubormoq"],["اَلصِّحَّةُ","Sog'liq, salomatlik"],["أُسْلُوبُ النَّفْيِ","Inkor uslubi"],["اِسْتَلْقَى","Cho'zilmoq, yonboshlamoq"],["اَلْحُضُورُ","Kelish, hozir bo'lish"],["عَلَى الْأَكْثَرِ","Ko'pi bilan"]],"test":[["Arab tilida fe'liy gap (الجملة الفعلية) qaysi tartibda boshlanadi ِيعُ أَنْ تَتَنَاوَلَ الدَّوَاءَ","يَجِبُ أَنْ تَتَنَاوَلَ الدَّوَاءَ","شُكْرًا لَكَ عَلَى الدَّوَاءِ","أَشْعُرُ بِتَنَاوُلِ الدَّوَاءِ"],1,"يَجِبُ أَنْ = ...kerak: يَجِبُ أَنْ تَتَنَاوَلَ الدَّوَاءَ (dori ichishing kerak)."],["Bemorga sog'liq tilanganda keng qo'llaniladigan ibora qaysi?",["شَفَاكَ اللهُ","جَزَاكَ اللهُ خَيْرًا","شُكْرًا لَكَ عَلَى مُسَاعَدَتِكَ","أَسْتَطِيعُ الآنَ"],0,"شَفَاكَ اللهُ = Alloh senga shifo bersin."]],"lvl":"A1","n":10},"a1_11":{"id":"a1_11","mavzu":"Sport va xobbi; ishora (uzoq/yaqin), sifat-mavsuf","qoidalar":[["Ishora olmoshlari","Yaqin: هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ. Uzoq: ذَلِكَ (m)، تِلْكَ (f va jonsiz ko'plik)، أُولَئِكَ (odamlar ko'pligi)."],["Sifat-mavsuf (na't)","Sifat mavsufga 4 jihatdan mos: jins, son, aniqlik, kelishik: أَطْفَالٌ نَائِمُونَ، الرِّيَاضَةُ الْمُفِيدَةُ، فِي النَّادِي الْكَبِيرِ."],["Taqiq (نَهْيٌ)","لَا + muzori' majzum: لَا تَلْعَبْ، لَا تَتَأَخَّرِي، لَا تَبْتَعِدُوا."],["Takrorlik ravishlari","يَوْمِيًّا har kuni · أُسْبُوعِيًّا har hafta · نِهَايَةُ الْأُسْبُوعِ hafta oxiri · خَاصَّةً ayniqsa."]],"muhodasa":[["مَا هِوَايَتُكَ الْمُفَضَّلَةُ؟","Sevimli mashg'ulotingiz nima?","هِوَايَتِي الْقِرَاءَةُ / السِّبَاحَةُ / ..."],["أَيُّ رِيَاضَةٍ تُمَارِسُ؟ فَرْدِيَّةٌ أَمْ جَمَاعِيَّةٌ؟","Qaysi sport bilan shug'ullanasiz?","..."],["كَمْ مَرَّةً تَذْهَبُ إِلَى النَّادِي أُسْبُوعِيًّا؟","Klubga haftada necha marta borasiz?","..."],["مَاذَا تَفْعَلُ فِي نِهَايَةِ الْأُسْبُوعِ؟","Hafta oxirida nima qilasiz?","..."],["هَلِ الْأَلْعَابُ الْإِلِكْتُرُونِيَّةُ مُفِيدَةٌ أَمْ فِيهَا ضَرَرٌ؟","Elektron o'yinlar foydalimi yoki zararli?","..."],["مَا فَوَائِدُ الْمَشْيِ لِلْجِسْمِ؟","Piyoda yurishning tanaga foydasi?","يُقَوِّي الْقَلْبَ وَالْعَضَلَاتِ."],["هَلْ تُحِبُّ كُرَةَ الْقَدَمِ؟ أَيُّ فَرِيقٍ تُشَجِّعُ؟","Futbolni yoqtirasizmi?","..."],["(uzoqdagi narsani ko'rsatib) مَا ذَلِكَ؟ مَا تِلْكَ؟","Anavi nima?","ذَلِكَ ... / تِلْكَ ..."],["«Anavi stullar» (jonsiz ko'plik, uzoq)","","تِلْكَ الْكَرَاسِيُّ"],["«Anavilar talabalar» (uzoq, odamlar)","","أُولَئِكَ طُلَّابٌ"],["Farzandingizga taqiq: «Kech qolma!» / ko'plikka: «Uzoqlashmanglar!»","","لَا تَتَأَخَّرْ! · لَا تَبْتَعِدُوا!"]],"faoliyat":"«Xobbi so'rovnomasi»: har o'quvchi guruhdan 3 kishiga «مَا هِوَايَتُكَ؟ كَمْ مَرَّةً …؟» deb so'raydi va natijani sifat-mavsuf bilan aytadi: أَكْثَرُ الطُّلَّابِ يُحِبُّونَ الرِّيَاضَةَ الْجَمَاعِيَّةَ.","matn":{"sarlavha":"هِوَايَاتُ أُسْرَتِي","sarlavha_uz":"Oilamning xobbilari","ar":["لِكُلِّ فَرْدٍ فِي أُسْرَتِي هِوَايَةٌ مُفَضَّلَةٌ.","أَبِي يُحِبُّ الْمَشْيَ، وَيَمْشِي يَوْمِيًّا فِي الْحَدِيقَةِ الْقَرِيبَةِ.","أُمِّي تُحِبُّ التَّطْرِيزَ، وَتِلْكَ السِّتَارَةُ الْجَمِيلَةُ مِنْ عَمَلِهَا.","أَخِي الصَّغِيرُ يَلْعَبُ كُرَةَ السَّلَّةِ فِي النَّادِي أُسْبُوعِيًّا.","أَمَّا أَنَا فَأُحِبُّ السِّبَاحَةَ وَالتَّصْوِيرَ، خَاصَّةً فِي الصَّيْفِ.","أُخْتِي تُحِبُّ الْأَلْعَابَ الْإِلِكْتُرُونِيَّةَ، وَلَكِنَّ أَبِي يَقُولُ لَهَا: لَا تَلْعَبِي طَوَالَ الْوَقْتِ!","فِي نِهَايَةِ الْأُسْبُوعِ نَحُلُّ الْأَلْغَازَ مَعًا لِتَنْشِيطِ الْعَقْلِ."],"uz":"Oilamdagi har bir a'zoning sevimli mashg'uloti bor. Otam piyoda yurishni yaxshi ko'radi, har kuni yaqindagi bog'da yuradi. Onam kashtachilikni yoqtiradi, anavi chiroyli parda uning ishi. Ukam klubda har hafta basketbol o'ynaydi. Menga kelsak, suzish va suratga olishni yaxshi ko'raman, ayniqsa yozda. Singlim elektron o'yinlarni yoqtiradi, lekin otam unga: butun vaqt o'ynama! deydi. Hafta oxirida aqlni charxlash uchun birga boshqotirma yechamiz.","savollar":[["أَيْنَ يَمْشِي الْأَبُ؟","Ota qayerda yuradi?","فِي الْحَدِيقَةِ الْقَرِيبَةِ."],["مَا هِوَايَةُ الْأُمِّ؟","Onaning xobbisi?","التَّطْرِيزُ."],["مَاذَا يَقُولُ الْأَبُ لِلْبِنْتِ؟","Ota qiziga nima deydi?","لَا تَلْعَبِي طَوَالَ الْوَقْتِ!"],["لِمَاذَا يَحُلُّونَ الْأَلْغَازَ؟","Nega boshqotirma yechishadi?","لِتَنْشِيطِ الْعَقْلِ."]],"gloss":[]},"lugat":[["ثُنَائِيٌّ","Ikki kishilik (juftlik)"],["ذَلِكَ","Ana u (muzakkar, uzoqdagi)"],["يَوْمِيًّا","Har kuni"],["فَرْدِيٌّ","Yakka ( rioqil ko'plik uchun","Yaqindagi muannas birlik uchun","Uzoqdagi aqlli ko'plik uchun"],1,"تِلْكَ — uzoqdagi muannas birlik va aqlsiz ko'plik uchun."],["Bo'sh joyni to'ldiring: «شَاهَدْتُ سَيَّارَةً ___».",["كَبِيرَةً","كَبِيرٌ","كَبِيرَةٌ","كِبَارٌ"],0,"سَيَّارَةً — muannas va mansub (maf'ul), sifat ham: كَبِيرَةً."],["«Aka-ukam kitob yig'ishni yaxshi ko'radi» gapidagi «kitob yig'ish» qanday aytiladi?",["جَمْعُ الْكُتُبِ","مُمَارَسَةُ الرِّيَاضَةِ","مُشَاهَدَةُ الْبَحْرِ","الْأَلْعَابُ الْإِلِكْتْرُونِيَّةُ"],0,"جَمْعُ الْكُتُبِ = kitoblar to'plash."],["«شَاهَدْتُ مَشْهَدَ الْبَحْرِ الْجَمِيلِ» gapidagi sifat qaysi so'z?",["شَاهَدْتُ","مَشْهَدَ","الْبَحْرِ","الْجَمِيلِ"],3,"الْجَمِيلِ (go'zal) — sifat; الْبَحْرِ — mavsuf."],["«Haftalik / Har hafta» ma'nosini anglatuvchi so'zni toping.",["أُسْبُوعِيًّا","يَوْمِيًّا","شَهْرِيًّا","سَنَوِيًّا"],0,"أُسْبُوعِيًّا = haftalik / har hafta."],["«Shifokor ko'p kitob o'qishni maslahat beradi» gapidagi «maslahat beradi» fe'li qaysi?",["يُمَارِسُ","يَنْصَحُ","يُفَضِّلُ","يُحِبُّ"],1,"يَنْصَحُ = maslahat beradi."],["Bo'sh joyni to'ldiring: «وَضَعْتُ الْكُتُبَ فِي ___ الْجَدِيدَةِ».",["الْحَقِيبَةِ","الْبَيْتِ","الْمَلْعَبِ","الْعَمَلِ"],0,"«الْجَدِيدَةِ» — muannas, mos so'z الْحَقِيبَةِ (yangi sumka)."],["«هَؤُلَاءِ الرِّجَالُ يُمَارِسُونَ الرِّيَاضَةَ» gapidagi «هَؤُلَاءِ» olmoshini uzoqlik shakliga o'zgartiring.",["تِلْكَ","ذَلِكَ","أُولَئِكَ","هَذِهِ"],2,"هَؤُلَاءِ (yaqin, aqlli ko'plik) → أُولَئِكَ (uzoq)."],["«Yaqindagi ikkita qiz bola» uchun qaysi ko'rsatkich olmoshi ishlatiladi?",["هَذَانِ","هَاتَانِ","هَؤُلَاءِ","هَذِهِ"],1,"Muannas ikkilik yaqin → هَاتَانِ."],["«الْهِوَايَاتُ الْمَنْزِلِيَّةُ» birikmasining ma'nosi nima?",["Foydali sevimli mashg'ulotlar","Uy sharoitidagi (ichkaridagi) sevimli mashg'ulotlar","Sport mashg'ulotlari","Kundalik vazifalar"],1,"الْمَنْزِلِيَّةُ = uy sharoitidagi; uy sevimli mashg'ulotlari."],["Bo'sh joyga mos sifatni tanlang: «يَسْكُنُ فِي بَيْتٍ ___».",["وَاسِعٍ","وَاسِعَةٌ","وَاسِعٌ","وَاسِعًا"],0,"بَيْتٍ — majrur (harfi jardan keyin), sifat ham majrur: وَاسِعٍ."],["To'g'ri sifat-mavsuf birikmasini aniqlang.",["الْأَلْعَابِ الْإِلِكْتْرُونِيَّةِ","الْأَلْعَابِ الْإِلِكْتْرُونِيُّ","أَلْعَابٌ الْإِلِكْتْرُونِيَّةِ","الْأَلْعَابِ إِلِكْتْرُونِيَّةٌ"],0,"Mavsuf va sifat aniqlik va kelishikda mos: الْأَلْعَابِ الْإِلِكْتْرُونِيَّةِ."]],"lvl":"A1","n":11},"a1_12":{"id":"a1_12","mavzu":"Kundalik tartib; ismut-tafzil, bog'lovchilar, buyruq","qoidalar":[["Ismut-tafzil (qiyos)","أَفْعَلُ + مِنْ: أَكْبَرُ مِنْ، أَسْرَعُ مِنْ، أَوْسَعُ مِنْ. Eng …: أَكْبَرُ مَدِينَةٍ / الْأَكْبَرُ."],["Bog'lovchilar","وَ va · ثُمَّ so'ng · فَـ keyin darhol · أَوْ yoki · لَكِنَّ lekin · أَمَّا … فَـ …ga kelsak."],["أَنْ + muzori' mansub","أُرِيدُ أَنْ أَتَنَاوَلَ · يَجِبُ أَنْ تَنَامَ مُبَكِّرًا."],["Buyruq va taqiq","اِذْهَبْ، اِذْهَبِي، اِذْهَبُوا · لَا تَذْهَبْ، لَا تَذْهَبُوا."]],"muhodasa":[["مَتَى تَسْتَيْقِظُ عَادَةً؟","Odatda qachon uyg'onasiz?","أَسْتَيْقِظُ فِي السَّاعَةِ ..."],["مَاذَا تَفْعَلُ بَعْدَ الِاسْتِيقَاظِ؟","Uyg'ongach nima qilasiz?","أَتَوَضَّأُ، ثُمَّ أُصَلِّي، ثُمَّ ..."],["كَيْفَ تَقْضِي يَوْمَ الْعُطْلَةِ؟","Dam olish kunini qanday o'tkazasiz?","..."],["مَتَى تَنَامُ؟ هَلْ تَنَامُ مُبَكِّرًا أَمْ مُتَأَخِّرًا؟","Qachon uxlaysiz?","..."],["مَنْ أَكْبَرُ: أَنْتَ أَمْ أَخُوكَ؟","Kim katta: siz yoki akangiz?","أَخِي أَكْبَرُ مِنِّي."],["أَيُّهُمَا أَسْرَعُ: الْقِطَارُ أَمِ السَّيَّارَةُ؟","Qaysi tezroq: poyezd yoki mashina?","الْقِطَارُ أَسْرَعُ مِنَ السَّيَّارَةِ."],["مَا أَجْمَلُ مَدِينَةٍ فِي أُوزْبَكِسْتَانَ؟","O'zbekistondagi eng go'zal shahar?","أَجْمَلُ مَدِينَةٍ ..."],["مَاذَا تُرِيدُ أَنْ تَفْعَلَ فِي الْعُطْلَةِ الْقَادِمَةِ؟","Keyingi dam olishda nima qilmoqchisiz?","أُرِيدُ أَنْ ..."],["«Tezroq», «kengroq», «eng katta shahar»","","أَسْرَعُ · أَوْسَعُ · أَكْبَرُ مَدِينَةٍ"],["Talabalarga (ko'plik) buyruq: «Boringlar!», taqiq: «Kech qolmanglar!»","","اِذْهَبُوا! · لَا تَتَأَخَّرُوا!"],["«Akam o'qiydi, men esa ishlayman» (أَمَّا … فَـ)","","أَخِي يَدْرُسُ، أَمَّا أَنَا فَأَعْمَلُ."]],"faoliyat":"«Kun tartibi taqqoslash»: juftlik bir-birining kunini so'raydi va ismut-tafzil bilan solishtiradi: أَنَا أَسْتَيْقِظُ أَبْكَرَ مِنْكَ، أَمَّا أَنْتَ فَتَنَامُ أَكْثَرَ مِنِّي.","matn":{"sarlavha":"يَوْمُ الْجُمُعَةِ","sarlavha_uz":"Juma kuni","ar":["يَوْمُ الْجُمُعَةِ أَجْمَلُ يَوْمٍ فِي الْأُسْبُوعِ عِنْدِي.","أَسْتَيْقِظُ قَبْلَ شُرُوقِ الشَّمْسِ، فَأَتَوَضَّأُ وَأُصَلِّي الْفَجْرَ.","ثُمَّ أُرَتِّبُ غُرْفَتِي، وَأَكْوِي مَلَابِسِي، وَأَغْتَسِلُ لِلصَّلَاةِ.","أَبِي يَذْهَبُ إِلَى الْمَسْجِدِ مُبَكِّرًا، أَمَّا أَنَا فَأَذْهَبُ مَعَ أَخِي الصَّغِيرِ.","بَعْدَ الصَّلَاةِ تَجْتَمِعُ الْأُسْرَةُ عَلَى الْغَدَاءِ، وَأُمِّي تُجَهِّزُ أَطْبَاقًا كَثِيرَةً.","عَصْرًا نَذْهَبُ إِلَى الْحَدِيقَةِ أَوْ إِلَى الْمَقْهَى.","تَقُولُ أُمِّي: لَا تَنَامُوا مُتَأَخِّرِينَ، غَدًا يَوْمُ عَمَلٍ!"],"uz":"Men uchun juma — haftaning eng go'zal kuni. Quyosh chiqishidan oldin uyg'onaman, tahorat olib bomdodni o'qiyman. So'ng xonamni yig'ishtiraman, kiyimlarimni dazmollayman va juma uchun g'usl qilaman. Otam masjidga erta boradi, men esa ukam bilan boraman. Namozdan keyin oila tushlikka yig'iladi, onam ko'p taomlar tayyorlaydi. Asrda bog'ga yoki qahvaxonaga boramiz. Onam aytadi: kech yotmanglar, ertaga ish kuni!","savollar":[["مَا أَجْمَلُ يَوْمٍ عِنْدَ الْكَاتِبِ؟","Muallif uchun eng go'zal kun?","يَوْمُ الْجُمُعَةِ."],["مَاذَا يَفْعَلُ قَبْلَ الصَّلَاةِ؟","Namozdan oldin nima qiladi?","يُرَتِّبُ غُرْفَتَهُ وَيَكْوِي مَلَابِسَهُ وَيَغْتَسِلُ."],["مَعَ مَنْ يَذْهَبُ إِلَى الْمَسْجِدِ؟","Masjidga kim bilan boradi?","مَعَ أَخِيهِ الصَّغِيرِ."],["مَاذَا تَقُولُ الْأُمُّ؟","Ona nima deydi?","لَا تَنَامُوا مُتَأَخِّرِينَ."]],"gloss":[]},"lugat":[["اِغْتَسَلَ","Cho'milmoq, g'usl qilmoq"],["جَهَّزَ","Tayyorlamoq, hozirlamoq"],["غَسَلَ","Yuvmoq"],["مِنْ أَجْلِ","...uchun, maqsadida"],["طَبَقٌ","Likop, idish"],["بَطَّةٌ","O'rdak"],["مَقْهَى","Qahvaxona"],["عَادَةً","Odatda"],["نَامَ","Uxlamoq"],["بَطِيءٌ","Sekin"],["رَتَّبَ","Tartiblamoq, yig'ishtirm قُولُ سَعِيدٌ: الصَّدِيقُ الْحَقِيقِيُّ يَتَحَمَّلُ مَشَقَّةَ الطَّرِيقِ مِنْ أَجْلِ صَدِيقِهِ."],"uz":"Said tillarni o'rganish saytida misrlik bir yigit bilan tanishdi. Said unga arabcha yozar, yigit esa tez javob qaytarib, xatolarini tuzatardi. Ikki yildan beri ular har hafta gaplashishadi. O'tgan Ramazonda yigit Saidning shahriga keldi va ular ilk bor uchrashdi. Said dedi: Savollaring oson edi, lekin izohlaring juda foydali bo'ldi! Ular birga ro'za tutib, Saidning oilasida iftor qilishdi. Endi do'stliklari mustahkam. Said aytadi: haqiqiy do'st do'sti uchun yo'l mashaqqatini ko'taradi.","savollar":[["أَيْنَ تَعَرَّفَ سَعِيدٌ عَلَى صَدِيقِهِ؟","Said do'sti bilan qayerda tanishdi?","فِي مَوْقِعٍ لِتَعَلُّمِ اللُّغَاتِ."],["مُنْذُ مَتَى يَتَكَلَّمَانِ؟","Qachondan beri gaplashishadi?","مُنْذُ سَنَتَيْنِ."],["مَتَى الْتَقَيَا لِأَوَّلِ مَرَّةٍ؟","Birinchi marta qachon uchrashishdi?","فِي رَمَضَانَ الْمَاضِي."],["مَا رَأْيُكَ فِي كَلَامِ سَعِيدٍ الْأَخِيرِ؟","Saidning oxirgi gapiga fikringiz?","(erkin javob)"]],"gloss":[["شَابٌّ","yigit"],["يُصَحِّحُ","tuzatadi"],["أَخْطَاءٌ","xatolar"]]},"lugat":[["لَا أَدْرِي","Bilmayman"],["جَمَعَ","Yig'moq, to'plamoq"],["رَدَّ","Javob qaytarmoq"],["شَتْوِيٌّ","Qishki"],["اَلصَّدَاقَةُ","Do'stlik"],["دِرَاسِيٌّ","O'quv (ga oid)"],["وَاجِهَةٌ","Peshtoq, vitrina"],["اِنْتَبِهْ","Diqqat qil, e'tibor ber"],["مَوْقِعٌ","Sayt; joylashuv o'rni"],["اَلطُّفُولَةُ","Bolalik"],["خَفَّضَ","Tushirmoq, arzonlashtirmoq"],["تَحَمَّلَ","Ko'tarmoq, chidamoq"],["أَزْعَجَ","Bezovta qilmoq"],["اِلْتَقَى","Uchrashmoq"],["كُلُّ شَيْءٍ عَلَى مَا يُرَامُ","Hammasi joyida"],["اَلْمِلْحُ","Tuz"],["عُصْفُورٌ","Chumchuq, qushcha"],["غَضِبَ","G'azablanmoq"],["رَمَضَانُ","Ramazon (oyi)"],["مَنْزِلِيٌّ","Uyga oid, uy-ro'zg'or"],["اَلْمُشَارَكَةُ","Ulashish; ishtirok"],["تَكَلَّمَ","Gapirmoq, so'zlashmoq"],["هَكَذَا","Shunday, shu tarzda"],["هَوِّنْ عَلَيْكَ","O'zingni bos, yengil ol"],["أَرْنَبٌ","Quyon"],["مُنْذُ","...dan beri"],["أَفْسَدَ","Buzmoq, ishdan chiqar ,"Faoil — yashirin olmosh «هُوَ» (mustatir)."],["Gapdagi faoil (ega) va uning turini toʻgʻri aniqlang:\nأَنْتُنَّ تَعْرِفْنَ أَنَّ العُطْلَةَ قَرِيبَةٌ.",["الفَاعِل: أَنْتُنَّ / نَوْعُهُ: اِسْمٌ ظَاهِرٌ","الفَاعِل: النُّون (نَ) فِي تَعْرِفْنَ / نَوْعُهُ: ضَمِيرٌ مُتَّصِلٌ","الفَاعِل: ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ أَنْتُنَّ","الفَاعِل: العُطْلَةَ / نَوْعُهُ: اِسْمٌ ظَاهِرٌ"],1,"Faoil — «تَعْرِفْنَ» dagi nun-niswa (ضمير متصل)."],["Gapdagi faoil (ega) va uning turini toʻgʻri aniqlang:\nهَلْ تُرِيدُونَ أَنْ تَجْلِسُوا فِي الشُّرْفَةِ؟",["الفَاعِل: الشُّرْفَةِ / نَوْعُهُ: اِسْمٌ ظَاهِرٌ","الفَاعِل: ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ أَنْتُمْ","الفَاعِل: الوَاو (واو الجماعة) فِي تُرِيدُونَ وتَجْلِسُوا / نَوْعُهُ: ضَمِيرٌ مُتَّصِلٌ","لَيْسَ فِيهَا فَاعِل"],2,"Faoil — «تُرِيدُونَ/تَجْلِسُوا» dagi vav-jamoa (ضمير متصل)."],["Gapdagi faoil (ega) va uning turini toʻgʻri aniqlang:\nأَيْنَ حُسَامٌ؟ - لَقَدْ خَرَجَ قَبْلَ قَلِيلٍ.",["الفَاعِل: حُسَامٌ / نَوْعُهُ: اِسْمٌ ظَاهِرٌ","الفَاعِل: ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ هُوَ","الفَاعِل: قَلِيلٍ / نَوْعُهُ: اِسْمٌ ظَاهِرٌ","الفَاعِل: ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ أَنَا"],1,"«خَرَجَ» — faoil yashirin «هُوَ» (Husomga qaytadi)."],["Berilgan grammatik tavsifga mos gapni tanlang:\n(فِعْل مَاضٍ + فَاعِل ضَمِير مُتَّصِل لِلْمُتَكَلِّمِ \"أَنَا\"):",["كَتَبْتُ الرِّسَالَةَ أَمْسِ.","أَكْتُبُ الرِّسَالَةَ الآنَ.","كَتَبْنَا الرِّسَالَةَ أَمْسِ.","كَتَبْتَ الرِّسَالَةَ."],0,"Maziy + «تُ» (mutakallim «أَنَا»): «كَتَبْتُ»."],["Berilgan grammatik tavsifga mos gapni tanlang:\n(فِعْل مُضَارِع + وَاوُ الجَمَاعَةِ):",["الطُّلَّابُ كَتَبُوا الدَّرْسَ.","الطُّلَّابُ يَكْتُبُونَ الدَّرْسَ.","الطَّالِبَاتُ يَكْتُبْنَا الدَّرْسَ.","يَكْتُبُ الطُّلَّابُ الدَّرْسَ."],1,"Muzori + vav-jamoa: «يَكْتُبُونَ»."],["Berilgan grammatik tavsifga mos gapni tanlang:\n(فِعْل أَمْر + يَاءُ المُخَاطَبَةِ):",["اِجْلِسْ يَا مُحَمَّدُ.","اِجْلِسُوا يَا رِجَالُ.","اِجْلِسِي يَا فَاطِمَةُ.","تَجْلِسِينَ يَا فَاطِمَةُ."],2,"Amr + ya-muxotaba: «اِجْلِسِي»."],["Berilgan grammatik tavsifga mos gapni tanlang:\n(فِعْل مُضَارِع + فَاعِل يَعُودُ عَلَى \"هُمَا\" - ألف الاثنين):",["الرَّجُلَانِ سَافَرَا أَمْسِ.","الرَّجُلَانِ يُسَافِرَانِ الآنَ.","هُمَا سَافَرُوا.","الرَّجُلَانِ سَيُسَافِرُ."],1,"Muzori + alif-isnayn («هُمَا»): «يُسَافِرَانِ»."],["Berilgan grammatik tavsifga mos gapni tanlang:\n(فِعْل مَاضٍ + فَاعِل ضَمِير مُتَّصِل \"أَنْتُمَا\"):",["هَلْ فَهِمْتُمَا الدَّرْسَ؟","هَلْ تَفْهَمَانِ الدَّرْسَ؟","هَلْ فَهِمْتُمْ الدَّرْسَ؟","اِفْهَمَا الدَّرْسَ."],0,"Maziy + «تُمَا» («أَنْتُمَا»): «فَهِمْتُمَا»."],["Soʻzlardan toʻgʻri tartibli, maʼnoli gap tuzing:\n(لِأُمِّي - حِجَابًا - اِشْتَرَيْتُ - هَدِيَّةً)",["حِجَابًا هَدِيَّةً لِأُمِّي اِشْتَرَيْتُ.","اِشْتَرَيْتُ حِجَابًا هَدِيَّةً لِأُمِّي.","لِأُمِّي هَدِيَّةً حِجَابًا اِشْتَرَيْتُ.","اِشْتَرَيْتُ لِأُمِّي هَدِيَّةً حِجَابًا."],1,"Toʻgʻri tartib: fe'l + ega + ... : «اِشْتَرَيْتُ حِجَابًا هَدِيَّةً لِأُمِّي»."],["Soʻzlardan toʻgʻri tartibli, maʼnoli gap tuzing:\n(السَّائِقُ - المُنَاسِبِ - وَصَلَ - فِي - المَوْعِدِ)",["وَصَلَ السَّائِقُ فِي المَوْعِدِ المُنَاسِبِ.","فِي المَوْعِدِ المُنَاسِبِ السَّائِقُ وَصَلَ.","وَصَلَ فِي المَوْعِدِ السَّائِقُ المُنَاسِبِ.","السَّائِقُ المُنَاسِبِ وَصَلَ فِي المَوْعِدِ."],0,"Toʻgʻri tartib: «وَصَلَ السَّائِقُ فِي المَوْعِدِ المُنَاسِبِ»."],["Soʻzlardan toʻgʻri tartibli, maʼnoli gap tuzing:\n(تَجْهِيزِ - أُمِّي - تُسَاعِدُ - الطَّعَامِ - أُخْتِي - فِي)",["تُسَاعِدُ أُمِّي أُخْتِي فِي تَجْهِيزِ الطَّعَامِ.","فِي تَجْهِيزِ الطَّعَامِ أُخْتِي تُسَاعِدُ أُمِّي.","تُسَاعِدُ أُخْتِي أُمِّي فِي تَجْهِيزِ الطَّعَامِ.","أُخْتِي أُمِّي تُسَاعِدُ فِي تَجْهِيزِ الطَّعَامِ."],2,"Maʼno: opa onaga yordam beradi: «تُسَاعِدُ أُخْتِي أُمِّي فِي تَجْهِيزِ الطَّعَامِ»."],["Soʻzlardan toʻgʻri tartibli, maʼnoli gap tuzing:\n(حَفْلَةٌ - صَدِيقِي - هُنَاكَ - فِي - بَيْتِ - اليَوْمَ)",["اليَوْمَ هُنَاكَ فِي بَيْتِ صَدِيقِي حَفْلَةٌ.","هُنَاكَ حَفْلَةٌ فِي بَيْتِ صَدِيقِي اليَوْمَ.","فِي بَيْتِ صَدِيقِي هُنَاكَ حَفْلَةٌ اليَوْمَ.","حَفْلَةٌ صَدِيقِي بَيْتِ فِي اليَوْمَ هُنَاكَ."],1,"Tabiiy tartib: «هُنَاكَ حَفْلَةٌ فِي بَيْتِ صَدِيقِي اليَوْمَ»."]],"lvl":"A2","n":2},"a2_3":{"id":"a2_3","mavzu":"Uy jihozlari, mehmonxona; maf'ul olmoshi","qoidalar":[["Fe'lga qo'shilgan olmosh (maf'ul)","ـنِي meni · ـكَ/ـكِ seni · ـهُ uni (m) · ـهَا (f) · ـنَا bizni · ـكُمْ sizlarni · ـهُمْ/ـهُنَّ ularni: اسْتَقْبَلَنِي، رَأَيْتُكِ، سَاعَدَهُنَّ."],["Fe'l — foil — maf'ul","لَبِسَ مَحْمُودٌ قَمِيصًا · يَرْكَبُ الْمُسَافِرُ الْقِطَارَ. Maf'ul mansub (fatha / tanvin fatha)."],["Predlogli sifatlar","قَرِيبٌ مِنْ · بَعِيدٌ عَنْ · يُطِلُّ عَلَى · أَقَلُّ مِنْ / أَكْثَرُ مِنْ."],["Mehmonxona iboralari","تَحْتَ أَمْرِكَ · لَا شُكْرَ عَلَى وَاجِبٍ · فِي أَسْرَعِ وَقْتٍ · وَقْتَمَا تُحِبُّ."]],"muhodasa":[["مَا أَهَمُّ جِهَازٍ فِي مَطْبَخِكَ؟","Oshxonangizdagi eng muhim jihoz?","الثَّلَّاجَةُ / الْفُرْنُ / الْخَلَّاطُ ..."],["هَلْ عِنْدَكُمْ غَسَّالَةُ أَطْبَاقٍ؟ هَلْ تَحْتَاجُونَهَا؟","Idish yuvish mashinangiz bormi?","..."],["صِفْ غُرْفَةَ الْجُلُوسِ فِي بَيْتِكَ.","Mehmonxonangizni tasvirlang","..."],["هَلْ سَكَنْتَ فِي فُنْدُقٍ؟ كَيْفَ اسْتَقْبَلُوكَ؟","Mehmonxonada yashaganmisiz? Qanday kutib olishdi?","اسْتَقْبَلُونِي ..."],["هَلْ بَيْتُكَ قَرِيبٌ مِنَ الْمَسْجِدِ أَمْ بَعِيدٌ عَنْهُ؟","Uyingiz masjidga yaqinmi?","..."],["لَوِ اسْتَأْجَرْتَ شُقَّةً، مَاذَا تَسْأَلُ السِّمْسَارَ؟","Kvartira ijaraga olsangiz, dalloldan nima so'raysiz?","كَمْ مِسَاحَتُهَا؟ هَلْ فِيهَا سَخَّانٌ؟ ..."],["مَنْ سَاعَدَكَ فِي نَقْلِ الْأَثَاثِ آخِرَ مَرَّةٍ؟","Oxirgi marta mebel tashishda kim yordam berdi?","سَاعَدَنِي ..."],["مَا رَأْيُكَ: الْبَيْتُ أَفْضَلُ أَمِ الشُّقَّةُ؟","Hovli yaxshimi yoki kvartira?","..."],["«Mehmon keldi va otam UNI kutib oldi»","","وَصَلَ الضَّيْفُ وَاسْتَقْبَلَهُ أَبِي."],["«Men SENI (ayolga) ko'rdim»","","رَأَيْتُكِ"],["«Qo'riqchi SIZLARNI kirishdan to'sdi»","","مَنَعَكُمُ الْحَارِسُ مِنَ الدُّخُولِ."]],"faoliyat":"«Mehmonxona resepsiyasi»: bir o'quvchi — xodim, ikkinchisi — mehmon. Mehmon muammo aytadi (suv isitgich buzuq, xona shovqinli); xodim «تَحْتَ أَمْرِكَ، فِي أَسْرَعِ وَقْتٍ» bilan hal qiladi.","matn":{"sarlavha":"فِي الْفُنْدُقِ","sarlavha_uz":"Mehmonxonada","ar":["وَصَلَ عُمَرُ إِلَى الْفُنْدُقِ مُرْهَقًا بَعْدَ رِحْلَةٍ طَوِيلَةٍ.","اسْتَقْبَلَهُ الْمُوَظَّفُ بِابْتِسَامَةٍ، وَأَعْطَاهُ اسْتِمَارَةً، فَمَلَأَهَا عُمَرُ بِسُرْعَةٍ.","كَانَتِ الْغُرْفَةُ فِي الدَّوْرِ الرَّابِعِ، وَلَهَا نَافِذَةٌ تُطِلُّ عَلَى الْجَبَلِ.","فِي الْغُرْفَةِ سَرِيرٌ كَبِيرٌ، وَمِرْآةٌ، وَطَاوِلَةٌ مُسْتَدِيرَةٌ.","فِي اللَّيْلِ أَرَادَ عُمَرُ أَنْ يَغْتَسِلَ، وَلَكِنَّ السَّخَّانَ لَمْ يَعْمَلْ.","اتَّصَلَ بِالِاسْتِقْبَالِ، فَقَالَ الْمُوَظَّفُ: تَحْتَ أَمْرِكَ، سَنُرْسِلُ الْعَامِلَ فِي أَسْرَعِ وَقْتٍ.","بَعْدَ عَشْرِ دَقَائِقَ أَصْلَحَهُ الْعَامِلُ، فَشَكَرَهُ عُمَرُ، فَقَالَ: لَا شُكْرَ عَلَى وَاجِبٍ."],"uz":"Umar uzoq safardan so'ng holdan toyib mehmonxonaga yetib keldi. Xodim uni tabassum bilan kutib olib, anketa berdi, Umar uni tezda to'ldirdi. Xona to'rtinchi qavatda edi, derazasi tog'ga qaragan. Xonada katta karavot, ko'zgu va dumaloq stol bor. Kechasi Umar yuvinmoqchi bo'ldi, lekin suv isitgich ishlamadi. Resepsiyaga qo'ng'iroq qildi, xodim: Xizmatingizdaman, ishchini imkon qadar tez yuboramiz, dedi. O'n daqiqadan keyin ishchi uni tuzatdi. Umar unga rahmat aytdi, u: Arzimaydi, bu burchim, dedi.","savollar":[["كَيْفَ وَصَلَ عُمَرُ إِلَى الْفُنْدُقِ؟","Umar mehmonxonaga qanday holda keldi?","مُرْهَقًا."],["عَلَى مَاذَا تُطِلُّ النَّافِذَةُ؟","Deraza nimaga qaragan?","عَلَى الْجَبَلِ."],["مَا الْمُشْكِلَةُ فِي اللَّيْلِ؟","Kechasi qanday muammo bo'ldi?","السَّخَّانُ لَمْ يَعْمَلْ."],["فِي «أَصْلَحَهُ» — «ـهُ» مَنْ؟","«ـهُ» nimaga qaytadi?","السَّخَّانُ."]],"gloss":[["اِبْتِسَامَةٌ","tabassum"],["مَلَأَ","to'ldirdi"]]},"lugat":[["دَاخِلِيٌّ","Ichki"],["تَعَالَ","Kel! (buyruq)"],["عَقَارَاتٌ","Ko'chmas mulk"],["بِاسْتِمْرَارٍ","Doimiy ravishda, uzluksiz"],["خَادِمٌ","Xizmatkor"],["مُسْتَأْجِرٌ","Ijarachi"],["جُودَةٌ","Sifat (mahsulot sifati)"],["زَهْرَةٌ","Gul"],["خِدْمَةُ التَّوْصِيلِ","Yetkazib berish xizmati"],["مِسَاحَةٌ"
